<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quán Ăn Chợ Nổi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>
  html, body { margin: 0; height: 100%; background: #0b1622; color: #f7ecd6; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";
/*
 * Client chơi trực tiếp — nhóm HNTT (client/ui). CHỈ ĐỌC snapshot từ GET /state và gửi phím qua POST /input.
 * Trường nào snapshot chưa có thì bỏ qua (nhóm viết luật tới đâu, hình hiện tới đó).
 * Mọi hiệu ứng (bọt nước, sóng, đèn lồng, toast) chỉ ở client: không ảnh hưởng mô phỏng/headless.
 * Phím: WASD / mũi tên = di chuyển · E = interact · Space = catch · Esc/P = tạm dừng · R = chơi lại · L = nhật ký.
 * Shop: 1 = bình oxy · 2 = áo phao · Enter = đóng Shop. Menu/intro/kết quả: Enter, Space hoặc click.
 *
 * Phase 2 — luồng màn (docs/phase2.md mục 2):
 *   Menu chính → DayIntro → gather → EveningIntro → quan → DayResult → Shop → DayIntro … → Summary
 * Màn Menu/DayIntro/EveningIntro/DayResult chỉ ở client; trong lúc đó client xin server `hold` (sim đứng yên),
 * nên không có tick nào bị tiêu và headless không bị ảnh hưởng.
 * Xem trước khi chưa có mode day: /?mock=gather|quan|shop|dayintro|evening|result|summary|pause|menu
 */
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
let snap = null, offline = false, showLog = false;
const QS = new URLSearchParams(location.search);
const MOCK = QS.get("mock");

// ---------- màn hình client ----------
// screen: "menu" | "game" | "bye". Trong "game" có thể chồng: intro (day/evening), result (DayResult).
let screen = MOCK && MOCK !== "menu" ? "game" : (QS.has("play") ? "game" : "menu");
let intro = null;          // {kind: "day"|"evening", until: ms}
let result = null;         // {stats, day}: DayResult đang hiện
let menuSel = 0;
let buttons = [];          // vùng click của khung hình hiện tại: {x, y, w, h, on}
const INTRO_MS = 4000;

// ---------- vào: phím ----------
const down = new Set();
const MOVE_KEYS = { w: "u", arrowup: "u", s: "d", arrowdown: "d", a: "l", arrowleft: "l", d: "r", arrowright: "r" };
let queue = [], inflight = false, lastSent = "";

function currentInput() {
  const mode = snap ? (snap.phase || snap.mode) : "gather";
  const dx = (down.has("r") ? 1 : 0) - (down.has("l") ? 1 : 0);
  let dy = (down.has("d") ? 1 : 0) - (down.has("u") ? 1 : 0);   // gather: xuống = d dương
  if (mode === "quan") dy = -dy;                                // quan: lên (bắc) = z dương
  return { move: [dx, dy], interact: down.has("interact"), catch: down.has("catch") };
}
function pushInput() {
  const s = JSON.stringify(currentInput());
  if (s === lastSent) return;
  lastSent = s;
  queue.push(s);
  flush();
}
function post(path, obj) {
  if (MOCK) return;
  queue.push([path, obj === undefined ? "" : JSON.stringify(obj)]);
  flush();
}
async function flush() {
  if (inflight) return;
  inflight = true;
  while (queue.length) {
    const item = queue.shift();
    const [path, body] = Array.isArray(item) ? item : ["/input", item];
    if (MOCK) continue;
    try { await fetch(path, { method: "POST", body, headers: { "Content-Type": "application/json" } }); }
    catch (e) { /* mất kết nối: poll sẽ báo */ }
  }
  inflight = false;
}
function tapButton(name) {                 // một cạnh lên: nhấn rồi nhả
  post("/input", { [name]: true });
  post("/input", { [name]: false });
}
let holdSent = null;
let wantRun = null;                        // sau restart: chờ snapshot có run_id mới (giữ sim đứng tới lúc đó)
function syncHold() {                      // sim đứng yên khi client đang ở màn không chơi
  const want = screen !== "game" || !!intro || !!result || wantRun !== null;
  if (want !== holdSent) { holdSent = want; post("/hold", { hold: want }); }
}
function restartGame() {
  holdSent = true; post("/hold", { hold: true });   // giữ trước, rồi mới chơi lại -> intro không mất tick nào
  post("/restart");
  wantRun = MOCK ? null : (snap && snap.run_id !== undefined ? snap.run_id + 1 : 1);
  lastSent = ""; down.clear();
  intro = null; result = null; prevStage = null; resetRun();
}
function isPaused() { return !!snap && (snap.ui_paused || snap.state === "paused"); }
function togglePause() { if (snap && !snap.finished) post("/pause"); }
function clickAt(x, y) {
  for (const b of buttons) if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) { b.on(); return; }
}
cv.addEventListener("click", (e) => { const r = cv.getBoundingClientRect(); clickAt((e.clientX - r.left) / uiK, (e.clientY - r.top) / uiK); });

function keyName(e) { return e.key.toLowerCase(); }
const CONFIRM = (k) => k === "enter" || k === " ";
addEventListener("keydown", (e) => {
  const k = keyName(e);
  if (k === " " || k.startsWith("arrow")) e.preventDefault();
  if (e.repeat) return;
  if (k === "l") { showLog = !showLog; return; }
  // --- màn không chơi: chỉ điều hướng, không gửi phím vào sim ---
  if (screen === "menu") {
    if (k === "arrowup" || k === "w" || k === "arrowdown" || k === "s") menuSel = 1 - menuSel;
    else if (CONFIRM(k)) (menuSel === 0 ? startPlay : quitGame)();
    return;
  }
  if (screen === "bye") { if (CONFIRM(k)) screen = "menu"; return; }
  if (intro) { intro = null; return; }                    // DayIntro/EveningIntro: phím bất kỳ để vào
  if (result) { if (CONFIRM(k) || k === "e") result = null; return; }
  if (snap && snap.finished && (snap.mode === "day" || snap.reason === "days_complete")) { if (CONFIRM(k)) goMenu(); return; }
  if (k === "escape" || k === "p") { togglePause(); return; }
  if (isPaused()) {
    if (CONFIRM(k)) togglePause();
    else if (k === "m") goMenu();
    return;
  }
  if (k === "r") { restartGame(); return; }
  if (snap && snap.phase === "shop") {
    if (k === "1") buy("oxygen");
    else if (k === "2") buy("hp");
    else if (k === "enter") tapButton("shop_done");
    return;
  }
  if (MOVE_KEYS[k]) down.add(MOVE_KEYS[k]);
  else if (k === "e") down.add("interact");
  else if (k === " ") down.add("catch");
  pushInput();
});
addEventListener("keyup", (e) => {
  const k = keyName(e);
  if (MOVE_KEYS[k]) down.delete(MOVE_KEYS[k]);
  else if (k === "e") down.delete("interact");
  else if (k === " ") down.delete("catch");
  pushInput();
});
addEventListener("blur", () => { down.clear(); pushInput(); });
function startPlay() { screen = "game"; restartGame(); }
function quitGame() { screen = "bye"; try { window.close(); } catch (_) {} }
function goMenu() { if (isPaused()) togglePause(); restartGame(); screen = "menu"; }
function buy(id) { post("/input", { buy: id }); }

// ---------- ra: poll snapshot ----------
async function poll() {
  try {
    if (MOCK) { snap = await mockSnapshot(MOCK); offline = false; return; }   // mock: tải một lần
    const r = await fetch("/state", { cache: "no-store" });
    snap = await r.json();
    offline = false;
  } catch (e) { offline = true; }
  setTimeout(poll, 16);
}
async function mockSnapshot(kind) {
  const r = await fetch("/mock.json", { cache: "no-store" });
  const m = await r.json();
  const pick = { gather: "gather", dayintro: "gather", menu: "gather", quan: "quan", evening: "quan", result: "quan", pause: "gather" }[kind] || "shop";
  const s = Object.assign({ events: [], cfg: {}, meta: {} }, m[pick]);
  s.state = kind === "pause" ? "paused" : (kind === "shop" ? "playing" : s.state);
  if (kind === "summary") { s.finished = true; s.reason = "days_complete"; s.state = "finished"; s.days_completed = 5; s.day = 5; }
  try {                                    // mock không có server luật: lấy cfg/meta từ /state nếu server đang chạy
    const live = await (await fetch("/state", { cache: "no-store" })).json();
    s.cfg = live.cfg || {};
    s.meta = (live.cfg && pick !== "shop" && liveTuning(live, pick)) || {};
  } catch (_) {}
  if (kind === "dayintro") intro = { kind: "day", until: Infinity };
  if (kind === "evening") intro = { kind: "evening", until: Infinity };
  if (kind === "result") result = { day: s.day, stats: { served: 3, left: 1, closing: 0, income: 270, tips: 24, repStart: 3.0, repEnd: 3.2, dishes: { lau_ca_linh_dien_dien: 2, ca_loc_nuong_trui: 1 } } };
  prevStage = stageKey(s);
  return s;
}
function liveTuning(live, pick) { return live.phase === pick ? live.meta : null; }
// poll() và lần chơi lại đầu tiên chạy ở cuối file, sau khi mọi biến `let` đã khai báo.

// =====================================================================================
// ---------- bảng màu, chữ, dữ liệu hiển thị ----------
// Hướng thiết kế: chợ nổi miền Tây — sáng bình minh trên sông phù sa, tối đèn lồng trên ghe.
// Khung HUD: gỗ tếch sẫm, viền vàng bông điên điển.
const C = {
  panel: "rgba(30,21,14,.84)", panelHi: "rgba(255,236,200,.06)", edge: "rgba(242,194,48,.32)",
  cream: "#f7ecd6", muted: "#c9b796", dim: "#8d7d69",
  gold: "#f2c230", lotus: "#ec7fa3", oxy: "#5fd0f2", heart: "#ff5d73",
  danger: "#ff5a4f", warn: "#ffae3d", ok: "#8bd67f",
};
const FD = '"Baloo 2", "Segoe UI", system-ui, sans-serif';         // tiêu đề, số lớn
const FB = '"Be Vietnam Pro", "Segoe UI", system-ui, sans-serif';  // chữ thường
const FM = 'ui-monospace, Consolas, "Cascadia Mono", monospace';    // nhật ký

const KIND_COLOR = { ca_loc: "#6f8f4e", ca_linh: "#cfdde8", ca_keo: "#d39a5e", bong_dien_dien: "#f2c230", bong_sung: "#ec7fa3", keo_neo: "#8fcf6b" };
const KIND_NAME = { ca_loc: "cá lóc", ca_linh: "cá linh", ca_keo: "cá kèo", bong_dien_dien: "điên điển", bong_sung: "bông súng", keo_neo: "kèo nèo" };
const kc = (k) => KIND_COLOR[k] || "#bbbbbb";
const DISH_NAME = {
  ca_loc_nuong_trui: "Cá lóc nướng trui", goi_bong_sung: "Gỏi bông súng", lau_ca_linh_dien_dien: "Lẩu cá linh điên điển",
  canh_chua_ca_loc: "Canh chua cá lóc", ca_keo_nuong: "Cá kèo nướng muối ớt", lau_mam: "Lẩu mắm miền Tây",
};
const DISH_MAIN = {
  ca_loc_nuong_trui: "ca_loc", goi_bong_sung: "bong_sung", lau_ca_linh_dien_dien: "ca_linh",
  canh_chua_ca_loc: "ca_loc", ca_keo_nuong: "ca_keo", lau_mam: "keo_neo",
};
const UPGRADE_INFO = {
  oxygen: { name: "Bình oxy", key: "1", field: "oxygen_max_s", unit: (v) => v + " s oxy", color: "#5fd0f2" },
  hp: { name: "Áo phao", key: "2", field: "hp_max", unit: (v) => v + " Máu", color: "#ff5d73" },
};
const DEPTH_ZONE = (d) => (d < 10 ? "Nông" : d < 20 ? "Giữa" : "Sâu");
// món có thể là chuỗi dish_id hoặc payload {order_id, dish_id, base_price} (bếp/tay ở lát 4)
const dn = (d) => { const id = d && typeof d === "object" ? d.dish_id : d; return DISH_NAME[id] || id || "?"; };
const STOVE_STATE = { idle: "Bếp rảnh", cooking: "Đang nấu", ready: "Chín · E lấy", burnt: "Cháy" };
const ORDER_STATUS = { reserved: ["Đã giữ nguyên liệu", C.gold], assigned: ["Đang nấu", C.warn], unfulfillable: ["Không nấu được", C.danger], served: ["Đã phục vụ", C.ok] };
const REASON = { docked: "Cập bến an toàn", time: "Hết giờ", fainted: "Ngất xỉu dưới nước", days_complete: "Hoàn thành chuỗi ngày" };
const BUY_FAIL = { funds: "không đủ tiền", max_level: "đã cấp tối đa", out_of_stock: "hết hàng", unknown: "lệnh không hợp lệ" };

// ---------- tiện ích vẽ ----------
const TAU = Math.PI * 2;
const clamp01 = (v) => Math.max(0, Math.min(1, v || 0));
// Tỉ lệ giao diện: vẽ trên khung logic ~853×480 rồi phóng lên màn hình.
// Ở 1280×720 hệ số = 1.5, chữ nhỏ nhất 12 px logic = 18 px thật (PRD P2: chữ ≥ 18 px ở 1280×720).
const MIN_FONT = 12;
let uiK = 1;
function fit() {
  const dpr = window.devicePixelRatio || 1;
  const W = cv.clientWidth || innerWidth, H = cv.clientHeight || innerHeight;
  if (cv.width !== Math.round(W * dpr) || cv.height !== Math.round(H * dpr)) { cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); }
  uiK = Math.max(1, Math.min(W / 853, H / 480));
  ctx.setTransform(dpr * uiK, 0, 0, dpr * uiK, 0, 0);
  return [W / uiK, H / uiK];
}
function font(size, kind, weight) {
  const f = kind === "d" ? FD : kind === "m" ? FM : FB;
  ctx.font = `${weight || (kind === "d" ? 700 : 500)} ${Math.max(MIN_FONT, size)}px ${f}`;
}
function text(s, x, y, o = {}) {
  font(o.size || 14, o.kind, o.weight);
  ctx.fillStyle = o.color || C.cream;
  ctx.textAlign = o.align || "left";
  ctx.textBaseline = o.base || "alphabetic";
  if (o.shadow) { ctx.shadowColor = "rgba(0,0,0,.6)"; ctx.shadowBlur = 4; ctx.shadowOffsetY = 1; }
  ctx.fillText(s, x, y);
  ctx.shadowColor = "transparent"; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
}
function measure(s, size, kind, weight) { font(size, kind, weight); return ctx.measureText(s).width; }
function rr(x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  ctx.beginPath(); ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function panel(x, y, w, h, o = {}) {
  ctx.shadowColor = "rgba(0,0,0,.35)"; ctx.shadowBlur = 14; ctx.shadowOffsetY = 4;
  rr(x, y, w, h, o.r ?? 14); ctx.fillStyle = o.fill || C.panel; ctx.fill();
  ctx.shadowColor = "transparent"; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
  rr(x + 1, y + 1, w - 2, Math.min(18, h / 2), (o.r ?? 14) - 1); ctx.fillStyle = C.panelHi; ctx.fill();
  rr(x, y, w, h, o.r ?? 14); ctx.lineWidth = o.lw || 1.5; ctx.strokeStyle = o.edge || C.edge; ctx.stroke(); ctx.lineWidth = 1;
}
function pill(s, x, y, color, o = {}) {           // x,y = góc trái-giữa; trả bề rộng
  const size = Math.max(MIN_FONT, o.size || 11), pad = o.pad || 8, tw = measure(s, size, "b", 600), h = size + 9;
  rr(x, y - h / 2, tw + pad * 2, h, h / 2);
  ctx.fillStyle = o.fill || hexA(color, 0.18); ctx.fill();
  ctx.strokeStyle = hexA(color, 0.55); ctx.stroke();
  text(s, x + pad, y + 0.5, { size, weight: 600, base: "middle", color: o.textColor || color });
  return tw + pad * 2;
}
function bar(x, y, w, h, frac, color, o = {}) {
  frac = clamp01(frac);
  rr(x, y, w, h, h / 2); ctx.fillStyle = "rgba(0,0,0,.5)"; ctx.fill();
  if (frac > 0) {
    const fw = Math.max(h, w * frac);
    rr(x, y, fw, h, h / 2); ctx.fillStyle = color; ctx.fill();
    rr(x + 2, y + 1.5, fw - 4, Math.max(1, h * 0.35), h / 4); ctx.fillStyle = "rgba(255,255,255,.28)"; ctx.fill();
  }
  if (o.label) text(o.label, x + w / 2, y + h / 2 + 1, { size: o.labelSize || 11, align: "center", base: "middle", weight: 700, shadow: true });
}
function hexA(hex, a) {
  if (!hex || hex[0] !== "#") return hex;
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`;
}
function shade(hex, a) {
  if (!hex || hex[0] !== "#") return hex;
  const n = parseInt(hex.slice(1), 16), f = (c) => Math.round(a >= 0 ? c + (255 - c) * a : c * (1 + a));
  return `rgb(${f(n >> 16)},${f((n >> 8) & 255)},${f(n & 255)})`;
}
function fmtTime(ticks) {
  const s = Math.ceil((ticks || 0) / 60);
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function ring(x, y, r, frac, color, lw = 3) {
  ctx.lineWidth = lw; ctx.strokeStyle = "rgba(0,0,0,.35)"; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.stroke();
  ctx.strokeStyle = color; ctx.beginPath(); ctx.arc(x, y, r, -Math.PI / 2, -Math.PI / 2 + TAU * clamp01(frac)); ctx.stroke();
  ctx.lineWidth = 1;
}

// ---------- hình vẽ nhỏ: tim, sao, xu, cá, hoa ----------
function heart(cx, cy, r, full) {
  ctx.beginPath();
  ctx.moveTo(cx, cy + r * 0.95);
  ctx.bezierCurveTo(cx - r * 1.35, cy + r * 0.1, cx - r * 0.95, cy - r * 1.05, cx, cy - r * 0.35);
  ctx.bezierCurveTo(cx + r * 0.95, cy - r * 1.05, cx + r * 1.35, cy + r * 0.1, cx, cy + r * 0.95);
  ctx.closePath();
  if (full) { ctx.fillStyle = C.heart; ctx.fill(); ctx.fillStyle = "rgba(255,255,255,.35)"; ctx.beginPath(); ctx.arc(cx - r * 0.45, cy - r * 0.35, r * 0.22, 0, TAU); ctx.fill(); }
  else { ctx.fillStyle = "rgba(255,255,255,.06)"; ctx.fill(); ctx.strokeStyle = hexA(C.heart, 0.55); ctx.lineWidth = 1.5; ctx.stroke(); ctx.lineWidth = 1; }
}
function starPath(cx, cy, r) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + (i * Math.PI) / 5, q = i % 2 ? r * 0.45 : r; ctx.lineTo(cx + Math.cos(a) * q, cy + Math.sin(a) * q); }
  ctx.closePath();
}
function star(cx, cy, r, frac) {
  starPath(cx, cy, r); ctx.fillStyle = "rgba(255,255,255,.12)"; ctx.fill();
  if (frac > 0) { ctx.save(); ctx.beginPath(); ctx.rect(cx - r, cy - r, 2 * r * clamp01(frac), 2 * r); ctx.clip(); starPath(cx, cy, r); ctx.fillStyle = C.gold; ctx.fill(); ctx.restore(); }
}
function coin(cx, cy, r) {
  const g = ctx.createRadialGradient(cx - r * 0.3, cy - r * 0.3, 1, cx, cy, r);
  g.addColorStop(0, "#fff1a8"); g.addColorStop(1, "#d39a1c");
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, r, 0, TAU); ctx.fill();
  ctx.strokeStyle = "#8a5d0c"; ctx.stroke();
  text("đ", cx, cy + 1, { size: r * 1.25, align: "center", base: "middle", weight: 800, kind: "d", color: "#7a4f06" });
}
function bubbleIcon(cx, cy, r) {
  ctx.strokeStyle = C.oxy; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, TAU); ctx.stroke();
  ctx.beginPath(); ctx.arc(cx + r * 0.9, cy - r * 0.9, r * 0.45, 0, TAU); ctx.stroke();
  ctx.lineWidth = 1; ctx.fillStyle = "rgba(255,255,255,.7)"; ctx.beginPath(); ctx.arc(cx - r * 0.35, cy - r * 0.35, r * 0.22, 0, TAU); ctx.fill();
}
function fishShape(x, y, len, color, ang, t) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(ang);
  if (Math.cos(ang) < 0) ctx.scale(1, -1);        // không lật ngửa khi bơi sang trái
  const wig = Math.sin(t * 9) * 0.16 * len;
  ctx.fillStyle = shade(color, -0.2);
  ctx.beginPath(); ctx.moveTo(-len * 0.34, 0); ctx.lineTo(-len * 0.62, -len * 0.22 + wig); ctx.lineTo(-len * 0.55, wig * 0.6); ctx.lineTo(-len * 0.62, len * 0.22 + wig); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-len * 0.1, -len * 0.15); ctx.quadraticCurveTo(len * 0.05, -len * 0.33, len * 0.18, -len * 0.14); ctx.fill();
  const g = ctx.createLinearGradient(0, -len * 0.2, 0, len * 0.2);
  g.addColorStop(0, shade(color, 0.3)); g.addColorStop(0.55, color); g.addColorStop(1, shade(color, -0.3));
  ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(0, 0, len * 0.45, len * 0.18, 0, 0, TAU); ctx.fill();
  ctx.strokeStyle = "rgba(0,0,0,.18)"; ctx.beginPath(); ctx.moveTo(len * 0.18, -len * 0.13); ctx.quadraticCurveTo(len * 0.25, 0, len * 0.18, len * 0.13); ctx.stroke();
  ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(len * 0.3, -len * 0.04, len * 0.05, 0, TAU); ctx.fill();

// ---------- số liệu cho DayResult / Summary (gom từ event, chỉ hiển thị) ----------
let dayStats = null, runStats = null;

resetRun();
function onEvent(e) {

    runStats.dishes[d.dish_id] = (runStats.dishes[d.dish_id] || 0) + 1;
  } else if (e.name === "paid") {

}
function collectToasts() {

  let maxT = seenTick;
  ev.forEach((e) => {
    if (e.tick > seenTick) {

      const f = EVENT_MSG[e.name];
      if (f) { try { const [msg, color] = f(e.data || {}); toasts.push({ msg, color, at: now }); } catch (_) {} }

  if (MOCK) return;
  if (wantRun !== null) {                  // snapshot cũ của lượt trước: bỏ qua
    if (snap.run_id !== undefined && snap.run_id < wantRun) return;
    wantRun = null;
  }
  const key = stageKey(snap);
  if (key === prevStage) return;
  const prev = prevStage;
  prevStage = key;
  const phase = snap.phase || snap.mode;
  if (snap.finished) {
    // quán độc lập kết thúc -> DayResult; mode day kết thúc -> Summary (vẽ trong overlay)
    if (snap.mode === "quan") result = { day: snap.day ?? 1, stats: dayStats };
    return;
  }
  if (phase === "gather") intro = { kind: "day", until: performance.now() + INTRO_MS };
  else if (phase === "quan") {
    dayStats = newDayStats(snap.reputation);
    intro = { kind: "evening", until: performance.now() + INTRO_MS };
  } else if (phase === "shop" && prev && prev.includes("|quan|")) result = { day: snap.day ?? 1, stats: dayStats };

  const top = 100, bottom = 92;
  const s = Math.max(1, Math.min((w - 32) / (X + 2), (h - top - bottom) / (D + SKY)));
  const ox = (w - s * X) / 2, oy = top + SKY * s;

  ctx.lineTo(w, oy); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = "#3c6344"; ctx.lineWidth = 2;
  for (let x = 10; x < w; x += 46) {
    const hh = s * (1.6 + 0.6 * Math.sin(x)), bx = x, by = oy - s * 0.8;
    for (let k = -2; k <= 2; k++) { ctx.beginPath(); ctx.moveTo(bx, by); ctx.quadraticCurveTo(bx + k * s * 0.35, by - hh, bx + k * s * 0.75, by - hh * 0.65); ctx.stroke(); }
  }

  // nước phù sa xanh ngọc

  water.addColorStop(0, "#5aa7a0"); water.addColorStop(0.3, "#2f7576"); water.addColorStop(0.7, "#164556"); water.addColorStop(1, "#0b2633");
  ctx.fillStyle = water; ctx.fillRect(0, oy, w, bed - oy);

  ctx.lineWidth = 2.2; ctx.lineCap = "round";
  for (let x = sx(0) + 8; x < sx(X); x += 19) {
    const hh = s * (1 + 0.9 * (Math.sin(x * 0.7) * 0.5 + 0.5)), sw = Math.sin(t * 1.3 + x * 0.05) * s * 0.35;
    ctx.strokeStyle = x % 3 < 1.5 ? "rgba(96,150,80,.85)" : "rgba(70,122,66,.85)";

  }
  ctx.lineWidth = 1; ctx.lineCap = "butt";
  // ngoài biên: tối đi
  ctx.fillStyle = "rgba(4,12,18,.35)";
  ctx.fillRect(0, oy, Math.max(0, sx(0)), bed - oy); ctx.fillRect(sx(X), oy, Math.max(0, w - sx(X)), bed - oy);

  // mặt nước gợn sóng
  ctx.fillStyle = "rgba(255,255,255,.18)";
  ctx.beginPath(); ctx.moveTo(0, oy);
  for (let x = 0; x <= w; x += 8) ctx.lineTo(x, oy + Math.sin(x * 0.045 + t * 2) * 2.2);
  for (let x = w; x >= 0; x -= 8) ctx.lineTo(x, oy + 6 + Math.sin(x * 0.03 + t * 1.4) * 2);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,.85)"; ctx.lineWidth = 2; ctx.beginPath();
  for (let x = 0; x <= w; x += 8) ctx.lineTo(x, oy + Math.sin(x * 0.045 + t * 2) * 2.2);
  ctx.stroke(); ctx.lineWidth = 1;

  // bến + ghe
  const dp = meta.dock_pos || [2, 0], dr = meta.dock_radius || 3;
  const bob = Math.sin(t * 1.6) * 0.08;
  ctx.fillStyle = "#5c3b22";
  [-1.6, 1.6].forEach((o) => ctx.fillRect(sx(dp[0] + o) - 3, sy(-0.7), 6, sy(2.2) - sy(-0.7)));
  ctx.fillStyle = "#8d6440"; rr(sx(dp[0] - 2.2), sy(-0.85), 4.4 * s, 0.32 * s, 3); ctx.fill();
  const bx0 = sx(dp[0] + 0.2), by0 = sy(-0.05 + bob);
  ctx.fillStyle = "#6e3f22"; ctx.beginPath();
  ctx.moveTo(bx0 - 2.4 * s, by0 - 0.55 * s); ctx.quadraticCurveTo(bx0 - 1.8 * s, by0 + 0.45 * s, bx0, by0 + 0.45 * s);
  ctx.quadraticCurveTo(bx0 + 1.8 * s, by0 + 0.45 * s, bx0 + 2.4 * s, by0 - 0.55 * s); ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#b8442f"; ctx.fillRect(bx0 - 2.1 * s, by0 - 0.45 * s, 4.2 * s, 0.13 * s);
  ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.ellipse(bx0 + 1.75 * s, by0 - 0.15 * s, 0.17 * s, 0.1 * s, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = "#111"; ctx.beginPath(); ctx.arc(bx0 + 1.78 * s, by0 - 0.15 * s, 0.06 * s, 0, TAU); ctx.fill();
  ctx.fillStyle = "#c59a5c"; ctx.beginPath(); ctx.ellipse(bx0 - 0.4 * s, by0 - 0.55 * s, 1.1 * s, 0.6 * s, 0, Math.PI, TAU); ctx.fill();
  ctx.strokeStyle = hexA(C.gold, 0.55); ctx.setLineDash([6, 5]); ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(sx(dp[0]), sy(dp[1]), dr * s, 0, TAU); ctx.stroke(); ctx.setLineDash([]); ctx.lineWidth = 1;
  pill("Bến", Math.max(6, sx(dp[0]) - 18), sy(-2.1), "#6b3f1d", { size: 11, fill: "rgba(255,240,215,.9)", textColor: "#5a3418" });

  // nút hái
  const regrowMax = (meta.regrow_s || 20) * 60;
  (snap.nodes || []).forEach((nd) => {
    const ready = nd.ready !== false, x = sx(nd.pos[0]), y = sy(nd.pos[1]);
    const sway = Math.sin(t * 1.5 + nd.pos[0]) * 0.05 * s;
    ctx.fillStyle = ready ? "#4f9a4a" : "rgba(79,154,74,.55)";
    ctx.beginPath(); ctx.ellipse(x, y + 0.05 * u, 0.95 * u, 0.24 * u, 0, 0.25, TAU - 0.05); ctx.lineTo(x, y + 0.05 * u); ctx.closePath(); ctx.fill();
    ctx.globalAlpha = ready ? 1 : 0.35;
    if (nd.kind === "bong_sung") lotusFlower(x + sway, y - 0.25 * u, 0.6 * u);
    else if (nd.kind === "bong_dien_dien") dienDien(x + sway, y - 0.55 * u, 0.75 * u);

  });

  // đàn cá
  (snap.fish || []).forEach((f, i) => {
    const ang = ((f.heading_deg || 0) * Math.PI) / 180;
    fishShape(sx(f.pos[0]), sy(f.pos[1]), 1.9 * u, kc(f.kind), ang, t + i * 0.7);
    if (showLog) text(f.id, sx(f.pos[0]), sy(f.pos[1]) - 0.7 * s, { size: 10, align: "center", color: "rgba(255,255,255,.8)" });
  });

  // thủy quái (Cá Sấu Năm Chèo): hướng mặt theo người chơi khi đuổi, theo waypoint khi tuần tra
  const mons = snap.monsters || [];
  const species = (meta.monsters && meta.monsters.species) || {};
  mons.forEach((m, i) => {
    if (!m.pos) return;
    let facing = 1;
    if (m.state === "chase" && p && p.pos) facing = p.pos[0] >= m.pos[0] ? 1 : -1;
    else if (m.state === "recoil" && m.recoil_dir) facing = -m.recoil_dir[0] || 1;
    else if (m.waypoints && m.target_idx !== undefined && m.waypoints[m.target_idx]) facing = m.waypoints[m.target_idx][0] >= m.pos[0] ? 1 : -1;
    const sp = species[m.kind] || {};
    if (sp.detect_radius && m.state !== "recoil") {          // vòng phát hiện mờ

      ctx.setLineDash([3, 7]); ctx.beginPath(); ctx.arc(sx(m.pos[0]), sy(m.pos[1]), sp.detect_radius * s, 0, TAU); ctx.stroke(); ctx.setLineDash([]);
    }
    crocodile(sx(m.pos[0]), sy(m.pos[1]), 3.2 * u, facing, m.state, t + i);
    if (showLog) text(m.id + " · " + (m.state || ""), sx(m.pos[0]), sy(m.pos[1]) - 0.9 * u, { size: 10, align: "center", color: "#e6d2ff" });
  });

  // bọt nước

  ctx.strokeStyle = "rgba(220,250,255,.65)";
  bubbles.forEach((bb) => { ctx.beginPath(); ctx.arc(sx(bb.x), sy(bb.d), bb.r * u, 0, TAU); ctx.stroke(); });

  // người chơi (Út Sen)

    const px = sx(p.pos[0]), py = sy(p.pos[1]);

    if (meta.interact_radius && !underwater) { ctx.strokeStyle = hexA(C.gold, 0.45); ctx.setLineDash([4, 6]); ctx.beginPath(); ctx.arc(px, py, meta.interact_radius * s, 0, TAU); ctx.stroke(); ctx.setLineDash([]); }
    if (!(p.invuln_ticks > 0 && Math.floor((snap.tick || 0) / 5) % 2)) {

      ctx.fillStyle = "#f2c79a"; ctx.beginPath(); ctx.arc(0.38 * L, -0.04 * L, 0.12 * L, 0, TAU); ctx.fill();               // mặt
      ctx.fillStyle = "#2a1a12"; ctx.beginPath(); ctx.arc(0.36 * L, -0.08 * L, 0.12 * L, Math.PI * 0.9, Math.PI * 2.05); ctx.fill(); // tóc
      if (!underwater) { ctx.fillStyle = "#ecd59a"; ctx.beginPath(); ctx.moveTo(0.14 * L, -0.12 * L); ctx.lineTo(0.37 * L, -0.42 * L); ctx.lineTo(0.62 * L, -0.12 * L); ctx.closePath(); ctx.fill(); }

    }
    if (p.catch_cd_ticks > 0) ring(px, py, 1.05 * s, p.catch_cd_ticks / ((meta.catch_cooldown_s || 0.5) * 60), "rgba(255,255,255,.75)", 2.5);
    // gợi ý hành động khi tới gần (chỉ đọc vị trí, không đoán luật)
    let hint = null;
    const near = (pos, r) => pos && r && Math.hypot(pos[0] - p.pos[0], pos[1] - p.pos[1]) <= r;
    if (!snap.finished) {
      if (!underwater && near(dp, dr)) hint = ["E · cập bến giao hàng", C.gold];
      else if (!underwater) {
        const nd = (snap.nodes || []).find((n) => n.ready !== false && near(n.pos, meta.interact_radius));
        if (nd) hint = ["E · hái " + (KIND_NAME[nd.kind] || nd.kind), C.ok];
      } else {
        const f = (snap.fish || []).find((f) => near(f.pos, meta.catch_radius));
        if (f) hint = p.catch_cd_ticks > 0 ? ["Đang hồi bắt…", C.muted] : ["Space · bắt " + (KIND_NAME[f.kind] || "cá"), "#7fe0cf"];
      }
    }
    if (hint) {
      const lw = measure(hint[0], 13, "b", 600) + 16, hxp = Math.max(6, Math.min(w - lw - 6, px - lw / 2));
      pill(hint[0], hxp, py - Math.max(34, 1.9 * s), hint[1], { size: 13, fill: "rgba(20,14,8,.85)" });
    }
  }

  // ---- HUD trên trái: giờ · oxy · máu ----
  const pw = 400;
  panel(16, 14, pw, 76);
  text("CÒN LẠI", 32, 36, { size: 10, weight: 700, color: C.dim });
  const lowTime = (snap.time_left_ticks || 0) <= 1800;          // ≤ 30 s: đổi màu + nhấp nháy
  ctx.globalAlpha = lowTime ? 0.7 + 0.3 * Math.sin(t * 6) : 1;

  ctx.globalAlpha = 1;
  ctx.fillStyle = "rgba(255,255,255,.12)"; ctx.fillRect(122, 26, 1, 52);

    ctx.globalAlpha = pulse;
    bar(164, 30, pw - 164, 16, fr, low ? C.danger : C.oxy, { label: "Oxy " + Math.ceil(p.oxygen_ticks / 60) + "s" });
    ctx.globalAlpha = 1;
  }

    for (let i = 0; i < p.hp_max; i++) heart(146 + i * 22, 66, 8, i < p.hp);

    const d = p.pos ? p.pos[1] : 0;
    const pw2 = pill(p.at_surface ? "Mặt nước · hồi oxy" : "Sâu " + d.toFixed(1) + " m · " + DEPTH_ZONE(d), hx + 4, 66, p.at_surface ? "#9be3f7" : C.oxy);
    hx += pw2 + 8;
  }
  if (p && p.catch_cd_ticks !== undefined && hx < pw - 40) {       // hồi bắt cá
    pill(p.catch_cd_ticks > 0 ? "Bắt · " + (p.catch_cd_ticks / 60).toFixed(1) + "s" : "Bắt ✓", hx, 66, p.catch_cd_ticks > 0 ? C.muted : "#7fe0cf");
  }

  // ---- danh sách cần lấy (trên phải): đã lấy / cần theo day_plan ----
  drawNeedList(w, t);

  // ---- cảnh báo: thủy quái (viền tím) / hết hơi (viền đỏ) ----
  let toastY = 104;
  const live = p && !snap.finished;

    if (!m.pos || m.state === "recoil") return false;

  });
  if (monsterNear) {

    const vg = ctx.createRadialGradient(w / 2, h / 2, Math.min(w, h) * 0.35, w / 2, h / 2, Math.max(w, h) * 0.75);
    vg.addColorStop(0, "rgba(140,60,255,0)"); vg.addColorStop(1, `rgba(140,60,255,${pulse * 0.6})`);

  }

    const pulse = 0.28 + 0.18 * Math.sin(t * 9);
    const vg = ctx.createRadialGradient(w / 2, h / 2, Math.min(w, h) * 0.3, w / 2, h / 2, Math.max(w, h) * 0.75);

    banner(w, toastY, "Hết hơi!", sub, C.danger);

  } else if (live && p.oxygen_max_ticks && p.oxygen_ticks < p.oxygen_max_ticks * 0.25 && p.at_surface === false) {

    toastY += 50;
  }
  if (monsterNear) { banner(w, toastY, "Thủy quái!", "Cá Sấu Năm Chèo ở gần — bơi lên vùng nông (< 10 m) để cắt đuôi", "#c08bff"); toastY += 68; }
  drawToasts(w, toastY);

  // ---- giỏ (dưới trái) ----
  if (snap.hold && snap.hold_capacity) {
    const cap = snap.hold_capacity, full = snap.hold.length >= cap;

    const bw = 104 + cap * (sz + gap), bh = sz + 30, by = h - bh - 46;

    text(snap.hold.length + "/" + cap, 30, by + bh - 12, { size: 22, kind: "d", weight: 800, color: full ? C.warn : C.cream });

  }
  keycaps(w, h, [["WASD", "bơi"], ["E", "hái · bến"], ["Space", "bắt cá"], ["Esc", "dừng"]]);
}

// Kế hoạch của Ngày: mode day có snap.day_plan; chạy gather/quan độc lập thì lấy Ngày 1 trong cfg làm mẫu.
function currentPlan() {
  if (snap.day_plan) return { plan: snap.day_plan, sample: false };
  const dp = snap.cfg && snap.cfg.day_plan;
  return dp && dp[0] ? { plan: dp[0], sample: true } : null;
}
function drawNeedList(w, t) {
  const cp = currentPlan();
  if (!cp) return;
  const need = cp.plan.ingredients || {};
  const have = {};
  (snap.hold || []).forEach((k) => (have[k] = (have[k] || 0) + 1));
  const extra = Object.keys(have).filter((k) => !(k in need));       // giỏ phân loại: hàng ngoài kế hoạch
  const rows = Object.keys(need).concat(extra);
  const rh = 24, pw = 228, ph = 40 + rows.length * rh, x0 = w - pw - 16, y0 = 14;
  panel(x0, y0, pw, ph);
  text(cp.sample ? "Cần lấy · Ngày 1 (mẫu)" : "Má Tư dặn · Ngày " + (snap.day ?? 1), x0 + 14, y0 + 25, { size: 14, kind: "d", weight: 800, color: C.gold });
  rows.forEach((k, i) => {
    const y = y0 + 44 + i * rh, n = need[k] || 0, hv = have[k] || 0, done = n > 0 && hv >= n;
    itemIcon(k, x0 + 24, y, 18);
    text(KIND_NAME[k] || k, x0 + 42, y + 5, { size: 13, weight: 600, color: n ? C.cream : C.muted });
    const label = n ? hv + "/" + n : "×" + hv;
    text(label, x0 + pw - 34, y + 5, { size: 14, kind: "d", weight: 800, align: "right", color: done ? C.ok : n ? C.cream : C.muted });
    if (done) text("✓", x0 + pw - 16, y + 5, { size: 14, weight: 800, align: "center", color: C.ok });
  });
}

// ----- cảnh QUÁN: nhìn từ trên xuống, x sang phải, z lên (bắc) -----
function drawQuan(w, h, t) {
  const meta = snap.meta || {};

  const cs = snap.customers || [];
  const side = w >= 820 ? 300 : 0;                                  // chỗ cho bảng đơn gọi
  const top = 108, bottom = 128;
  const s = Math.max(1, Math.min((w - 48 - side) / X, (h - top - bottom) / Z));
  const ox = (w - side - s * X) / 2, oy = top;
  const sx = (x) => ox + x * s, sy = (z) => oy + (Z - z) * s;

  // sông đêm + ánh đèn phản chiếu
  const night = ctx.createLinearGradient(0, 0, 0, h);
  night.addColorStop(0, "#0e1d30"); night.addColorStop(1, "#060d16");
  ctx.fillStyle = night; ctx.fillRect(0, 0, w, h);
  for (let i = 0; i < 26; i++) {
    const y = (i / 26) * h + Math.sin(t * 0.8 + i) * 3, x = ((i * 137) % w), len = 30 + (i * 53) % 70;
    ctx.strokeStyle = i % 3 ? "rgba(255,190,110,.07)" : "rgba(160,200,255,.06)"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + len, y); ctx.stroke();
  }
  ctx.lineWidth = 1;

  // sàn ghe: ván gỗ
  const dx = sx(0), dy = sy(Z), dw = X * s, dh = Z * s;
  ctx.shadowColor = "rgba(0,0,0,.55)"; ctx.shadowBlur = 30; ctx.shadowOffsetY = 10;
  rr(dx - 10, dy - 10, dw + 20, dh + 20, 26); ctx.fillStyle = "#4a2c17"; ctx.fill();
  ctx.shadowColor = "transparent"; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
  ctx.save(); rr(dx, dy, dw, dh, 18); ctx.clip();
  const plank = 0.8 * s;
  for (let i = 0; i * plank < dh; i++) {
    ctx.fillStyle = i % 2 ? "#a06c3e" : "#94633a"; ctx.fillRect(dx, dy + i * plank, dw, plank);
    ctx.fillStyle = "rgba(0,0,0,.22)"; ctx.fillRect(dx, dy + i * plank, dw, 1.5);
    const seam = ((i * 3.7) % 6 + 2) * s; ctx.fillRect(dx + seam, dy + i * plank, 1.5, plank); ctx.fillRect(dx + seam + 7 * s, dy + i * plank, 1.5, plank);
  }
  const warm = ctx.createRadialGradient(dx + dw / 2, dy + dh / 2, 10, dx + dw / 2, dy + dh / 2, Math.max(dw, dh) * 0.7);
  warm.addColorStop(0, "rgba(255,200,120,.12)"); warm.addColorStop(1, "rgba(0,0,0,.28)");
  ctx.fillStyle = warm; ctx.fillRect(dx, dy, dw, dh);
  ctx.restore();
  // dây đèn lồng
  ctx.strokeStyle = "rgba(40,25,15,.9)"; ctx.lineWidth = 1.5;
  const lanterns = Math.max(3, Math.round(X / 2.2));
  ctx.beginPath(); ctx.moveTo(dx, dy - 4);
  for (let i = 1; i <= lanterns; i++) ctx.quadraticCurveTo(dx + (dw * (i - 0.5)) / lanterns, dy + 12, dx + (dw * i) / lanterns, dy - 4);
  ctx.stroke(); ctx.lineWidth = 1;
  for (let i = 0; i < lanterns; i++) {
    const lx = dx + (dw * (i + 0.5)) / lanterns, ly = dy + 10 + Math.sin(t * 1.5 + i) * 1.5, col = i % 2 ? "#f0b43a" : "#d8392b";
    const glow = ctx.createRadialGradient(lx, ly, 2, lx, ly, 46);
    glow.addColorStop(0, hexA(col, 0.4)); glow.addColorStop(1, hexA(col, 0));
    ctx.fillStyle = glow; ctx.fillRect(lx - 46, ly - 46, 92, 92);
    ctx.fillStyle = col; ctx.beginPath(); ctx.ellipse(lx, ly, 7, 9, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = "#3a2410"; ctx.fillRect(lx - 4, ly - 11, 8, 3); ctx.fillRect(lx - 4, ly + 8, 8, 3);
  }

  // bếp cà ràng
  (snap.stoves || []).forEach((st, si) => {
    const x = sx(st.pos[0]), y = sy(st.pos[1]), r = 0.8 * s;
    if (st.state === "cooking") {
      const fg = ctx.createRadialGradient(x, y, 2, x, y, r * 2.2);
      fg.addColorStop(0, `rgba(255,140,40,${0.55 + 0.15 * Math.sin(t * 12)})`); fg.addColorStop(1, "rgba(255,120,30,0)");
      ctx.fillStyle = fg; ctx.fillRect(x - r * 2.2, y - r * 2.2, r * 4.4, r * 4.4);
    } else if (st.state === "ready") {
      const gg = ctx.createRadialGradient(x, y, 2, x, y, r * 2);
      gg.addColorStop(0, `rgba(140,230,120,${0.45 + 0.2 * Math.sin(t * 5)})`); gg.addColorStop(1, "rgba(140,230,120,0)");

    ctx.fillStyle = "#2e2e33"; ctx.beginPath(); ctx.arc(x, y - r * 0.05, r * 0.62, 0, TAU); ctx.fill();
    ctx.fillStyle = "#4a4a52"; ctx.beginPath(); ctx.arc(x - r * 0.15, y - r * 0.2, r * 0.42, 0, TAU); ctx.fill();
    if (st.state === "ready" || st.state === "cooking") {
      ctx.strokeStyle = "rgba(255,255,255,.45)"; ctx.lineWidth = 2;

        const ph = (t * 0.8 + k * 0.33) % 1, yy = y - r * 0.6 - ph * r * 1.6;
        ctx.globalAlpha = 1 - ph; ctx.beginPath(); ctx.moveTo(x + k * r * 0.35, yy); ctx.quadraticCurveTo(x + k * r * 0.35 + 5 * Math.sin(t * 3 + k), yy - 8, x + k * r * 0.35, yy - 16); ctx.stroke();
      }

    // tiến độ nấu: cook_ticks_left so với cook_s của món (đọc từ menu trong contract)

    if (st.state === "cooking" && menuCfg[did] && st.cook_ticks_left !== undefined) {

    } else if (st.state === "ready") ring(x, y, r + 7, 1, C.ok, 4);
    // 2 bếp đứng sát nhau (B1 [2,8], B2 [5,8]): nhãn ngắn, bếp lẻ đặt tên món phía dưới để không đè
    const label = st.state === "cooking" && st.cook_ticks_left ? Math.ceil(st.cook_ticks_left / 60) + "s" : ({ idle: "Rảnh", ready: "Chín · E", burnt: "Cháy" }[st.state] || st.state || "");
    const col = st.state === "ready" ? C.ok : st.state === "cooking" ? C.warn : C.muted;
    if (label) { const lw = measure(label, 12, "b", 600) + 16; pill(label, x - lw / 2, y + r + 16, col, { fill: "rgba(30,20,12,.85)" }); }
    if (st.dish) {
      const nm = dn(st.dish), lw = measure(nm, 12, "b", 600) + 16, ly = si % 2 ? y + r + 42 : y - r - 16;
      pill(nm, Math.max(dx + 2, x - lw / 2), ly, C.cream, { fill: "rgba(30,20,12,.85)" });
    }
    if (showLog) text(st.id, x, y + 4, { size: 10, align: "center", color: "#fff" });
  });

  // bàn + khách
  const patMax = (meta.patience_s || 60) * 60, eatMax = (meta.eat_s || 10) * 60;
  const byTable = {};
  cs.forEach((c) => (byTable[c.table_id] = c));
  (snap.tables || []).forEach((tb) => {
    const x = sx(tb.pos[0]), y = sy(tb.pos[1]), r = 0.85 * s;
    ctx.fillStyle = "#4a2c17";
    [[-1.25, 0], [1.25, 0]].forEach(([a]) => { ctx.beginPath(); ctx.arc(x + a * r, y + r * 0.2, r * 0.32, 0, TAU); ctx.fill(); });
    ctx.fillStyle = "#6b4426"; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
    ctx.strokeStyle = "#8c5c34"; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(x, y, r * 0.75, 0, TAU); ctx.stroke(); ctx.lineWidth = 1;
    text(tb.id, x, y + 1, { size: 11, weight: 700, align: "center", base: "middle", color: "rgba(255,236,200,.7)" });
    const c = byTable[tb.id];

      }
      // bong bóng gọi món
      const label = c.state === "eating" ? "đang ăn" : dn(c.dish_id), lw = measure(label, 11, "b", 600) + 34, bx = hx - lw / 2, by = hy - 0.5 * s - 34;
      rr(bx, by, lw, 24, 10); ctx.fillStyle = "rgba(255,248,232,.95)"; ctx.fill();
      ctx.beginPath(); ctx.moveTo(hx - 5, by + 24); ctx.lineTo(hx, by + 30); ctx.lineTo(hx + 5, by + 24); ctx.fill();
      if (c.state !== "eating") itemIcon(DISH_MAIN[c.dish_id], bx + 14, by + 12, 16);
      text(label, bx + (c.state === "eating" ? 10 : 25), by + 12.5, { size: 11, weight: 600, base: "middle", color: c.order_status === "unfulfillable" ? "#b3261e" : "#3a2410" });
    }
  });

  // người chơi
  const p = snap.player;
  if (p && p.pos) {
    const px = sx(p.pos[0]), py = sy(p.pos[1]);
    if (meta.interact_radius) { ctx.strokeStyle = hexA(C.gold, 0.5); ctx.setLineDash([5, 5]); ctx.beginPath(); ctx.arc(px, py, meta.interact_radius * s, 0, TAU); ctx.stroke(); ctx.setLineDash([]); }
    ctx.fillStyle = "rgba(0,0,0,.3)"; ctx.beginPath(); ctx.ellipse(px + 3, py + 5, 0.62 * s, 0.5 * s, 0, 0, TAU); ctx.fill();

  // ---- HUD trên trái: giờ · tiền · uy tín · điểm · trên tay ----

// ----- các màn Phase 2: Menu, DayIntro, EveningIntro, DayResult, Shop, Summary, Pause -----
function button(label, x, y, bw, bh, on, o = {}) {
  buttons.push({ x, y, w: bw, h: bh, on });
  const col = o.disabled ? C.dim : o.color || C.gold;
  rr(x, y, bw, bh, bh / 2);
  ctx.fillStyle = o.active ? hexA(col, 0.32) : "rgba(255,255,255,.06)"; ctx.fill();
  ctx.lineWidth = o.active ? 2.5 : 1.5; ctx.strokeStyle = hexA(col, o.active ? 0.95 : 0.5); ctx.stroke(); ctx.lineWidth = 1;
  text(label, x + bw / 2, y + bh / 2 + 1, { size: o.size || 18, kind: "d", weight: 800, align: "center", base: "middle", color: o.disabled ? C.dim : C.cream });
}
function dim(a = 0.66) { ctx.fillStyle = `rgba(5,10,16,${a})`; ctx.fillRect(0, 0, 1e5, 1e5); }
function card(w, h, cw, ch, edge) {
  const x = w / 2 - cw / 2, y = Math.max(12, h / 2 - ch / 2);
  panel(x, y, cw, ch, { r: 22, lw: 2, edge: hexA(edge || C.gold, 0.65), fill: "rgba(32,22,14,.95)" });
  return [x, y];
}
function chips(items, x, y, maxW) {          // [{kind, label, color}] -> xếp dòng, trả y cuối
  let cx = x, cy = y;
  items.forEach((it) => {
    const tw = measure(it.label, 14, "b", 700) + 40;
    if (cx + tw > x + maxW) { cx = x; cy += 34; }
    rr(cx, cy - 14, tw, 28, 14); ctx.fillStyle = "rgba(255,255,255,.07)"; ctx.fill();
    itemIcon(it.kind, cx + 15, cy, 18);
    text(it.label, cx + 29, cy + 5, { size: 14, weight: 700, color: it.color || C.cream });
    cx += tw + 8;
  });
  return cy + 20;
}
function riverBackdrop(w, h, t) {
  const g = ctx.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, "#1b2a44"); g.addColorStop(0.55, "#2a3550"); g.addColorStop(0.56, "#13324a"); g.addColorStop(1, "#061320");
  ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
  const hz = h * 0.55;
  for (let i = 0; i < 9; i++) {                       // đèn lồng trên ghe + bóng nước
    const lx = (w * (i + 0.5)) / 9, ly = hz - 26 - (i % 3) * 8 + Math.sin(t + i) * 2, col = i % 2 ? "#f0b43a" : "#d8392b";
    const gl = ctx.createRadialGradient(lx, ly, 2, lx, ly, 40); gl.addColorStop(0, hexA(col, 0.5)); gl.addColorStop(1, hexA(col, 0));
    ctx.fillStyle = gl; ctx.fillRect(lx - 40, ly - 40, 80, 80);
    ctx.fillStyle = col; ctx.beginPath(); ctx.ellipse(lx, ly, 6, 8, 0, 0, TAU); ctx.fill();
    for (let k = 1; k < 6; k++) { ctx.fillStyle = hexA(col, 0.18 / k); ctx.fillRect(lx - 8 + Math.sin(t * 2 + k + i) * 3, hz + k * 12, 16, 3); }
  }
  ctx.fillStyle = "#24160c"; ctx.fillRect(0, hz - 8, w, 10);
}

function drawIntro(w, h, now) {
  dim(0.72);
  const left = Math.max(0, Math.ceil((intro.until - now) / 1000));
  const cp = currentPlan(), menu = (snap.cfg && snap.cfg.menu) || {};

    const [x, y] = card(w, h, cw, 300);

    text("Buổi sáng · lặn sông Chín Khúc", w / 2, y + 84, { size: 15, align: "center", color: C.muted });
    if (cp) {
      text("Má Tư định nấu" + (cp.sample ? " (mẫu Ngày 1)" : "") + ":", x + 28, y + 122, { size: 15, weight: 700 });
      let yy = chips(Object.entries(cp.plan.dishes || {}).map(([d, n]) => ({ kind: DISH_MAIN[d], label: dn(d) + " ×" + n })), x + 28, y + 146, cw - 56);
      text("Cần lấy:", x + 28, yy + 14, { size: 15, weight: 700 });
      chips(Object.entries(cp.plan.ingredients || {}).map(([k, n]) => ({ kind: k, label: (KIND_NAME[k] || k) + " ×" + n, color: C.gold })), x + 28, yy + 40, cw - 56);
    }
    text(isFinite(left) ? "Tự vào sau " + left + " s · nhấn phím bất kỳ để bắt đầu" : "Nhấn phím bất kỳ để bắt đầu", w / 2, y + 286, { size: 13, align: "center", color: C.dim });
    return;
  }
  // EveningIntro: kho nhập + món nấu được (lọc theo kế hoạch ở mode day)
  const stock = snap.stock || {};
  const allowed = snap.day_plan ? Object.keys(snap.day_plan.dishes || {}) : Object.keys(menu);
  const cook = allowed.map((d) => {
    const rc = (menu[d] || {}).recipe || {};
    const n = Object.keys(rc).length ? Math.min(...Object.entries(rc).map(([k, q]) => Math.floor((stock[k] || 0) / q))) : 0;
    return { d, n };
  });
  const [x, y] = card(w, h, cw, 320, C.warn);
  text("Mở quán" + (snap.day ? " · tối Ngày " + snap.day : ""), w / 2, y + 52, { size: 38, kind: "d", weight: 800, align: "center", color: C.warn });
  text("Nhập kho từ buổi sáng:", x + 28, y + 92, { size: 15, weight: 700 });
  const ks = Object.keys(stock);
  let yy = ks.length ? chips(ks.map((k) => ({ kind: k, label: (KIND_NAME[k] || k) + " ×" + stock[k] })), x + 28, y + 116, cw - 56)
    : (text("Kho trống — khách tới sẽ không có món", x + 28, y + 122, { size: 14, color: C.danger }), y + 136);
  text("Món nấu được:", x + 28, yy + 14, { size: 15, weight: 700 });
  cook.forEach((c, i) => {
    const cy = yy + 40 + Math.floor(i / 2) * 28, cx = x + 28 + (i % 2) * (cw - 56) / 2;
    itemIcon(DISH_MAIN[c.d], cx + 10, cy - 5, 18);
    text(dn(c.d) + (c.n > 0 ? " · đủ " + c.n + " suất" : " · thiếu"), cx + 26, cy, { size: 14, weight: 600, color: c.n > 0 ? C.ok : C.dim });
  });
  text(isFinite(left) ? "Tự mở sau " + left + " s · nhấn phím bất kỳ" : "Nhấn phím bất kỳ", w / 2, y + 306, { size: 13, align: "center", color: C.dim });
}

function drawResult(w, h) {
  dim(0.72);
  const st = result.stats || newDayStats(null), cw = Math.min(520, w - 32);
  const [x, y] = card(w, h, cw, 340);
  text("Kết quả Ngày " + (result.day ?? 1), w / 2, y + 50, { size: 36, kind: "d", weight: 800, align: "center", color: C.gold });
  const dRep = st.repEnd != null && st.repStart != null ? st.repEnd - st.repStart : null;
  const rows = [
    ["Khách đã phục vụ", st.served, C.ok],
    ["Khách bỏ đi", st.left, st.left ? C.danger : C.cream],
    ["Rời bàn lúc đóng ca", st.closing, C.muted],
    ["Tiền thu (gồm boa)", st.income + "k", C.gold],
    ["Tiền boa", st.tips + "k", C.gold],
    ["Uy tín", st.repStart != null ? rep1(st.repStart) + " → " + rep1(st.repEnd) + (dRep != null ? (dRep >= 0 ? "  (+" : "  (") + dRep.toFixed(1) + ")" : "") : rep1(snap.reputation), dRep < 0 ? C.danger : C.ok],
  ];
  rows.forEach(([k, v, col], i) => {
    const ry = y + 92 + i * 34;
    if (i % 2 === 0) { rr(x + 20, ry - 20, cw - 40, 32, 8); ctx.fillStyle = "rgba(255,255,255,.04)"; ctx.fill(); }
    text(k, x + 36, ry, { size: 16, weight: 600, color: C.muted });
    text(String(v), x + cw - 36, ry, { size: 18, kind: "d", weight: 800, align: "right", color: col });
  });
  const next = snap.mode === "day" ? "Sang Shop" : "Xem quán";
  button("Enter · " + next, w / 2 - 110, y + 290, 220, 40, () => (result = null), { active: true, size: 16 });
}

function drawShop(w, h, t) {
  riverBackdrop(w, h, t);
  dim(0.35);
  const shop = (snap.cfg && snap.cfg.shop) || {}, ups = shop.upgrades || {};
  const bought = snap.upgrades || {}, active = snap.active_upgrades || {}, money = snap.money ?? 0;
  text("Shop cuối ngày · Ngày " + (snap.day ?? 1), 24, 46, { size: 30, kind: "d", weight: 800, color: C.gold });
  coin(w - 190, 34, 12);
  text(money + "k", w - 172, 44, { size: 26, kind: "d", weight: 800, color: C.gold });
  const lowT = (snap.time_left_ticks || 0) <= 180;
  text("Tự đóng sau " + Math.ceil((snap.time_left_ticks || 0) / 60) + " s", w - 24, 68, { size: 13, align: "right", color: lowT ? C.danger : C.muted });
  const ids = Object.keys(ups), cw = Math.min(300, (w - 48 - (ids.length - 1) * 16) / Math.max(1, ids.length)), ch = 230;
  const x0 = w / 2 - (ids.length * cw + (ids.length - 1) * 16) / 2, y0 = 92;
  ids.forEach((id, i) => {
    const info = UPGRADE_INFO[id] || { name: id, key: String(i + 1), field: null, unit: (v) => v, color: C.gold };
    const lv = bought[id] || 0, levels = ups[id] || [], next = levels.find((l) => l.level === lv + 1);
    const x = x0 + i * (cw + 16);
    panel(x, y0, cw, ch, { r: 18, edge: hexA(info.color, 0.6), lw: 2 });
    text(info.name, x + 18, y0 + 34, { size: 22, kind: "d", weight: 800, color: info.color });
    for (let k = 0; k < levels.length; k++) {                 // chấm cấp: đặc = đã mua, viền = chưa
      ctx.beginPath(); ctx.arc(x + cw - 24 - (levels.length - 1 - k) * 18, y0 + 28, 6, 0, TAU);
      if (k < lv) { ctx.fillStyle = info.color; ctx.fill(); } else { ctx.strokeStyle = hexA(info.color, 0.6); ctx.lineWidth = 1.5; ctx.stroke(); ctx.lineWidth = 1; }
    }
    text("Đã mua cấp " + lv + " · đang dùng cấp " + (active[id] || 0), x + 18, y0 + 62, { size: 13, color: C.muted });
    if (next) {
      text("Cấp " + next.level + ": " + (info.field ? info.unit(next[info.field]) : ""), x + 18, y0 + 100, { size: 18, weight: 700 });
      text("Giá " + next.price + "k", x + 18, y0 + 128, { size: 16, weight: 600, color: money >= next.price ? C.gold : C.danger });
      const can = money >= next.price;
      button("[" + info.key + "] Mua", x + 18, y0 + ch - 62, cw - 36, 42, () => buy(id), { active: can, disabled: !can, color: info.color, size: 16 });
    } else {
      text("Đã đạt cấp tối đa", x + 18, y0 + 110, { size: 16, weight: 700, color: C.ok });
    }
  });
  text("Cấp vừa mua hiện ngay ở đây, nhưng chỉ có hiệu lực từ Ngày kế tiếp.", w / 2, y0 + ch + 30, { size: 13, align: "center", color: C.muted });
  const ks = Object.keys(snap.stock || {});
  if (ks.length) {
    text("Kho dư (sẽ bỏ sau Shop):", 24, y0 + ch + 66, { size: 13, weight: 700, color: C.dim });
    chips(ks.map((k) => ({ kind: k, label: (KIND_NAME[k] || k) + " ×" + snap.stock[k], color: C.muted })), 24, y0 + ch + 92, w - 48);
  }
  button("Enter · Đóng Shop", w / 2 - 120, h - 70, 240, 44, () => tapButton("shop_done"), { active: true, size: 16 });
  drawToasts(w, 76);
}

function drawSummary(w, h, t) {
  riverBackdrop(w, h, t);
  dim(0.45);
  const cw = Math.min(540, w - 32), [x, y] = card(w, h, cw, 360);
  text("Tổng kết " + (snap.days_completed ?? snap.day ?? "") + " ngày", w / 2, y + 54, { size: 38, kind: "d", weight: 800, align: "center", color: C.gold });
  const best = Object.entries(runStats.dishes).sort((a, b) => b[1] - a[1])[0];
  const rows = [
    ["Tổng tiền còn", (snap.money ?? 0) + "k"],
    ["Tổng thu (earned)", (snap.earned ?? 0) + "k"],
    ["Tổng điểm", snap.score ?? 0],
    ["Uy tín cuối", rep1(snap.reputation ?? 0)],
    ["Món bán chạy nhất", best ? dn(best[0]) + " ×" + best[1] : "—"],
  ];
  rows.forEach(([k, v], i) => {
    const ry = y + 104 + i * 38;
    text(k, x + 36, ry, { size: 16, weight: 600, color: C.muted });
    text(String(v), x + cw - 36, ry, { size: 20, kind: "d", weight: 800, align: "right" });
  });
  for (let i = 0; i < 5; i++) star(w / 2 - 48 + i * 24, y + 300, 10, (snap.reputation ?? 0) - i);
  button("Enter · Về menu", w / 2 - 110, y + 318, 220, 34, goMenu, { active: true, size: 15 });
}

function drawPause(w, h) {
  dim(0.6);
  const [x, y] = card(w, h, 340, 230, C.oxy);
  text("Tạm dừng", w / 2, y + 56, { size: 36, kind: "d", weight: 800, align: "center", color: C.cream });
  text("Mọi đồng hồ và bộ đếm đang đứng yên", w / 2, y + 84, { size: 13, align: "center", color: C.muted });
  button("Tiếp tục  (Esc)", x + 40, y + 108, 260, 44, togglePause, { active: true });
  button("Về menu  (M)", x + 40, y + 164, 260, 44, goMenu, { color: C.muted });
}

let lastFrame = performance.now();
function frame() {
  requestAnimationFrame(frame);  // đặt trước để lỗi vẽ không làm dừng vòng lặp
  const now = performance.now(), dt = Math.min(0.1, (now - lastFrame) / 1000), t = now / 1000;
  lastFrame = now;
  const [w, h] = fit();
  buttons = [];
  ctx.fillStyle = "#0b1622"; ctx.fillRect(0, 0, w, h);
  if (screen === "menu") drawMenu(w, h, t);
  else if (screen === "bye") drawBye(w, h, t);
  else if (snap) {
    try { drawGame(w, h, t, dt, now); }
    catch (e) {                            // lỗi vẽ: báo trên màn hình thay vì im lặng
      ctx.setTransform(uiK * (window.devicePixelRatio || 1), 0, 0, uiK * (window.devicePixelRatio || 1), 0, 0);
      pill("Lỗi vẽ UI: " + String(e && e.message || e).slice(0, 90), 12, h - 60, C.danger, { size: 13, fill: "rgba(30,0,0,.9)" });
      if (!frame.logged) { frame.logged = true; console.error(e); }
    }
  } else {
    text("Quán Ăn Chợ Nổi", w / 2, h / 2 - 8, { kind: "d", size: 36, weight: 800, align: "center", color: C.gold });
    text(offline ? "Không kết nối được máy chủ — đã chạy python -m chonoi.live chưa?" : "Đang tải…", w / 2, h / 2 + 26, { align: "center", size: 15, color: C.muted });
  }
  syncHold();
}
function drawGame(w, h, t, dt, now) {
  {
    collectToasts();
    detectStage();
    if (intro && now > intro.until) intro = null;
    const phase = snap.phase || snap.mode;
    const summary = snap.finished && (snap.mode === "day" || snap.reason === "days_complete");
    if (summary) drawSummary(w, h, t);
    else if (phase === "shop") drawShop(w, h, t);
    else if (phase === "quan") drawQuan(w, h, t);
    else drawGather(w, h, t, dt);
    eventLog(w, h);
    if (!summary) overlay(w, h);
    if (result) drawResult(w, h);
    else if (intro) drawIntro(w, h, now);
    else if (isPaused() && !snap.finished) drawPause(w, h);
  }
}
poll();
if (screen === "game" && !MOCK) restartGame();   // ?play=1: vào thẳng, vẫn có DayIntro từ tick 0
requestAnimationFrame(frame);
</script>
