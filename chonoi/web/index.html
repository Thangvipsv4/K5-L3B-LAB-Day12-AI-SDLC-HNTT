<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quán Ăn Chợ Nổi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>
  html, body { margin: 0; height: 100%; background: #0b1622; color: #f7ecd6; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";
/*
 * Client chơi trực tiếp — nhóm HNTT (client/ui). CHỈ ĐỌC snapshot từ GET /state và gửi phím qua POST /input.
 * Trường nào snapshot chưa có thì bỏ qua (nhóm viết luật tới đâu, hình hiện tới đó).
 * Mọi hiệu ứng (bọt nước, sóng, đèn lồng, toast) chỉ ở client: không ảnh hưởng mô phỏng/headless.
 * Phím: WASD / mũi tên = di chuyển · E = interact · Space = catch · Esc/P = tạm dừng · R = chơi lại · L = nhật ký.
 * Shop: 1 = bình oxy · 2 = áo phao · Enter = đóng Shop. Menu/intro/kết quả: Enter, Space hoặc click.
 *
 * Phase 2 — luồng màn (docs/phase2.md mục 2):
 *   Menu chính → DayIntro → gather → EveningIntro → quan → DayResult → Shop → DayIntro … → Summary
 * Màn Menu/DayIntro/EveningIntro/DayResult chỉ ở client; trong lúc đó client xin server `hold` (sim đứng yên),
 * nên không có tick nào bị tiêu và headless không bị ảnh hưởng.
 * Xem trước khi chưa có mode day: /?mock=gather|quan|shop|dayintro|evening|result|summary|pause|menu
 */
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
let snap = null, offline = false, showLog = false;
const QS = new URLSearchParams(location.search);
const MOCK = QS.get("mock");

// ---------- màn hình client ----------
// screen: "menu" | "game" | "bye". Trong "game" có thể chồng: intro (day/evening), result (DayResult).
let screen = MOCK && MOCK !== "menu" ? "game" : (QS.has("play") ? "game" : "menu");
let intro = null;          // {kind: "day"|"evening", until: ms}
let result = null;         // {stats, day}: DayResult đang hiện
let menuSel = 0;
let buttons = [];          // vùng click của khung hình hiện tại: {x, y, w, h, on}
const INTRO_MS = 4000;

// ---------- vào: phím ----------
const down = new Set();
const MOVE_KEYS = { w: "u", arrowup: "u", s: "d", arrowdown: "d", a: "l", arrowleft: "l", d: "r", arrowright: "r" };
let queue = [], inflight = false, lastSent = "";

function currentInput() {
  const mode = snap ? (snap.phase || snap.mode) : "gather";
  const dx = (down.has("r") ? 1 : 0) - (down.has("l") ? 1 : 0);
  let dy = (down.has("d") ? 1 : 0) - (down.has("u") ? 1 : 0);   // gather: xuống = d dương
  if (mode === "quan") dy = -dy;                                // quan: lên (bắc) = z dương
  return { move: [dx, dy], interact: down.has("interact"), catch: down.has("catch") };
}
function pushInput() {
  const s = JSON.stringify(currentInput());
  if (s === lastSent) return;
  lastSent = s;
  queue.push(s);
  flush();
}
function post(path, obj) {
  if (MOCK) return;
  queue.push([path, obj === undefined ? "" : JSON.stringify(obj)]);
  flush();
}
async function flush() {
  if (inflight) return;
  inflight = true;
  while (queue.length) {
    const item = queue.shift();
    const [path, body] = Array.isArray(item) ? item : ["/input", item];
    if (MOCK) continue;
    try { await fetch(path, { method: "POST", body, headers: { "Content-Type": "application/json" } }); }
    catch (e) { /* mất kết nối: poll sẽ báo */ }
  }
  inflight = false;
}
function tapButton(name) {                 // một cạnh lên: nhấn rồi nhả
  post("/input", { [name]: true });
  post("/input", { [name]: false });
}
let holdSent = null;
let wantRun = null;                        // sau restart: chờ snapshot có run_id mới (giữ sim đứng tới lúc đó)
function syncHold() {                      // sim đứng yên khi client đang ở màn không chơi
  const want = screen !== "game" || !!intro || !!result || wantRun !== null;
  if (want !== holdSent) { holdSent = want; post("/hold", { hold: want }); }
}
function restartGame() {
  holdSent = true; post("/hold", { hold: true });   // giữ trước, rồi mới chơi lại -> intro không mất tick nào
  post("/restart");
  wantRun = MOCK ? null : (snap && snap.run_id !== undefined ? snap.run_id + 1 : 1);
  lastSent = ""; down.clear();
  intro = null; result = null; prevStage = null; resetRun();
}
function isPaused() { return !!snap && (snap.ui_paused || snap.state === "paused"); }
function togglePause() { if (snap && !snap.finished) post("/pause"); }
function clickAt(x, y) {
  for (const b of buttons) if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) { b.on(); return; }
}
cv.addEventListener("click", (e) => { const r = cv.getBoundingClientRect(); clickAt((e.clientX - r.left) / uiK, (e.clientY - r.top) / uiK); });

function keyName(e) { return e.key.toLowerCase(); }
const CONFIRM = (k) => k === "enter" || k === " ";
addEventListener("keydown", (e) => {
  const k = keyName(e);
  if (k === " " || k.startsWith("arrow")) e.preventDefault();
  if (e.repeat) return;
  if (k === "l") { showLog = !showLog; return; }
  // --- màn không chơi: chỉ điều hướng, không gửi phím vào sim ---
  if (screen === "menu") {
    if (k === "arrowup" || k === "w" || k === "arrowdown" || k === "s") menuSel = 1 - menuSel;
    else if (CONFIRM(k)) (menuSel === 0 ? startPlay : quitGame)();
    return;
  }
  if (screen === "bye") { if (CONFIRM(k)) screen = "menu"; return; }
  if (intro) { intro = null; return; }                    // DayIntro/EveningIntro: phím bất kỳ để vào
  if (result) { if (CONFIRM(k) || k === "e") result = null; return; }
  if (snap && snap.finished && (snap.mode === "day" || snap.reason === "days_complete")) { if (CONFIRM(k)) goMenu(); return; }
  if (k === "escape" || k === "p") { togglePause(); return; }
  if (isPaused()) {
    if (CONFIRM(k)) togglePause();
    else if (k === "m") goMenu();
    return;
  }
  if (k === "r") { restartGame(); return; }
  if (snap && snap.phase === "shop") {
    if (k === "1") buy("oxygen");
    else if (k === "2") buy("hp");
    else if (k === "enter") tapButton("shop_done");
    return;
  }
  if (MOVE_KEYS[k]) down.add(MOVE_KEYS[k]);
  else if (k === "e") down.add("interact");
  else if (k === " ") down.add("catch");
  pushInput();
});
addEventListener("keyup", (e) => {
  const k = keyName(e);
  if (MOVE_KEYS[k]) down.delete(MOVE_KEYS[k]);
  else if (k === "e") down.delete("interact");
  else if (k === " ") down.delete("catch");
  pushInput();
});
addEventListener("blur", () => { down.clear(); pushInput(); });
function startPlay() { screen = "game"; restartGame(); }
function quitGame() { screen = "bye"; try { window.close(); } catch (_) {} }
function goMenu() { if (isPaused()) togglePause(); restartGame(); screen = "menu"; }
function buy(id) { post("/input", { buy: id }); }

// ---------- ra: poll snapshot ----------
async function poll() {
  try {
    if (MOCK) { snap = await mockSnapshot(MOCK); offline = false; return; }   // mock: tải một lần
    const r = await fetch("/state", { cache: "no-store" });
    snap = await r.json();
    offline = false;
  } catch (e) { offline = true; }
  setTimeout(poll, 16);
}
async function mockSnapshot(kind) {
  const r = await fetch("/mock.json" + (QS.get("v") === "12" ? "?v=12" : ""), { cache: "no-store" });   // &v=12: kho cá thể
  const m = await r.json();
  const pick = { gather: "gather", dayintro: "gather", menu: "gather", quan: "quan", evening: "quan", result: "quan", pause: "gather" }[kind] || "shop";
  const s = Object.assign({ events: [], cfg: {}, meta: {} }, m[pick]);
  s.state = kind === "pause" ? "paused" : (kind === "shop" ? "playing" : s.state);
  if (kind === "summary") { s.finished = true; s.reason = "days_complete"; s.state = "finished"; s.days_completed = 5; s.day = 5; }
  try {                                    // mock không có server luật: lấy cfg/meta từ /state nếu server đang chạy
    const live = await (await fetch("/state", { cache: "no-store" })).json();
    s.cfg = live.cfg || {};
    s.meta = (live.cfg && pick !== "shop" && liveTuning(live, pick)) || {};
  } catch (_) {}
  if (kind === "dayintro") intro = { kind: "day", until: Infinity };
  if (kind === "evening") intro = { kind: "evening", until: Infinity };
  if (kind === "result") result = { day: s.day, stats: { served: 3, left: 1, closing: 0, income: 270, tips: 24, repStart: 3.0, repEnd: 3.2, dishes: { lau_ca_linh_dien_dien: 2, ca_loc_nuong_trui: 1 } } };
  prevStage = stageKey(s);
  return s;
}
function liveTuning(live, pick) { return live.phase === pick ? live.meta : null; }
// poll() và lần chơi lại đầu tiên chạy ở cuối file, sau khi mọi biến `let` đã khai báo.

// =====================================================================================
// ---------- bảng màu, chữ, dữ liệu hiển thị ----------
// Hướng thiết kế: chợ nổi miền Tây — sáng bình minh trên sông phù sa, tối đèn lồng trên ghe.
// Khung HUD: gỗ tếch sẫm, viền vàng bông điên điển.
const C = {
  panel: "rgba(30,21,14,.84)", panelHi: "rgba(255,236,200,.06)", edge: "rgba(242,194,48,.32)",
  cream: "#f7ecd6", muted: "#c9b796", dim: "#8d7d69",
  gold: "#f2c230", lotus: "#ec7fa3", oxy: "#5fd0f2", heart: "#ff5d73",
  danger: "#ff5a4f", warn: "#ffae3d", ok: "#8bd67f",
};
const FD = '"Baloo 2", "Segoe UI", system-ui, sans-serif';         // tiêu đề, số lớn
const FB = '"Be Vietnam Pro", "Segoe UI", system-ui, sans-serif';  // chữ thường
const FM = 'ui-monospace, Consolas, "Cascadia Mono", monospace';    // nhật ký

const KIND_COLOR = { ca_loc: "#6f8f4e", ca_linh: "#cfdde8", ca_keo: "#d39a5e", bong_dien_dien: "#f2c230", bong_sung: "#ec7fa3", keo_neo: "#8fcf6b" };
const KIND_NAME = { ca_loc: "cá lóc", ca_linh: "cá linh", ca_keo: "cá kèo", bong_dien_dien: "điên điển", bong_sung: "bông súng", keo_neo: "kèo nèo" };
const kc = (k) => KIND_COLOR[k] || "#bbbbbb";
const DISH_NAME = {
  ca_loc_nuong_trui: "Cá lóc nướng trui", goi_bong_sung: "Gỏi bông súng", lau_ca_linh_dien_dien: "Lẩu cá linh điên điển",
  canh_chua_ca_loc: "Canh chua cá lóc", ca_keo_nuong: "Cá kèo nướng muối ớt", lau_mam: "Lẩu mắm miền Tây",
};
const DISH_MAIN = {
  ca_loc_nuong_trui: "ca_loc", goi_bong_sung: "bong_sung", lau_ca_linh_dien_dien: "ca_linh",
  canh_chua_ca_loc: "ca_loc", ca_keo_nuong: "ca_keo", lau_mam: "keo_neo",
};
const UPGRADE_INFO = {
  oxygen: { name: "Bình oxy", key: "1", field: "oxygen_max_s", unit: (v) => v + " s oxy", color: "#5fd0f2" },
  hp: { name: "Áo phao", key: "2", field: "hp_max", unit: (v) => v + " Máu", color: "#ff5d73" },
};
const DEPTH_ZONE = (d) => (d < 10 ? "Nông" : d < 20 ? "Giữa" : "Sâu");

// ---------- kho: đọc được cả v1.1 (đếm) lẫn v1.2 (cá thể {id, kind, fresh}) ----------
// v1.1: hold = ["ca_loc", ...], stock = {"ca_loc": 2}, reserved = {"ca_loc": 1}
// v1.2: hold/stock = [{"id","kind","fresh"}], reserved = ["I1", "I3"]   (docs/contracts/README.md mục 7)
function toItems(x) {
  if (!x) return [];
  if (Array.isArray(x)) return x.map((e) => (typeof e === "string" ? { id: null, kind: e, fresh: null } : e));
  const out = [];
  Object.keys(x).forEach((k) => { for (let i = 0; i < x[k]; i++) out.push({ id: null, kind: k, fresh: null }); });
  return out;
}
const spoilBelow = () => (snap && snap.cfg && snap.cfg.freshness && snap.cfg.freshness.spoiled_below) || 30;
const isSpoiled = (it) => it.fresh != null && it.fresh < spoilBelow();
const freshColor = (f) => (f == null ? C.muted : f < spoilBelow() ? C.danger : f < 50 ? C.warn : C.ok);
const fmtFresh = (f) => (f == null ? "" : Math.floor(f) + "%");
function reservedIds(cs) {                       // v1.2: tập id đang giữ chỗ
  const s = new Set();
  cs.forEach((c) => { if (Array.isArray(c.reserved)) c.reserved.forEach((id) => s.add(id)); });
  return s;
}
function reservedCounts(cs) {                    // v1.1: đếm giữ chỗ theo loại
  const m = {};
  cs.forEach((c) => { if (c.reserved && !Array.isArray(c.reserved)) Object.keys(c.reserved).forEach((k) => (m[k] = (m[k] || 0) + c.reserved[k])); });
  return m;
}
// Gom kho theo loại: tổng, ươn, đang giữ chỗ, khả dụng (chưa ươn và chưa giữ), độ tươi thấp nhất/trung bình
function groupStock(stockRaw, cs) {
  const items = toItems(stockRaw), ids = reservedIds(cs), cnt = reservedCounts(cs), g = {};
  items.forEach((it) => {
    const e = g[it.kind] || (g[it.kind] = { kind: it.kind, total: 0, spoiled: 0, held: 0, fresh: [] });
    e.total++;
    if (isSpoiled(it)) e.spoiled++;
    if (it.id != null && ids.has(it.id)) e.held++;
    if (it.fresh != null) e.fresh.push(it.fresh);
  });
  Object.values(g).forEach((e) => {
    e.held += cnt[e.kind] || 0;
    e.avail = Math.max(0, e.total - e.spoiled - e.held);
    e.min = e.fresh.length ? Math.min(...e.fresh) : null;
    e.avg = e.fresh.length ? e.fresh.reduce((a, b) => a + b, 0) / e.fresh.length : null;
  });
  return g;
}
function freshBar(x, y, w, f) {                  // thanh độ tươi nhỏ dưới icon
  if (f == null) return;
  rr(x, y, w, 4, 2); ctx.fillStyle = "rgba(0,0,0,.55)"; ctx.fill();
  rr(x, y, Math.max(2, w * clamp01(f / 100)), 4, 2); ctx.fillStyle = freshColor(f); ctx.fill();
}
// món có thể là chuỗi dish_id hoặc payload {order_id, dish_id, base_price} (bếp/tay ở lát 4)
const DISH_SHORT = { ca_loc_nuong_trui: "Cá lóc nướng", goi_bong_sung: "Gỏi bông súng", lau_ca_linh_dien_dien: "Lẩu cá linh",
  canh_chua_ca_loc: "Canh chua", ca_keo_nuong: "Cá kèo nướng", lau_mam: "Lẩu mắm" };
const dn = (d) => { const id = d && typeof d === "object" ? d.dish_id : d; return DISH_NAME[id] || id || "?"; };
const STOVE_STATE = { idle: "Bếp rảnh", cooking: "Đang nấu", ready: "Chín · E lấy", burnt: "Cháy" };
const ORDER_STATUS = { reserved: ["Đã giữ nguyên liệu", C.gold], assigned: ["Đang nấu", C.warn], unfulfillable: ["Không nấu được", C.danger], served: ["Đã phục vụ", C.ok] };
const REASON = { docked: "Cập bến an toàn", time: "Hết giờ", fainted: "Ngất xỉu dưới nước", days_complete: "Hoàn thành chuỗi ngày" };
const BUY_FAIL = { funds: "không đủ tiền", max_level: "đã cấp tối đa", out_of_stock: "hết hàng", unknown: "lệnh không hợp lệ" };

// ---------- tiện ích vẽ ----------
const TAU = Math.PI * 2;
const clamp01 = (v) => Math.max(0, Math.min(1, v || 0));
// Tỉ lệ giao diện: vẽ trên khung logic ~853×480 rồi phóng lên màn hình.
// Ở 1280×720 hệ số = 1.5, chữ nhỏ nhất 12 px logic = 18 px thật (PRD P2: chữ ≥ 18 px ở 1280×720).
const MIN_FONT = 12;
let uiK = 1;
function fit() {
  const dpr = window.devicePixelRatio || 1;
  const W = cv.clientWidth || innerWidth, H = cv.clientHeight || innerHeight;
  if (cv.width !== Math.round(W * dpr) || cv.height !== Math.round(H * dpr)) { cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); }
  uiK = Math.max(1, Math.min(W / 853, H / 480));
  ctx.setTransform(dpr * uiK, 0, 0, dpr * uiK, 0, 0);
  return [W / uiK, H / uiK];
}
function font(size, kind, weight) {
  const f = kind === "d" ? FD : kind === "m" ? FM : FB;
  ctx.font = `${weight || (kind === "d" ? 700 : 500)} ${Math.max(MIN_FONT, size)}px ${f}`;
}
function text(s, x, y, o = {}) {
  font(o.size || 14, o.kind, o.weight);
  ctx.fillStyle = o.color || C.cream;
  ctx.textAlign = o.align || "left";
  ctx.textBaseline = o.base || "alphabetic";
  if (o.shadow) { ctx.shadowColor = "rgba(0,0,0,.6)"; ctx.shadowBlur = 4; ctx.shadowOffsetY = 1; }
  ctx.fillText(s, x, y);
  ctx.shadowColor = "transparent"; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
}
function measure(s, size, kind, weight) { font(size, kind, weight); return ctx.measureText(s).width; }
function rr(x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  ctx.beginPath(); ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function panel(x, y, w, h, o = {}) {
  ctx.shadowColor = "rgba(0,0,0,.35)"; ctx.shadowBlur = 14; ctx.shadowOffsetY = 4;
  rr(x, y, w, h, o.r ?? 14); ctx.fillStyle = o.fill || C.panel; ctx.fill();
  ctx.shadowColor = "transparent"; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
  rr(x + 1, y + 1, w - 2, Math.min(18, h / 2), (o.r ?? 14) - 1); ctx.fillStyle = C.panelHi; ctx.fill();
  rr(x, y, w, h, o.r ?? 14); ctx.lineWidth = o.lw || 1.5; ctx.strokeStyle = o.edge || C.edge; ctx.stroke(); ctx.lineWidth = 1;
}
function pill(s, x, y, color, o = {}) {           // x,y = góc trái-giữa; trả bề rộng
  const size = Math.max(MIN_FONT, o.size || 11), pad = o.pad || 8, tw = measure(s, size, "b", 600), h = size + 9;
  rr(x, y - h / 2, tw + pad * 2, h, h / 2);
  ctx.fillStyle = o.fill || hexA(color, 0.18); ctx.fill();
  ctx.strokeStyle = hexA(color, 0.55); ctx.stroke();
  text(s, x + pad, y + 0.5, { size, weight: 600, base: "middle", color: o.textColor || color });
  return tw + pad * 2;
}
function bar(x, y, w, h, frac, color, o = {}) {
  frac = clamp01(frac);
  rr(x, y, w, h, h / 2); ctx.fillStyle = "rgba(0,0,0,.5)"; ctx.fill();
  if (frac > 0) {
    const fw = Math.max(h, w * frac);
    rr(x, y, fw, h, h / 2); ctx.fillStyle = color; ctx.fill();
    rr(x + 2, y + 1.5, fw - 4, Math.max(1, h * 0.35), h / 4); ctx.fillStyle = "rgba(255,255,255,.28)"; ctx.fill();
  }
  if (o.label) text(o.label, x + w / 2, y + h / 2 + 1, { size: o.labelSize || 11, align: "center", base: "middle", weight: 700, shadow: true });
}
function hexA(hex, a) {
  if (!hex || hex[0] !== "#") return hex;
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`;
}
function shade(hex, a) {
  if (!hex || hex[0] !== "#") return hex;
  const n = parseInt(hex.slice(1), 16), f = (c) => Math.round(a >= 0 ? c + (255 - c) * a : c * (1 + a));
  return `rgb(${f(n >> 16)},${f((n >> 8) & 255)},${f(n & 255)})`;
}
function fmtTime(ticks) {
  const s = Math.ceil((ticks || 0) / 60);
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function ring(x, y, r, frac, color, lw = 3) {
  ctx.lineWidth = lw; ctx.strokeStyle = "rgba(0,0,0,.35)"; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.stroke();
  ctx.strokeStyle = color; ctx.beginPath(); ctx.arc(x, y, r, -Math.PI / 2, -Math.PI / 2 + TAU * clamp01(frac)); ctx.stroke();
  ctx.lineWidth = 1;
}

// ---------- hình vẽ nhỏ: tim, sao, xu, cá, hoa ----------
function heart(cx, cy, r, full) {
  ctx.beginPath();
  ctx.moveTo(cx, cy + r * 0.95);
  ctx.bezierCurveTo(cx - r * 1.35, cy + r * 0.1, cx - r * 0.95, cy - r * 1.05, cx, cy - r * 0.35);
  ctx.bezierCurveTo(cx + r * 0.95, cy - r * 1.05, cx + r * 1.35, cy + r * 0.1, cx, cy + r * 0.95);
  ctx.closePath();

const TOAST_MS = 2800;

// ---------- số liệu cho DayResult / Summary (gom từ event, chỉ hiển thị) ----------
let dayStats = null, runStats = null;
function newDayStats(rep) { return { served: 0, left: 0, closing: 0, income: 0, tips: 0, repStart: rep, repEnd: rep, dishes: {} }; }

resetRun();
function onEvent(e) {
  const d = e.data || {};
  if (e.name === "served") {
    dayStats.served++; runStats.served++;
    dayStats.dishes[d.dish_id] = (dayStats.dishes[d.dish_id] || 0) + 1;
    runStats.dishes[d.dish_id] = (runStats.dishes[d.dish_id] || 0) + 1;
  } else if (e.name === "paid") {
    dayStats.income += d.amount || 0; dayStats.tips += d.tip || 0;
    runStats.income += d.amount || 0; runStats.tips += d.tip || 0;
  } else if (e.name === "customer_left") {

}
function collectToasts() {
  const ev = snap.events || [], now = performance.now();
  if ((snap.tick ?? 0) < seenTick || snap.mode !== lastMode) { seenTick = 0; toasts = []; bubbles = []; lastMode = snap.mode; }
  let maxT = seenTick;
  ev.forEach((e) => {
    if (e.tick > seenTick) {
      onEvent(e);
      const f = EVENT_MSG[e.name];
      if (f) { try { const [msg, color] = f(e.data || {}); toasts.push({ msg, color, at: now }); } catch (_) {} }
      if (e.tick > maxT) maxT = e.tick;
    }
  });
  seenTick = maxT;
  toasts = toasts.filter((t) => now - t.at < TOAST_MS).slice(-4);

// ---------- chuyển màn theo pha (DayIntro / EveningIntro / DayResult) ----------
let prevStage = null;

function detectStage() {
  if (MOCK) return;
  if (wantRun !== null) {                  // snapshot cũ của lượt trước: bỏ qua
    if (snap.run_id !== undefined && snap.run_id < wantRun) return;
    wantRun = null;
  }
  const key = stageKey(snap);
  if (key === prevStage) return;
  const prev = prevStage;
  prevStage = key;
  const phase = snap.phase || snap.mode;
  if (snap.finished) {
    // quán độc lập kết thúc -> DayResult; mode day kết thúc -> Summary (vẽ trong overlay)
    if (snap.mode === "quan") result = { day: snap.day ?? 1, stats: dayStats };
    return;
  }
  if (phase === "gather") intro = { kind: "day", until: performance.now() + INTRO_MS };
  else if (phase === "quan") {
    dayStats = newDayStats(snap.reputation);
    intro = { kind: "evening", until: performance.now() + INTRO_MS };
  } else if (phase === "shop" && prev && prev.includes("|quan|")) result = { day: snap.day ?? 1, stats: dayStats };
}
