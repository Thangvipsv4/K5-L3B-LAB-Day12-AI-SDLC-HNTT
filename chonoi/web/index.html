    else line = `Tiền ${snap.money ?? 0}k · Uy tín ${rep1(snap.reputation ?? 0)} · Điểm ${snap.score ?? 0}`;
    text(line, w / 2, y + 120, { size: 18, weight: 600, align: "center" });
    text("Nhấn R để chơi lại", w / 2, y + 166, { size: 13, align: "center", color: C.dim });
  }
}

// ---------- bọt nước (chỉ hiệu ứng client) ----------
let bubbles = [], lastBubble = 0;
function updateBubbles(p, underwater, dt, now) {
  if (p && p.pos && underwater && !snap.finished && now - lastBubble > 240) {
    lastBubble = now;
    bubbles.push({ x: p.pos[0] + (Math.random() - 0.5) * 0.5, d: p.pos[1] - 0.4, r: 0.1 + Math.random() * 0.13, v: 1.4 + Math.random() * 1.2, ph: Math.random() * TAU });
  }
  bubbles.forEach((b) => { b.d -= b.v * dt; b.x += Math.sin(now / 280 + b.ph) * dt * 0.35; });
  bubbles = bubbles.filter((b) => b.d > 0).slice(-70);
}

// =====================================================================================
// ----- phong cảnh sông miền Tây (chỉ hiệu ứng client; vị trí ngẫu nhiên giả cố định, không dùng RNG của sim) -----
let camX = null;                                   // camera ngang của cảnh lặn (px)
const hash = (i) => { const v = Math.sin(i * 127.1 + 311.7) * 43758.5453; return v - Math.floor(v); };
const wmod = (a, m) => ((a % m) + m) % m;

function cloud(x, y, r, a) {
  ctx.fillStyle = `rgba(255,248,236,${a})`;
  [[0, 0, 1], [-0.9, 0.2, 0.7], [0.9, 0.15, 0.75], [-0.35, -0.35, 0.7], [0.4, -0.3, 0.65]].forEach(([dx, dy, k]) => {
    ctx.beginPath(); ctx.ellipse(x + dx * r, y + dy * r, r * k, r * k * 0.62, 0, 0, TAU); ctx.fill();
  });
}
function palm(x, yb, hgt, t, k) {                  // dừa: thân cong, tàu lá đung đưa
  const lean = (hash(k) - 0.5) * 0.5 * hgt, sway = Math.sin(t * 1.1 + k) * hgt * 0.03;
  const tx = x + lean + sway, ty = yb - hgt;
  ctx.strokeStyle = "#6b5236"; ctx.lineWidth = Math.max(2, hgt * 0.06); ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(x, yb); ctx.quadraticCurveTo(x + lean * 0.2, yb - hgt * 0.6, tx, ty); ctx.stroke();
  ctx.strokeStyle = "#4e7a3a"; ctx.lineWidth = Math.max(1.5, hgt * 0.045);
  for (let i = 0; i < 7; i++) {
    const a = -Math.PI / 2 + (i - 3) * 0.48 + Math.sin(t * 1.4 + i + k) * 0.05, L = hgt * (0.42 + 0.08 * (i % 2));
    ctx.beginPath(); ctx.moveTo(tx, ty);
    ctx.quadraticCurveTo(tx + Math.cos(a) * L * 0.6, ty + Math.sin(a) * L * 0.6 - L * 0.15, tx + Math.cos(a) * L, ty + Math.sin(a) * L + L * 0.35); ctx.stroke();
  }
  ctx.fillStyle = "#5d4a2a"; ctx.beginPath(); ctx.arc(tx, ty + hgt * 0.04, hgt * 0.04, 0, TAU); ctx.fill();
  ctx.lineCap = "butt"; ctx.lineWidth = 1;
}
function stiltHouse(x, yb, sc, k) {                // nhà sàn ven sông: cột cắm xuống nước, vách ván, mái lá hoặc tôn
  const W = 4.2 * sc, H = 2.2 * sc, floorY = yb - 1.1 * sc, tin = hash(k + 3) > 0.5;
  ctx.fillStyle = "#4a3624";
  for (let i = 0; i <= 4; i++) ctx.fillRect(x - W / 2 + (i * W) / 4 - sc * 0.06, floorY, sc * 0.12, yb - floorY + sc * 0.5);
  ctx.fillStyle = "#6e5236"; ctx.fillRect(x - W / 2 - sc * 0.3, floorY - sc * 0.15, W + sc * 0.6, sc * 0.18);      // sàn
  ctx.fillStyle = hash(k) > 0.5 ? "#a77c4e" : "#b48a5a"; ctx.fillRect(x - W / 2, floorY - H, W, H);               // vách
  ctx.strokeStyle = "rgba(60,40,20,.35)";
  for (let i = 1; i < 6; i++) { ctx.beginPath(); ctx.moveTo(x - W / 2 + (i * W) / 6, floorY - H); ctx.lineTo(x - W / 2 + (i * W) / 6, floorY); ctx.stroke(); }
  ctx.fillStyle = "#2d2016"; ctx.fillRect(x - W * 0.12, floorY - H * 0.72, W * 0.24, H * 0.72);                   // cửa
  ctx.fillStyle = "#ffd98a"; ctx.fillRect(x + W * 0.22, floorY - H * 0.7, W * 0.16, H * 0.3);                     // cửa sổ có đèn
  ctx.fillStyle = tin ? "#8c9aa3" : "#8a6a3c";                                                                       // mái tôn / mái lá
  ctx.beginPath(); ctx.moveTo(x - W / 2 - sc * 0.55, floorY - H); ctx.lineTo(x, floorY - H - 1.5 * sc); ctx.lineTo(x + W / 2 + sc * 0.55, floorY - H); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = tin ? "rgba(255,255,255,.25)" : "rgba(60,40,10,.35)";
  for (let i = 1; i < 7; i++) { const fx = x - W / 2 - sc * 0.55 + (i * (W + sc * 1.1)) / 7; ctx.beginPath(); ctx.moveTo(fx, floorY - H); ctx.lineTo(x + (fx - x) * 0.15, floorY - H - 1.3 * sc); ctx.stroke(); }
  if (hash(k + 7) > 0.4) {                         // dây phơi đồ
    ctx.strokeStyle = "rgba(40,30,20,.6)"; ctx.beginPath(); ctx.moveTo(x + W / 2, floorY - H * 0.8); ctx.lineTo(x + W / 2 + sc * 1.6, floorY - H * 0.6); ctx.stroke();
    ["#d9534f", "#5b8fd6", "#f0c040"].forEach((c, i) => { ctx.fillStyle = c; ctx.fillRect(x + W / 2 + sc * (0.3 + i * 0.45), floorY - H * 0.76 + i * sc * 0.06, sc * 0.3, sc * 0.45); });
  }
}
function gheSide(x, y, L, t, o = {}) {             // ghe nhìn ngang: mũi vẽ mắt, người chèo đứng đội nón lá
  const bob = Math.sin(t * 1.7 + x * 0.01) * L * 0.015, dir = o.dir || 1;
  ctx.save(); ctx.translate(x, y + bob); ctx.scale(dir, 1);
  ctx.fillStyle = o.hull || "#5a3a22";
  ctx.beginPath(); ctx.moveTo(-L / 2, -L * 0.1); ctx.quadraticCurveTo(-L * 0.35, L * 0.1, 0, L * 0.1); ctx.quadraticCurveTo(L * 0.35, L * 0.1, L / 2, -L * 0.14); ctx.closePath(); ctx.fill();
  ctx.fillStyle = o.stripe || "#2f6b8f"; ctx.fillRect(-L * 0.42, -L * 0.09, L * 0.84, L * 0.025);
  ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.ellipse(L * 0.4, -L * 0.04, L * 0.03, L * 0.018, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = "#c22"; ctx.beginPath(); ctx.arc(L * 0.405, -L * 0.04, L * 0.012, 0, TAU); ctx.fill();
  if (o.goods) {                                   // hàng chất trên ghe (bí, dưa, khóm)
    o.goods.forEach((c, i) => { ctx.fillStyle = c; ctx.beginPath(); ctx.ellipse(-L * 0.25 + i * L * 0.09, -L * 0.13, L * 0.05, L * 0.04, 0, 0, TAU); ctx.fill(); });
  }
  if (o.beo) {                                     // cây bẹo: sào treo hàng mẫu để rao bán
    ctx.strokeStyle = "#6b5236"; ctx.lineWidth = Math.max(1, L * 0.012);
    ctx.beginPath(); ctx.moveTo(-L * 0.05, -L * 0.1); ctx.lineTo(-L * 0.05, -L * 0.62); ctx.stroke();
    ctx.fillStyle = o.beo; ctx.beginPath(); ctx.ellipse(-L * 0.05, -L * 0.55, L * 0.04, L * 0.05, 0, 0, TAU); ctx.fill();
  }
  if (o.rower !== false) {                         // người chèo
    const px = L * 0.28, stroke = Math.sin(t * 2.2 + x * 0.02);
    ctx.strokeStyle = "#7a5a36"; ctx.lineWidth = Math.max(1, L * 0.014);
    ctx.beginPath(); ctx.moveTo(px - L * 0.02, -L * 0.28); ctx.lineTo(px + L * (0.1 + stroke * 0.06), L * 0.1); ctx.stroke();
    ctx.fillStyle = "#3b5f8f"; ctx.fillRect(px - L * 0.03, -L * 0.3, L * 0.06, L * 0.18);
    ctx.fillStyle = "#e9c398"; ctx.beginPath(); ctx.arc(px, -L * 0.33, L * 0.03, 0, TAU); ctx.fill();
    ctx.fillStyle = "#e8d59a"; ctx.beginPath(); ctx.moveTo(px - L * 0.07, -L * 0.33); ctx.lineTo(px, -L * 0.42); ctx.lineTo(px + L * 0.07, -L * 0.33); ctx.closePath(); ctx.fill();
  }
  ctx.restore(); ctx.lineWidth = 1;
}
function lucBinh(x, y, r, t, k) {                  // lục bình: lá tròn bóng, cuống phồng, chùm hoa tím
  const bob = Math.sin(t * 1.5 + k) * r * 0.08;
  ctx.save(); ctx.translate(x, y + bob);
  ctx.fillStyle = "rgba(40,60,20,.35)"; ctx.beginPath(); ctx.ellipse(0, r * 0.15, r * 1.3, r * 0.28, 0, 0, TAU); ctx.fill();
  for (let i = 0; i < 6; i++) {
    const a = -Math.PI / 2 + (i - 2.5) * 0.45, g = ctx.createLinearGradient(0, -r, 0, 0);
    g.addColorStop(0, "#7fbf4d"); g.addColorStop(1, "#3f7a2a");
    ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(Math.cos(a) * r * 0.55, Math.sin(a) * r * 0.5, r * 0.36, r * 0.3, a, 0, TAU); ctx.fill();
  }
  if (hash(k) > 0.35) {
    ctx.fillStyle = "#b79be6";
    for (let i = 0; i < 5; i++) { ctx.beginPath(); ctx.arc((i % 2 ? 0.1 : -0.1) * r, -r * (1.05 + i * 0.16), r * 0.13, 0, TAU); ctx.fill(); }
    ctx.fillStyle = "#f2d84a"; ctx.beginPath(); ctx.arc(0, -r * 1.2, r * 0.05, 0, TAU); ctx.fill();
  }
  ctx.restore();
}

function drawGatherBackdrop(w, h, t, g) {
  const { s, oy, bed, sx, X, camX: cx } = g;
  // trời bình minh, mặt trời, mây trôi
  const sky = ctx.createLinearGradient(0, 0, 0, oy);
  sky.addColorStop(0, "#e9956e"); sky.addColorStop(0.45, "#f6c896"); sky.addColorStop(1, "#f7e4c4");
  ctx.fillStyle = sky; ctx.fillRect(0, 0, w, oy);
  const sunX = w * 0.74 - cx * 0.04, sunY = oy - s * 3.4;
  const sg = ctx.createRadialGradient(sunX, sunY, 4, sunX, sunY, 110);
  sg.addColorStop(0, "rgba(255,248,220,1)"); sg.addColorStop(0.18, "rgba(255,230,170,.8)"); sg.addColorStop(1, "rgba(255,200,140,0)");
  ctx.fillStyle = sg; ctx.fillRect(sunX - 110, sunY - 110, 220, 220);
  for (let i = 0; i < 6; i++) cloud(wmod(i * 230 + t * 5 - cx * 0.08, w + 260) - 130, 18 + (i % 3) * 16, 14 + (i % 2) * 6, 0.55);
  // dải cây xa (thị sai 0.2)
  ctx.fillStyle = "#7f9a6a";
  ctx.beginPath(); ctx.moveTo(0, oy);
  for (let x = 0; x <= w + 12; x += 12) { const wx = x + cx * 0.2; ctx.lineTo(x, oy - s * (1.6 + 0.5 * Math.sin(wx * 0.03) + 0.3 * Math.sin(wx * 0.11))); }
  ctx.lineTo(w, oy); ctx.closePath(); ctx.fill();
  // bờ xa: nhà sàn, dừa, ghe neo (thị sai 0.45)
  const step = 8 * s;
  const i0 = Math.floor((cx * 0.45 - step) / step), i1 = Math.ceil((cx * 0.45 + w + step) / step);
  for (let i = i0; i <= i1; i++) {
    const x = i * step - cx * 0.45 + hash(i) * step * 0.4, kind = Math.floor(hash(i + 11) * 4);
    if (kind === 0 || kind === 2) stiltHouse(x, oy - s * 0.15, s * 0.72, i);
    if (kind !== 0) palm(x + step * 0.38, oy - s * 0.25, s * (3.2 + hash(i + 5) * 1.6), t, i);
    if (kind === 3) gheSide(x - step * 0.1, oy - s * 0.12, s * 4.2, t, { rower: false, hull: "#4b3220" });
  }
  ctx.fillStyle = "#8a7550"; ctx.fillRect(0, oy - s * 0.3, w, s * 0.3);                          // bờ đất phù sa
  // nước phù sa (màu "cà phê sữa" của sông Tiền, sông Hậu)
  const water = ctx.createLinearGradient(0, oy, 0, bed);
  water.addColorStop(0, "#b69a64"); water.addColorStop(0.25, "#8e7647"); water.addColorStop(0.65, "#5c4a2b"); water.addColorStop(1, "#30261a");
  ctx.fillStyle = water; ctx.fillRect(0, oy, w, bed - oy);
  for (let i = 0; i < 5; i++) {                                                                  // vệt nắng mờ (nước đục)
    const x0 = wmod(i * 190 - cx * 0.7 + Math.sin(t * 0.3 + i) * 20, w + 200) - 100;
    const lg = ctx.createLinearGradient(0, oy, 0, oy + (bed - oy) * 0.6);
    lg.addColorStop(0, "rgba(255,236,190,.14)"); lg.addColorStop(1, "rgba(255,236,190,0)");
    ctx.fillStyle = lg; ctx.beginPath(); ctx.moveTo(x0 - 12, oy); ctx.lineTo(x0 + 14, oy); ctx.lineTo(x0 + 80, oy + (bed - oy) * 0.6); ctx.lineTo(x0 + 30, oy + (bed - oy) * 0.6); ctx.closePath(); ctx.fill();
  }
  // phù sa lơ lửng trôi theo dòng
  for (let i = 0; i < 90; i++) {
    const wx = wmod(hash(i) * X + t * (0.25 + hash(i + 1) * 0.4), X + 4) - 2;
    const d = 0.6 + hash(i + 2) * (g.D - 1) + Math.sin(t * 0.6 + i) * 0.25;
    const x = sx(wx); if (x < -4 || x > w + 4) continue;
    ctx.fillStyle = `rgba(240,220,170,${0.12 + hash(i + 3) * 0.18})`;
    ctx.beginPath(); ctx.arc(x, g.sy(d), 0.8 + hash(i + 4) * 1.4, 0, TAU); ctx.fill();
  }
  // đáy sông: bùn, đá, khúc gỗ chìm, rong
  const mud = ctx.createLinearGradient(0, bed - 6, 0, h);
  mud.addColorStop(0, "#4b3b22"); mud.addColorStop(1, "#1d150b");
  ctx.fillStyle = mud; ctx.beginPath(); ctx.moveTo(0, h);
  for (let x = 0; x <= w + 10; x += 10) ctx.lineTo(x, bed - 2 + Math.sin((x + cx) * 0.025) * 4 + Math.sin((x + cx) * 0.07) * 2);
  ctx.lineTo(w, h); ctx.closePath(); ctx.fill();
  for (let i = 0; i < 18; i++) {
    const wx = hash(i + 40) * X, x = sx(wx); if (x < -40 || x > w + 40) continue;
    const r = s * (0.5 + hash(i + 41) * 0.9);
    const rg = ctx.createLinearGradient(0, bed - r, 0, bed + 4);
    rg.addColorStop(0, "#7d715c"); rg.addColorStop(1, "#3c3326");
    ctx.fillStyle = rg; ctx.beginPath(); ctx.ellipse(x, bed + 2, r * 1.3, r * 0.7, 0, Math.PI, TAU); ctx.fill();
  }
  [[38, 0.12], [71, -0.08]].forEach(([wx, ang]) => {                                              // khúc gỗ chìm
    const x = sx(wx); if (x < -120 || x > w + 120) return;
    ctx.save(); ctx.translate(x, bed - s * 0.35); ctx.rotate(ang);
    ctx.fillStyle = "#4a3520"; rr(-s * 3, -s * 0.35, s * 6, s * 0.7, s * 0.35); ctx.fill();
    ctx.fillStyle = "#6a4c2e"; ctx.beginPath(); ctx.ellipse(s * 3, 0, s * 0.2, s * 0.35, 0, 0, TAU); ctx.fill();
    ctx.restore();
  });
  ctx.lineWidth = 2.2; ctx.lineCap = "round";
  for (let wx = 0.5; wx < X; wx += 1.3) {
    const x = sx(wx + hash(wx) * 0.6); if (x < -10 || x > w + 10) continue;
    const hh = s * (0.9 + 1.4 * hash(wx + 9)), sw = Math.sin(t * 1.2 + wx) * s * 0.35;
    ctx.strokeStyle = hash(wx + 2) > 0.5 ? "rgba(110,140,70,.85)" : "rgba(80,112,58,.85)";
    ctx.beginPath(); ctx.moveTo(x, bed + 2); ctx.quadraticCurveTo(x + sw * 0.4, bed - hh * 0.5, x + sw, bed - hh); ctx.stroke();
  }
  ctx.lineWidth = 1; ctx.lineCap = "butt";
}

function drawSurface(w, t, g) {
  const { s, oy, sx, X } = g, cx = -sx(0);
  const wave = (x) => { const wx = x + cx; return oy + Math.sin(wx * 0.035 + t * 1.8) * 2.4 + Math.sin(wx * 0.09 - t * 2.7) * 1.1 + Math.sin(wx * 0.012 + t * 0.6) * 1.8; };
  // ghe chợ nổi đi ngang phía xa, chở hàng, treo bẹo (thị sai 0.75)
  [["#c0392b", ["#7cb342", "#f39c12", "#2e7d32"], "#f39c12"], ["#2f6b8f", ["#e67e22", "#8bc34a"], "#7cb342"]].forEach(([stripe, goods, beo], i) => {
    const x = wmod(i * 520 - t * (14 + i * 5) - cx * 0.75, w + 500) - 250;
    gheSide(x, oy - 1, s * 4.6, t, { stripe, goods, beo, dir: -1 });
  });
  // dải sáng ngay dưới mặt nước + đường sóng
  ctx.fillStyle = "rgba(255,238,200,.22)";
  ctx.beginPath(); ctx.moveTo(0, wave(0));
  for (let x = 0; x <= w; x += 6) ctx.lineTo(x, wave(x));
  for (let x = w; x >= 0; x -= 6) ctx.lineTo(x, wave(x) + 9 + Math.sin((x + cx) * 0.05 + t) * 2);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = "rgba(255,250,238,.9)"; ctx.lineWidth = 2; ctx.beginPath();
  for (let x = 0; x <= w; x += 6) ctx.lineTo(x, wave(x));
  ctx.stroke(); ctx.lineWidth = 1;
  // bọt trắng ở ngọn sóng + ánh nắng lấp lánh
  for (let x = wmod(-cx, 14); x <= w; x += 14) {
    const wx = x + cx, crest = Math.sin(wx * 0.035 + t * 1.8);
    if (crest > 0.6) { ctx.fillStyle = `rgba(255,255,255,${(crest - 0.6) * 1.6})`; ctx.beginPath(); ctx.ellipse(x, wave(x) - 1, 4, 1.4, 0, 0, TAU); ctx.fill(); }
    if (hash(Math.floor(wx / 14) + Math.floor(t * 3)) > 0.93) { ctx.fillStyle = "rgba(255,255,235,.9)"; ctx.fillRect(x, wave(x) + 3, 3, 1.5); }
  }
  // lục bình + lá dừa khô trôi theo dòng
  for (let i = 0; i < 9; i++) {
    const wx = wmod(hash(i + 70) * X + t * (0.3 + hash(i + 71) * 0.25), X + 10) - 5, x = sx(wx);
    if (x < -40 || x > w + 40) continue;
    lucBinh(x, wave(x) - 1, s * (0.55 + hash(i + 72) * 0.35), t, i);
  }
  for (let i = 0; i < 4; i++) {
    const wx = wmod(hash(i + 90) * X + t * 0.45, X + 10) - 5, x = sx(wx); if (x < -30 || x > w + 30) continue;
    ctx.save(); ctx.translate(x, wave(x)); ctx.rotate(Math.sin(t + i) * 0.1);
    ctx.fillStyle = "#9a7a3c"; ctx.beginPath(); ctx.ellipse(0, 0, s * 1.1, s * 0.12, 0, 0, TAU); ctx.fill();
    ctx.restore();
  }
}

function drawMinimap(w, X, D, s) {                 // bản đồ thu nhỏ: cả khúc sông, khung nhìn hiện tại
  const x0 = 424, y0 = 18, mw = Math.min(210, w - x0 - 244 - 12), mh = 40;
  if (mw < 90) return;
  panel(x0, y0, mw, mh + 30, { r: 10 });
  const mx = (x) => x0 + 8 + (x / X) * (mw - 16), my = (d) => y0 + 8 + (d / D) * mh;
  const wg = ctx.createLinearGradient(0, my(0), 0, my(D)); wg.addColorStop(0, "#b69a64"); wg.addColorStop(1, "#3a2e1c");
  ctx.fillStyle = wg; ctx.fillRect(mx(0), my(0), mx(X) - mx(0), my(D) - my(0));
  (snap.fish || []).forEach((f) => { ctx.fillStyle = kc(f.kind); ctx.fillRect(mx(f.pos[0]) - 1, my(f.pos[1]) - 1, 2.5, 2.5); });
  (snap.monsters || []).forEach((m) => { ctx.fillStyle = "#c08bff"; ctx.beginPath(); ctx.arc(mx(m.pos[0]), my(m.pos[1]), 3, 0, TAU); ctx.fill(); });
  const dp = (snap.meta && snap.meta.dock_pos) || [2, 0];
  ctx.fillStyle = C.gold; ctx.fillRect(mx(dp[0]) - 2, my(0) - 4, 4, 5);
  const p = snap.player;
  if (p && p.pos) { ctx.fillStyle = "#ff8a3d"; ctx.beginPath(); ctx.arc(mx(p.pos[0]), my(p.pos[1]), 3.5, 0, TAU); ctx.fill(); ctx.strokeStyle = "#fff"; ctx.stroke(); }
  if (camX !== null && X * s > w) {                // khung nhìn: từ camX/s tới (camX+w)/s mét
    const a = mx(Math.max(0, camX / s)), b2 = mx(Math.min(X, (camX + w) / s));
    ctx.strokeStyle = "rgba(255,255,255,.8)"; ctx.lineWidth = 1.5; ctx.strokeRect(a, my(0) - 2, b2 - a, my(D) - my(0) + 4); ctx.lineWidth = 1;
  }
  text("Bản đồ sông", x0 + mw / 2, y0 + mh + 25, { size: 10, align: "center", color: C.muted, weight: 600 });
}

// ----- cảnh GATHER: nhìn ngang, x sang phải, d xuống -----
function drawGather(w, h, t, dt) {
  const meta = snap.meta || {};
  const b = meta.bounds || { x: [0, 100], d: [0, 30] };
  const X = b.x[1], D = b.d[1], SKY = 8;
  // Tỉ lệ theo CHIỀU CAO: sông kéo xuống gần đáy màn hình. Sông rộng hơn màn hình -> camera bám người chơi.
  const top = 84, bottom = 14;
  const s = Math.max(1, (h - top - bottom) / (D + SKY));
  const p = snap.player;
  const worldW = X * s;
  const wantCam = worldW <= w ? -(w - worldW) / 2 : Math.max(0, Math.min(worldW - w, (p && p.pos ? p.pos[0] * s : 0) - w / 2));
  camX = camX === null || Math.abs(camX - wantCam) > w ? wantCam : camX + (wantCam - camX) * Math.min(1, dt * 6);
  const ox = -camX, oy = top + SKY * s;
  const sx = (x) => ox + x * s, sy = (d) => oy + d * s;
  const bed = sy(D);
  const u = Math.max(s, 16);   // cỡ hình tối thiểu (chỉ đổi hình, không đổi vị trí)
  const underwater = p ? (p.at_surface === undefined ? p.pos[1] > 0.5 : !p.at_surface) : false;

  drawGatherBackdrop(w, h, t, { s, oy, bed, sx, sy, X, D, camX });

  // vạch độ sâu: nhãn dính mép trái màn hình (camera cuộn ngang)
  for (let d = 5; d <= D; d += 5) {
    ctx.strokeStyle = "rgba(255,240,200,.07)"; ctx.setLineDash([2, 10]); ctx.beginPath(); ctx.moveTo(0, sy(d)); ctx.lineTo(w, sy(d)); ctx.stroke(); ctx.setLineDash([]);
    text(d + " m", 8, sy(d) - 4, { size: 10, color: "rgba(255,240,210,.45)", weight: 700 });
  }
  // ngoài biên (x < 0, x > X): bờ đất tối
  ctx.fillStyle = "rgba(30,22,12,.55)";
  if (sx(0) > 0) ctx.fillRect(0, oy, sx(0), bed - oy);
  if (sx(X) < w) ctx.fillRect(sx(X), oy, w - sx(X), bed - oy);

  drawSurface(w, t, { s, oy, sx, X });

  // bến + ghe
  const dp = meta.dock_pos || [2, 0], dr = meta.dock_radius || 3;
  const bob = Math.sin(t * 1.6) * 0.08;
  ctx.fillStyle = "#5c3b22";
  [-1.6, 1.6].forEach((o) => ctx.fillRect(sx(dp[0] + o) - 3, sy(-0.7), 6, sy(2.2) - sy(-0.7)));
  ctx.fillStyle = "#8d6440"; rr(sx(dp[0] - 2.2), sy(-0.85), 4.4 * s, 0.32 * s, 3); ctx.fill();
  const bx0 = sx(dp[0] + 0.2), by0 = sy(-0.05 + bob);
  ctx.fillStyle = "#6e3f22"; ctx.beginPath();
  ctx.moveTo(bx0 - 2.4 * s, by0 - 0.55 * s); ctx.quadraticCurveTo(bx0 - 1.8 * s, by0 + 0.45 * s, bx0, by0 + 0.45 * s);
  ctx.quadraticCurveTo(bx0 + 1.8 * s, by0 + 0.45 * s, bx0 + 2.4 * s, by0 - 0.55 * s); ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#b8442f"; ctx.fillRect(bx0 - 2.1 * s, by0 - 0.45 * s, 4.2 * s, 0.13 * s);
  ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.ellipse(bx0 + 1.75 * s, by0 - 0.15 * s, 0.17 * s, 0.1 * s, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = "#111"; ctx.beginPath(); ctx.arc(bx0 + 1.78 * s, by0 - 0.15 * s, 0.06 * s, 0, TAU); ctx.fill();
  ctx.fillStyle = "#c59a5c"; ctx.beginPath(); ctx.ellipse(bx0 - 0.4 * s, by0 - 0.55 * s, 1.1 * s, 0.6 * s, 0, Math.PI, TAU); ctx.fill();
  ctx.strokeStyle = hexA(C.gold, 0.55); ctx.setLineDash([6, 5]); ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(sx(dp[0]), sy(dp[1]), dr * s, 0, TAU); ctx.stroke(); ctx.setLineDash([]); ctx.lineWidth = 1;
  pill("Bến", Math.max(6, sx(dp[0]) - 18), sy(-2.1), "#6b3f1d", { size: 11, fill: "rgba(255,240,215,.9)", textColor: "#5a3418" });

  // nút hái
  const regrowMax = (meta.regrow_s || 20) * 60;
  (snap.nodes || []).forEach((nd) => {
    const ready = nd.ready !== false, x = sx(nd.pos[0]), y = sy(nd.pos[1]);
    const sway = Math.sin(t * 1.5 + nd.pos[0]) * 0.05 * s;
    ctx.fillStyle = ready ? "#4f9a4a" : "rgba(79,154,74,.55)";
    ctx.beginPath(); ctx.ellipse(x, y + 0.05 * u, 0.95 * u, 0.24 * u, 0, 0.25, TAU - 0.05); ctx.lineTo(x, y + 0.05 * u); ctx.closePath(); ctx.fill();
    ctx.globalAlpha = ready ? 1 : 0.35;
    if (nd.kind === "bong_sung") lotusFlower(x + sway, y - 0.25 * u, 0.6 * u);
    else if (nd.kind === "bong_dien_dien") dienDien(x + sway, y - 0.55 * u, 0.75 * u);
    else itemIcon(nd.kind, x, y - 0.4 * u, 1.1 * u);
    ctx.globalAlpha = 1;
    if (!ready && nd.regrow_ticks) {
      ring(x, y - 1.6 * u, 0.45 * u + 4, 1 - nd.regrow_ticks / regrowMax, "#b6df8a", 3);
      text(Math.ceil(nd.regrow_ticks / 60) + "s", x, y - 1.6 * u + 1, { size: 10, weight: 700, align: "center", base: "middle", color: "#1f3a1a" });
    }
    if (showLog) text(nd.id, x, y + 0.75 * s, { size: 10, align: "center", color: "rgba(255,255,255,.75)" });
  });

  // đàn cá
  (snap.fish || []).forEach((f, i) => {
    const ang = ((f.heading_deg || 0) * Math.PI) / 180;
    fishShape(sx(f.pos[0]), sy(f.pos[1]), 1.9 * u, kc(f.kind), ang, t + i * 0.7);
    if (showLog) text(f.id, sx(f.pos[0]), sy(f.pos[1]) - 0.7 * s, { size: 10, align: "center", color: "rgba(255,255,255,.8)" });
  });

  // thủy quái (Cá Sấu Năm Chèo): hướng mặt theo người chơi khi đuổi, theo waypoint khi tuần tra
  const mons = snap.monsters || [];
  const species = (meta.monsters && meta.monsters.species) || {};
  mons.forEach((m, i) => {
    if (!m.pos) return;
    let facing = 1;
    if (m.state === "chase" && p && p.pos) facing = p.pos[0] >= m.pos[0] ? 1 : -1;
    else if (m.state === "recoil" && m.recoil_dir) facing = -m.recoil_dir[0] || 1;
    else if (m.waypoints && m.target_idx !== undefined && m.waypoints[m.target_idx]) facing = m.waypoints[m.target_idx][0] >= m.pos[0] ? 1 : -1;
    const sp = species[m.kind] || {};
    if (sp.detect_radius && m.state !== "recoil") {          // vòng phát hiện mờ
      ctx.strokeStyle = m.state === "chase" ? "rgba(192,139,255,.45)" : "rgba(192,139,255,.18)";
      ctx.setLineDash([3, 7]); ctx.beginPath(); ctx.arc(sx(m.pos[0]), sy(m.pos[1]), sp.detect_radius * s, 0, TAU); ctx.stroke(); ctx.setLineDash([]);
    }
    crocodile(sx(m.pos[0]), sy(m.pos[1]), 3.2 * u, facing, m.state, t + i);
    if (showLog) text(m.id + " · " + (m.state || ""), sx(m.pos[0]), sy(m.pos[1]) - 0.9 * u, { size: 10, align: "center", color: "#e6d2ff" });
  });

  // bọt nước
  updateBubbles(p, underwater, dt, performance.now());
  ctx.strokeStyle = "rgba(220,250,255,.65)";
  bubbles.forEach((bb) => { ctx.beginPath(); ctx.arc(sx(bb.x), sy(bb.d), bb.r * u, 0, TAU); ctx.stroke(); });

  // người chơi (Út Sen)
  if (p && p.pos) {
    const px = sx(p.pos[0]), py = sy(p.pos[1]);
    if (meta.catch_radius && underwater) { ctx.strokeStyle = "rgba(255,255,255,.22)"; ctx.setLineDash([4, 6]); ctx.beginPath(); ctx.arc(px, py, meta.catch_radius * s, 0, TAU); ctx.stroke(); ctx.setLineDash([]); }
    if (meta.interact_radius && !underwater) { ctx.strokeStyle = hexA(C.gold, 0.45); ctx.setLineDash([4, 6]); ctx.beginPath(); ctx.arc(px, py, meta.interact_radius * s, 0, TAU); ctx.stroke(); ctx.setLineDash([]); }
    if (!(p.invuln_ticks > 0 && Math.floor((snap.tick || 0) / 5) % 2)) {
      const ang = ((p.heading_deg || 0) * Math.PI) / 180, L = Math.max(34, 2.4 * s);
      ctx.save(); ctx.translate(px, py); ctx.rotate(underwater ? ang : 0);
      if (underwater && Math.cos(ang) < 0) ctx.scale(1, -1);
      if (!underwater && Math.cos(ang) < 0) ctx.scale(-1, 1);
      const kick = Math.sin(t * 10) * 0.12 * L;
      ctx.strokeStyle = "#e0a878"; ctx.lineWidth = Math.max(2, 0.14 * s); ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(-0.25 * L, 0.05 * L); ctx.lineTo(-0.62 * L, 0.05 * L + kick); ctx.moveTo(-0.25 * L, 0.05 * L); ctx.lineTo(-0.6 * L, 0.12 * L - kick); ctx.stroke();
      ctx.lineCap = "butt"; ctx.lineWidth = 1;
      ctx.fillStyle = "#2f4f8f"; ctx.beginPath(); ctx.ellipse(-0.18 * L, 0.04 * L, 0.18 * L, 0.11 * L, 0, 0, TAU); ctx.fill();   // quần
      ctx.fillStyle = "#ff8a3d"; ctx.beginPath(); ctx.ellipse(0.06 * L, 0, 0.24 * L, 0.13 * L, 0, 0, TAU); ctx.fill();       // áo bà ba
      ctx.fillStyle = "#f2c79a"; ctx.beginPath(); ctx.arc(0.38 * L, -0.04 * L, 0.12 * L, 0, TAU); ctx.fill();               // mặt
      ctx.fillStyle = "#2a1a12"; ctx.beginPath(); ctx.arc(0.36 * L, -0.08 * L, 0.12 * L, Math.PI * 0.9, Math.PI * 2.05); ctx.fill(); // tóc
      if (!underwater) { ctx.fillStyle = "#ecd59a"; ctx.beginPath(); ctx.moveTo(0.14 * L, -0.12 * L); ctx.lineTo(0.37 * L, -0.42 * L); ctx.lineTo(0.62 * L, -0.12 * L); ctx.closePath(); ctx.fill(); }
      ctx.restore();
    }
    if (p.catch_cd_ticks > 0) ring(px, py, 1.05 * s, p.catch_cd_ticks / ((meta.catch_cooldown_s || 0.5) * 60), "rgba(255,255,255,.75)", 2.5);
    // gợi ý hành động khi tới gần (chỉ đọc vị trí, không đoán luật)
    let hint = null;
    const near = (pos, r) => pos && r && Math.hypot(pos[0] - p.pos[0], pos[1] - p.pos[1]) <= r;
    if (!snap.finished) {
      if (!underwater && near(dp, dr)) hint = ["E · cập bến giao hàng", C.gold];
      else if (!underwater) {
        const nd = (snap.nodes || []).find((n) => n.ready !== false && near(n.pos, meta.interact_radius));
        if (nd) hint = ["E · hái " + (KIND_NAME[nd.kind] || nd.kind), C.ok];
      } else {
        const f = (snap.fish || []).find((f) => near(f.pos, meta.catch_radius));
        if (f) hint = p.catch_cd_ticks > 0 ? ["Đang hồi bắt…", C.muted] : ["Space · bắt " + (KIND_NAME[f.kind] || "cá"), "#7fe0cf"];
      }
    }
    if (hint) {
      const lw = measure(hint[0], 13, "b", 600) + 16, hxp = Math.max(6, Math.min(w - lw - 6, px - lw / 2));
      pill(hint[0], hxp, py - Math.max(34, 1.9 * s), hint[1], { size: 13, fill: "rgba(20,14,8,.85)" });
    }
  }

  // ---- HUD trên trái: giờ · oxy · máu ----
  const pw = 400;
  panel(16, 14, pw, 76);
  text("CÒN LẠI", 32, 36, { size: 10, weight: 700, color: C.dim });
  const lowTime = (snap.time_left_ticks || 0) <= 1800;          // ≤ 30 s: đổi màu + nhấp nháy
  ctx.globalAlpha = lowTime ? 0.7 + 0.3 * Math.sin(t * 6) : 1;
  text(fmtTime(snap.time_left_ticks), 30, 72, { size: 32, kind: "d", weight: 800, color: lowTime ? C.danger : C.cream });
  ctx.globalAlpha = 1;
  ctx.fillStyle = "rgba(255,255,255,.12)"; ctx.fillRect(122, 26, 1, 52);
  if (p && p.oxygen_ticks !== undefined && p.oxygen_max_ticks) {
    const fr = p.oxygen_ticks / p.oxygen_max_ticks, low = fr < 0.25;
    const pulse = low ? 0.65 + 0.35 * Math.sin(t * 10) : 1;
    bubbleIcon(146, 38, 7);
    ctx.globalAlpha = pulse;
    bar(164, 30, pw - 164, 16, fr, low ? C.danger : C.oxy, { label: "Oxy " + Math.ceil(p.oxygen_ticks / 60) + "s" });
    ctx.globalAlpha = 1;
  }
  let hx = 146;
  if (p && p.hp !== undefined && p.hp_max) {
    for (let i = 0; i < p.hp_max; i++) heart(146 + i * 22, 66, 8, i < p.hp);
    hx = 146 + p.hp_max * 22;
  }
  if (p && p.at_surface !== undefined) {
    const d = p.pos ? p.pos[1] : 0;
    const pw2 = pill(p.at_surface ? "Mặt nước · hồi oxy" : "Sâu " + d.toFixed(1) + " m · " + DEPTH_ZONE(d), hx + 4, 66, p.at_surface ? "#9be3f7" : C.oxy);
    hx += pw2 + 8;
  }
  if (p && p.catch_cd_ticks !== undefined && hx < pw - 40) {       // hồi bắt cá
    pill(p.catch_cd_ticks > 0 ? "Bắt · " + (p.catch_cd_ticks / 60).toFixed(1) + "s" : "Bắt ✓", hx, 66, p.catch_cd_ticks > 0 ? C.muted : "#7fe0cf");
  }

  // ---- danh sách cần lấy (trên phải): đã lấy / cần theo day_plan ----
  drawNeedList(w, t);
  drawMinimap(w, X, D, s);

  // ---- cảnh báo: thủy quái (viền tím) / hết hơi (viền đỏ) ----
  let toastY = 104;
  const live = p && !snap.finished;
  const monsterNear = live && mons.some((m) => {
    if (!m.pos || m.state === "recoil") return false;
    const r = (species[m.kind] || {}).detect_radius || 10;
    return m.state === "chase" || Math.hypot(m.pos[0] - p.pos[0], m.pos[1] - p.pos[1]) <= r;
  });
  if (monsterNear) {
    const pulse = 0.35 + 0.2 * Math.sin(t * 8);
    ctx.strokeStyle = `rgba(170,90,255,${pulse + 0.2})`; ctx.lineWidth = 10; ctx.strokeRect(5, 5, w - 10, h - 10);
    const vg = ctx.createRadialGradient(w / 2, h / 2, Math.min(w, h) * 0.35, w / 2, h / 2, Math.max(w, h) * 0.75);
    vg.addColorStop(0, "rgba(140,60,255,0)"); vg.addColorStop(1, `rgba(140,60,255,${pulse * 0.6})`);
    ctx.fillStyle = vg; ctx.fillRect(0, 0, w, h); ctx.lineWidth = 1;
  }
  if (live && p.oxygen_ticks === 0 && p.at_surface !== true) {
    const pulse = 0.28 + 0.18 * Math.sin(t * 9);
    const vg = ctx.createRadialGradient(w / 2, h / 2, Math.min(w, h) * 0.3, w / 2, h / 2, Math.max(w, h) * 0.75);
    vg.addColorStop(0, "rgba(255,30,30,0)"); vg.addColorStop(1, `rgba(255,30,30,${pulse})`);
    ctx.fillStyle = vg; ctx.fillRect(0, 0, w, h);
    const iv = meta.choke_interval_ticks;
    const sub = iv && p.zero_oxy_ticks !== undefined ? "Mất 1 ♥ sau " + ((iv - (p.zero_oxy_ticks % iv)) / 60).toFixed(1) + " giây — bơi lên ngay (W)" : "Bơi lên mặt nước ngay (W)";
    banner(w, toastY, "Hết hơi!", sub, C.danger);
    toastY += 68;
  } else if (live && p.oxygen_max_ticks && p.oxygen_ticks < p.oxygen_max_ticks * 0.25 && p.at_surface === false) {
    banner(w, toastY, "Oxy sắp hết — quay lên!", null, C.warn);
    toastY += 50;
  }
  if (monsterNear) { banner(w, toastY, "Thủy quái!", "Cá Sấu Năm Chèo ở gần — bơi lên vùng nông (< 10 m) để cắt đuôi", "#c08bff"); toastY += 68; }
  drawToasts(w, toastY);

  // ---- giỏ (dưới trái) ----
  if (snap.hold && snap.hold_capacity) {
    const hold = toItems(snap.hold), cap = snap.hold_capacity, full = hold.length >= cap;
    const hasFresh = hold.some((it) => it.fresh != null);
    const sz = Math.max(18, Math.min(32, (w - 200) / cap - 5)), gap = 5;
    const bw = 104 + cap * (sz + gap), bh = sz + (hasFresh ? 40 : 30), by = h - bh - 46;
    // Út Sen bơi ra sau panel giỏ -> panel mờ để vẫn thấy người chơi và quái
    const behind = p && p.pos && sx(p.pos[0]) > 6 && sx(p.pos[0]) < 26 + bw && sy(p.pos[1]) > by - 24;
    const ga = behind ? 0.32 : 1;
    ctx.globalAlpha = ga;
    panel(16, by, bw, bh, { edge: full ? hexA(C.warn, 0.8) : C.edge, lw: full ? 2 : 1.5 });
    text("GIỎ", 30, by + 22, { size: 10, weight: 700, color: C.dim });
    text(hold.length + "/" + cap, 30, by + bh - 12, { size: 22, kind: "d", weight: 800, color: full ? C.warn : C.cream });
    for (let i = 0; i < cap; i++) {
      const x0 = 96 + i * (sz + gap), y0 = by + 15, it = hold[i];
      const bad = it && isSpoiled(it);
      rr(x0, y0, sz, sz, 7); ctx.fillStyle = bad ? "rgba(255,90,79,.18)" : "rgba(255,255,255,.07)"; ctx.fill();
      ctx.strokeStyle = bad ? hexA(C.danger, 0.8) : i === hold.length - 1 ? hexA(C.gold, 0.8) : "rgba(255,255,255,.14)"; ctx.stroke();
      if (!it) continue;
      ctx.globalAlpha = ga * (bad ? 0.45 : 1);
      itemIcon(it.kind, x0 + sz / 2, y0 + sz / 2, sz * 0.8);
      ctx.globalAlpha = ga;
      if (bad) {                                   // dấu ươn: gạch chéo đỏ
        ctx.strokeStyle = C.danger; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(x0 + 4, y0 + 4); ctx.lineTo(x0 + sz - 4, y0 + sz - 4); ctx.stroke(); ctx.lineWidth = 1;
      }
      freshBar(x0 + 2, y0 + sz + 4, sz - 4, it.fresh);
    }
    const nBad = hold.filter(isSpoiled).length;
    if (full) pill("ĐẦY · về bến giao hàng", 16 + bw + 10, by + bh / 2, C.warn);
    else if (nBad) pill(nBad + " món đã ươn (<" + spoilBelow() + "%) — không nấu được", 16 + bw + 10, by + bh / 2, C.danger);
    else if (hasFresh) {                           // gợi ý: hàng tươi nhất/thấp nhất trong giỏ
      const lo = Math.min(...hold.map((x) => x.fresh ?? 100));
      pill("Tươi thấp nhất " + fmtFresh(lo) + " · hao 0.5%/s", 16 + bw + 10, by + bh / 2, freshColor(lo));
    }
    ctx.globalAlpha = 1;
  }
  keycaps(w, h, [["WASD", "bơi"], ["E", "hái · bến"], ["Space", "bắt cá"], ["Esc", "dừng"]]);
}

// Kế hoạch của Ngày: mode day có snap.day_plan; chạy gather/quan độc lập thì lấy Ngày 1 trong cfg làm mẫu.
function currentPlan() {
  if (snap.day_plan) return { plan: snap.day_plan, sample: false };
  const dp = snap.cfg && snap.cfg.day_plan;
  return dp && dp[0] ? { plan: dp[0], sample: true } : null;
}
function drawNeedList(w, t) {
  const cp = currentPlan();
  if (!cp) return;
  const need = cp.plan.ingredients || {};
  const have = {}, bad = {};                                            // chỉ hàng chưa ươn mới tính "đã lấy"
  toItems(snap.hold).forEach((it) => { if (isSpoiled(it)) bad[it.kind] = (bad[it.kind] || 0) + 1; else have[it.kind] = (have[it.kind] || 0) + 1; });
  Object.keys(bad).forEach((k) => { if (!(k in have)) have[k] = 0; });
  const extra = Object.keys(have).filter((k) => !(k in need));       // giỏ phân loại: hàng ngoài kế hoạch
  const rows = Object.keys(need).concat(extra);
  const rh = 24, pw = 228, ph = 40 + rows.length * rh, x0 = w - pw - 16, y0 = 14;
  panel(x0, y0, pw, ph);
  text(cp.sample ? "Cần lấy · Ngày 1 (mẫu)" : "Má Tư dặn · Ngày " + (snap.day ?? 1), x0 + 14, y0 + 25, { size: 14, kind: "d", weight: 800, color: C.gold });
  rows.forEach((k, i) => {
    const y = y0 + 44 + i * rh, n = need[k] || 0, hv = have[k] || 0, done = n > 0 && hv >= n;
    itemIcon(k, x0 + 24, y, 18);
    text(KIND_NAME[k] || k, x0 + 42, y + 5, { size: 13, weight: 600, color: n ? C.cream : C.muted });
    if (bad[k]) pill(bad[k] + " ươn", x0 + 42 + measure(KIND_NAME[k] || k, 13, "b", 600) + 6, y, C.danger, { size: 12, pad: 5 });
    const label = n ? hv + "/" + n : "×" + hv;
    text(label, x0 + pw - 34, y + 5, { size: 14, kind: "d", weight: 800, align: "right", color: done ? C.ok : n ? C.cream : C.muted });
    if (done) text("✓", x0 + pw - 16, y + 5, { size: 14, weight: 800, align: "center", color: C.ok });
  });
}

// =====================================================================================
// ----- cảnh QUÁN: nhìn từ trên xuống, x sang phải, z lên (bắc) -----
// Bố cục: HUD + thẻ đơn ở trên · sàn nhà bè trải hết bề ngang (bàn giãn rộng) · dải kho ở cuối trang.
// Vị trí bếp/bàn/người vẫn lấy từ snapshot; chỉ tỉ lệ hiển thị theo trục x và z khác nhau.
let qWalk = { x: null, y: null, phase: 0, ang: -Math.PI / 2, moving: 0 };
const idNum = (id) => parseInt(String(id || "").replace(/\D/g, ""), 10) || 0;
const SHIRTS = ["#3f7cc7", "#c7543f", "#4f9a5a", "#8a5cc2", "#d19a2a", "#2f8f8f"];
const CARD_STATUS = { reserved: "Đã giữ hàng", assigned: "Đang nấu", unfulfillable: "Thiếu hàng", served: "Đã dọn món" };

function personTop(x, y, r, o = {}) {              // người nhìn từ trên: vai áo, tay, nón lá hoặc tóc
  ctx.save(); ctx.translate(x, y); ctx.rotate(o.ang || 0);
  const step = o.walk || 0;                        // pha bước chân (rad); 0 = đứng
  if (o.legs !== false) {                          // chân (ló ra trước/sau khi bước)
    ctx.fillStyle = "#2b3a55";
    [-1, 1].forEach((side) => { const f = Math.sin(step) * side * r * 0.55; ctx.beginPath(); ctx.ellipse(f, side * r * 0.32, r * 0.32, r * 0.18, 0, 0, TAU); ctx.fill(); });
  }
  ctx.fillStyle = o.shirt || "#ff8a3d";            // thân áo bà ba
  ctx.beginPath(); ctx.ellipse(0, 0, r * 0.55, r * 0.85, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = shade(o.shirt || "#ff8a3d", -0.2);
  [-1, 1].forEach((side) => {                      // tay vung ngược chân
    const f = o.arms != null ? o.arms : -Math.sin(step) * side * r * 0.45;
    ctx.beginPath(); ctx.arc(f + r * 0.15, side * r * 0.88, r * 0.22, 0, TAU); ctx.fill();
  });
  if (o.hat !== false) nonLa(0, 0, r * 0.78);
  else {                                           // tóc: búi đen có ánh bóng, tai lộ hai bên
    ctx.fillStyle = "#e2b48a"; [-1, 1].forEach((sd) => { ctx.beginPath(); ctx.arc(r * 0.05, sd * r * 0.45, r * 0.12, 0, TAU); ctx.fill(); });
    const hg = ctx.createRadialGradient(-r * 0.15, -r * 0.15, 1, 0, 0, r * 0.52);
    hg.addColorStop(0, "#5a4636"); hg.addColorStop(1, "#1e140e");
    ctx.fillStyle = hg; ctx.beginPath(); ctx.arc(0, 0, r * 0.5, 0, TAU); ctx.fill();
    ctx.fillStyle = "#1a110b"; ctx.beginPath(); ctx.arc(-r * 0.38, 0, r * 0.2, 0, TAU); ctx.fill();
  }
  ctx.restore();
}
function bowl(x, y, r, dishId, steam, t) {         // tô/đĩa món ăn đặt trên bàn
  ctx.fillStyle = "#f4efe4"; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
  ctx.strokeStyle = "#2f6b8f"; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(x, y, r * 0.82, 0, TAU); ctx.stroke(); ctx.lineWidth = 1;
  const main = DISH_MAIN[dishId];
  ctx.fillStyle = dishId && dishId.startsWith("lau") ? "#c8572e" : dishId === "canh_chua_ca_loc" ? "#e0a13a" : "#d9c08a";
  ctx.beginPath(); ctx.arc(x, y, r * 0.68, 0, TAU); ctx.fill();
  if (main) itemIcon(main, x, y, r * 1.1);
  if (steam) {
    ctx.strokeStyle = "rgba(255,255,255,.4)"; ctx.lineWidth = 1.5;
    for (let k = -1; k <= 1; k++) { const ph = (t * 0.7 + k * 0.3) % 1; ctx.globalAlpha = 1 - ph; ctx.beginPath(); ctx.moveTo(x + k * r * 0.4, y - r * 0.6 - ph * r); ctx.quadraticCurveTo(x + k * r * 0.4 + 3 * Math.sin(t * 3 + k), y - r - ph * r, x + k * r * 0.4, y - r * 1.4 - ph * r); ctx.stroke(); }
    ctx.globalAlpha = 1; ctx.lineWidth = 1;
  }
}
function basket(x, y, r, kind, n) {                // rổ tre đựng nguyên liệu (trang trí theo kho)
  ctx.fillStyle = "#b8864b"; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
  ctx.strokeStyle = "#7d5527"; ctx.lineWidth = 1.2;
  for (let k = 1; k <= 2; k++) { ctx.beginPath(); ctx.arc(x, y, (r * k) / 2.6, 0, TAU); ctx.stroke(); }
  ctx.lineWidth = 1;
  for (let i = 0; i < Math.min(3, n); i++) itemIcon(kind, x + (i - 1) * r * 0.42, y + (i % 2 ? -1 : 1) * r * 0.2, r * 0.9);
}

function drawQuan(w, h, t) {
  const meta = snap.meta || {};
  const b = meta.bounds || { x: [0, 16], z: [0, 10] };
  const X = b.x[1], Z = b.z[1];
  const cs = snap.customers || [];
  const tables = snap.tables || [];
  const topH = 82, stripH = 44, stripY = h - 40 - stripH;
  const dx = 22, dy = topH + 10, dw = w - 44, dh = stripY - 10 - dy;
  const kx = dw / X, kz = dh / Z, s = Math.max(1, Math.min(kx, kz));
  const sx = (x) => dx + x * kx, sy = (z) => dy + (Z - z) * kz;

  // ---- sông đêm quanh nhà bè: gợn sóng + bóng đèn lồng ----
  const night = ctx.createLinearGradient(0, 0, 0, h);
  night.addColorStop(0, "#13243a"); night.addColorStop(1, "#060d16");
  ctx.fillStyle = night; ctx.fillRect(0, 0, w, h);
  for (let i = 0; i < 40; i++) {
    const y = hash(i) * h + Math.sin(t * 0.8 + i) * 3, x = wmod(hash(i + 5) * w + t * (6 + hash(i + 6) * 10), w + 120) - 60, len = 24 + hash(i + 7) * 60;
    ctx.strokeStyle = i % 3 ? "rgba(255,190,110,.08)" : "rgba(160,200,255,.07)"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(x + len / 2, y + Math.sin(t * 2 + i) * 2, x + len, y); ctx.stroke();
  }
  ctx.lineWidth = 1;

  // ---- sàn nhà bè: ván gỗ, lan can, cột ----
  ctx.shadowColor = "rgba(0,0,0,.6)"; ctx.shadowBlur = 28; ctx.shadowOffsetY = 10;
  rr(dx - 12, dy - 12, dw + 24, dh + 24, 20); ctx.fillStyle = "#3e2412"; ctx.fill();
  ctx.shadowColor = "transparent"; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
  ctx.save(); rr(dx, dy, dw, dh, 14); ctx.clip();
  const plank = Math.max(14, 0.75 * kz);
  for (let i = 0; i * plank < dh; i++) {
    ctx.fillStyle = i % 2 ? "#a7703f" : "#9a663a"; ctx.fillRect(dx, dy + i * plank, dw, plank);
    ctx.fillStyle = "rgba(0,0,0,.25)"; ctx.fillRect(dx, dy + i * plank, dw, 1.5);
    for (let k = 0; k < 4; k++) ctx.fillRect(dx + wmod(hash(i * 4 + k) * dw, dw), dy + i * plank, 1.5, plank);
    ctx.fillStyle = "rgba(255,230,190,.05)"; ctx.fillRect(dx, dy + i * plank + 2, dw, 2);
  }
  const warm = ctx.createRadialGradient(dx + dw * 0.4, dy + dh * 0.3, 10, dx + dw / 2, dy + dh / 2, Math.max(dw, dh) * 0.75);
  warm.addColorStop(0, "rgba(255,200,120,.16)"); warm.addColorStop(1, "rgba(0,0,0,.32)");
  ctx.fillStyle = warm; ctx.fillRect(dx, dy, dw, dh);
  ctx.restore();
  ctx.strokeStyle = "#6b4122"; ctx.lineWidth = 4; rr(dx - 6, dy - 6, dw + 12, dh + 12, 17); ctx.stroke(); ctx.lineWidth = 1;   // lan can
  [[dx - 6, dy - 6], [dx + dw + 6, dy - 6], [dx - 6, dy + dh + 6], [dx + dw + 6, dy + dh + 6]].forEach(([x, y]) => { ctx.fillStyle = "#4a2c17"; ctx.beginPath(); ctx.arc(x, y, 7, 0, TAU); ctx.fill(); });

  // dây đèn lồng đung đưa dọc mép trên
  const lanterns = Math.max(5, Math.round(dw / 70));
  ctx.strokeStyle = "rgba(40,25,15,.9)"; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(dx, dy - 2);
  for (let i = 1; i <= lanterns; i++) ctx.quadraticCurveTo(dx + (dw * (i - 0.5)) / lanterns, dy + 14, dx + (dw * i) / lanterns, dy - 2);
  ctx.stroke(); ctx.lineWidth = 1;
  for (let i = 0; i < lanterns; i++) {
    const sway = Math.sin(t * 1.4 + i) * 2, lx = dx + (dw * (i + 0.5)) / lanterns + sway, ly = dy + 11, col = i % 2 ? "#f0b43a" : "#d8392b";
    const glow = ctx.createRadialGradient(lx, ly, 2, lx, ly, 50); glow.addColorStop(0, hexA(col, 0.42)); glow.addColorStop(1, hexA(col, 0));
    ctx.fillStyle = glow; ctx.fillRect(lx - 50, ly - 50, 100, 100);
    ctx.fillStyle = col; ctx.beginPath(); ctx.ellipse(lx, ly, 7, 9, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = "#3a2410"; ctx.fillRect(lx - 4, ly - 11, 8, 3); ctx.fillRect(lx - 4, ly + 8, 8, 3);
  }
  // biển quán + chậu cây (trang trí, đặt ở góc không có bếp/bàn)
  const sgx = sx(X - 1.6), sgy = sy(Z - 0.9);
  ctx.fillStyle = "#5a3418"; rr(sgx - 62, sgy - 13, 124, 26, 6); ctx.fill();
  ctx.strokeStyle = C.gold; ctx.lineWidth = 1.5; rr(sgx - 62, sgy - 13, 124, 26, 6); ctx.stroke(); ctx.lineWidth = 1;
  text("QUÁN MÁ TƯ", sgx, sgy + 1, { size: 13, kind: "d", weight: 800, align: "center", base: "middle", color: C.gold });
  [[0.6, 0.6], [X - 0.6, 0.6]].forEach(([x, z], i) => {
    const px = sx(x), py = sy(z), r = s * 0.42;
    ctx.fillStyle = "#8a4a2a"; ctx.beginPath(); ctx.arc(px, py, r, 0, TAU); ctx.fill();
    ctx.fillStyle = "#4f8a3a";
    for (let k = 0; k < 6; k++) { const a = (k / 6) * TAU + Math.sin(t + i) * 0.1; ctx.beginPath(); ctx.ellipse(px + Math.cos(a) * r * 0.6, py + Math.sin(a) * r * 0.6, r * 0.55, r * 0.22, a, 0, TAU); ctx.fill(); }
  });
  // rổ nguyên liệu cạnh bếp: hiện các loại đang có trong kho
  const groups = groupStock(snap.stock, cs), kinds = Object.keys(groups).sort();
  kinds.slice(0, 4).forEach((k, i) => basket(sx(0.75), sy(Z - 3.2 - i * 1.25), s * 0.42, k, groups[k].total - groups[k].spoiled));

  // ---- bếp cà ràng ----
  const menuCfg = (snap.cfg && snap.cfg.menu) || {};
  (snap.stoves || []).forEach((st, si) => {
    const x = sx(st.pos[0]), y = sy(st.pos[1]), r = 0.8 * s;
    if (st.state === "cooking") {
      const fg = ctx.createRadialGradient(x, y, 2, x, y, r * 2.4);
      fg.addColorStop(0, `rgba(255,140,40,${0.55 + 0.15 * Math.sin(t * 12)})`); fg.addColorStop(1, "rgba(255,120,30,0)");
      ctx.fillStyle = fg; ctx.fillRect(x - r * 2.4, y - r * 2.4, r * 4.8, r * 4.8);
    } else if (st.state === "ready") {
      const gg = ctx.createRadialGradient(x, y, 2, x, y, r * 2.2);
      gg.addColorStop(0, `rgba(140,230,120,${0.45 + 0.2 * Math.sin(t * 5)})`); gg.addColorStop(1, "rgba(140,230,120,0)");
      ctx.fillStyle = gg; ctx.fillRect(x - r * 2.2, y - r * 2.2, r * 4.4, r * 4.4);
    }
    rr(x - r, y - r, 2 * r, 2 * r, r * 0.45); ctx.fillStyle = "#7a3a22"; ctx.fill(); ctx.strokeStyle = "#4b2213"; ctx.lineWidth = 2; ctx.stroke(); ctx.lineWidth = 1;
    if (st.state === "cooking") {                  // than hồng lập lòe
      for (let k = 0; k < 5; k++) { ctx.fillStyle = `rgba(255,${120 + 60 * hash(k + Math.floor(t * 8))},40,.9)`; ctx.beginPath(); ctx.arc(x + (hash(k) - 0.5) * r, y + r * 0.6, r * 0.12, 0, TAU); ctx.fill(); }
    }
    ctx.fillStyle = "#2e2e33"; ctx.beginPath(); ctx.arc(x, y - r * 0.05, r * 0.62, 0, TAU); ctx.fill();
    ctx.fillStyle = "#4a4a52"; ctx.beginPath(); ctx.arc(x - r * 0.15, y - r * 0.2, r * 0.42, 0, TAU); ctx.fill();
    if (st.state === "cooking" || st.state === "ready") {
      ctx.strokeStyle = "rgba(255,255,255,.45)"; ctx.lineWidth = 2;
      for (let k = -1; k <= 1; k++) {
        const ph = (t * 0.8 + k * 0.33) % 1, yy = y - r * 0.6 - ph * r * 1.6;
        ctx.globalAlpha = 1 - ph; ctx.beginPath(); ctx.moveTo(x + k * r * 0.35, yy); ctx.quadraticCurveTo(x + k * r * 0.35 + 5 * Math.sin(t * 3 + k), yy - 8, x + k * r * 0.35, yy - 16); ctx.stroke();
      }
      ctx.globalAlpha = 1; ctx.lineWidth = 1;
    }
    const did = st.dish && (st.dish.dish_id || st.dish);
    if (st.state === "cooking" && menuCfg[did] && st.cook_ticks_left !== undefined) ring(x, y, r + 7, 1 - st.cook_ticks_left / (menuCfg[did].cook_s * 60), C.warn, 4);
    else if (st.state === "ready") ring(x, y, r + 7, 1, C.ok, 4);
    // nhãn ngắn ở BÊN PHẢI bếp (không đè lên bàn phía dưới)
    const label = st.state === "cooking" && st.cook_ticks_left ? Math.ceil(st.cook_ticks_left / 60) + "s" : ({ idle: "Rảnh", ready: "Chín · E", burnt: "Cháy" }[st.state] || st.state || "");
    const col = st.state === "ready" ? C.ok : st.state === "cooking" ? C.warn : C.muted;
    const lx = x + r + 12;
    if (label) pill(label, lx, y - (did ? 9 : 0), col, { fill: "rgba(30,20,12,.88)", size: 12 });
    if (did) pill(DISH_SHORT[did] || dn(did), lx, y + 12, C.cream, { fill: "rgba(30,20,12,.88)", size: 12 });
    if (showLog) text(st.id, x, y + 4, { size: 10, align: "center", color: "#fff" });
  });

  // ---- bàn + khách: KHÔNG có chữ trên bàn; khách mang huy hiệu icon món + vòng kiên nhẫn ----
  const patMax = (meta.patience_s || 60) * 60, eatMax = (meta.eat_s || 10) * 60;
  const byTable = {}; cs.forEach((c) => (byTable[c.table_id] = c));
  tables.forEach((tb) => {
    const x = sx(tb.pos[0]), y = sy(tb.pos[1]), r = 0.9 * s, c = byTable[tb.id];
    ctx.fillStyle = "rgba(0,0,0,.28)"; ctx.beginPath(); ctx.ellipse(x + 4, y + 6, r * 1.05, r * 0.95, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = "#4a2c17";                                  // ghế đẩu hai bên + ghế khách phía trên
    [[-1.45, 0.1], [1.45, 0.1], [0, -1.35]].forEach(([a, bq]) => { ctx.beginPath(); ctx.arc(x + a * r, y + bq * r, r * 0.33, 0, TAU); ctx.fill(); });
    const tg = ctx.createRadialGradient(x - r * 0.3, y - r * 0.3, 2, x, y, r);
    tg.addColorStop(0, "#8a5a32"); tg.addColorStop(1, "#5e3a1e");
    ctx.fillStyle = tg; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
    ctx.strokeStyle = "#a0703f"; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(x, y, r * 0.78, 0, TAU); ctx.stroke(); ctx.lineWidth = 1;
    ctx.fillStyle = "#c9a56b"; ctx.fillRect(x + r * 0.35, y - r * 0.15, r * 0.12, r * 0.5);   // ống đũa
    text(tb.id, x, y + r + 13, { size: 11, weight: 700, align: "center", color: "rgba(255,236,200,.75)" });   // tên bàn DƯỚI mép bàn
    if (!c) return;
    const hx = x, hy = y - r * 1.35, pr = s * 0.62;
    const eating = c.state === "eating";
    if (eating) bowl(x, y - r * 0.2, r * 0.42, c.dish_id, true, t);
    const bob = Math.sin(t * (eating ? 6 : 2) + idNum(c.id)) * (eating ? 1.2 : 0.8);
    personTop(hx, hy + bob, pr, { ang: Math.PI / 2, shirt: SHIRTS[idNum(c.id) % SHIRTS.length], legs: false, arms: eating ? Math.sin(t * 6) * pr * 0.4 : 0, hat: idNum(c.id) % 2 === 0 });
    if (eating) {                                               // đôi đũa đưa lên xuống
      ctx.strokeStyle = "#d8b87a"; ctx.lineWidth = 2;
      const k = Math.sin(t * 6) * 0.5 + 0.5;
      ctx.beginPath(); ctx.moveTo(hx + pr * 0.7, hy + pr * 0.6); ctx.lineTo(x + r * 0.1, y - r * (0.2 + 0.5 * k)); ctx.stroke(); ctx.lineWidth = 1;
      if (c.eat_ticks_left !== undefined) ring(hx, hy, pr + 6, 1 - c.eat_ticks_left / eatMax, C.ok, 3);
    } else {
      const fr = c.patience_ticks_left !== undefined ? c.patience_ticks_left / patMax : 1;
      ring(hx, hy, pr + 6, fr, fr < 0.25 ? C.danger : fr < 0.5 ? C.warn : C.ok, 3);
      if (fr < 0.25) { ctx.fillStyle = "#7fd3ff"; const dyp = (t * 1.5) % 1; ctx.globalAlpha = 1 - dyp; ctx.beginPath(); ctx.ellipse(hx + pr * 0.9, hy - pr + dyp * 8, 2.5, 4, 0, 0, TAU); ctx.fill(); ctx.globalAlpha = 1; }
      // huy hiệu món: tròn nhỏ góc trên-phải đầu khách, chỉ icon (không chữ)
      const bxp = hx + pr + 12, byp = hy - pr - 6, bad = c.order_status === "unfulfillable";
      ctx.fillStyle = bad ? "#5a1410" : "rgba(255,248,232,.95)"; ctx.beginPath(); ctx.arc(bxp, byp, 11, 0, TAU); ctx.fill();
      ctx.strokeStyle = bad ? C.danger : (ORDER_STATUS[c.order_status] || [0, C.gold])[1]; ctx.lineWidth = 2; ctx.stroke(); ctx.lineWidth = 1;
      if (bad) text("!", bxp, byp + 1, { size: 14, kind: "d", weight: 800, align: "center", base: "middle", color: "#ff9a8f" });
      else itemIcon(DISH_MAIN[c.dish_id], bxp, byp, 15);
    }
  });

  // ---- người chơi: Út Sen đi lại (bước chân, vung tay, quay theo hướng đi) ----
  const p = snap.player;
  if (p && p.pos) {
    const px = sx(p.pos[0]), py = sy(p.pos[1]);
    if (qWalk.x !== null) {
      const ddx = px - qWalk.x, ddy = py - qWalk.y, dist = Math.hypot(ddx, ddy);
      if (dist > 0.3 && dist < 60) {
        qWalk.phase += dist * 0.16; qWalk.moving = 1;
        const want = Math.atan2(ddy, ddx);
        let da = want - qWalk.ang; while (da > Math.PI) da -= TAU; while (da < -Math.PI) da += TAU;
        qWalk.ang += da * 0.3;
      } else qWalk.moving = Math.max(0, qWalk.moving - 0.08);
    }
    qWalk.x = px; qWalk.y = py;
    if (meta.interact_radius) { ctx.strokeStyle = hexA(C.gold, 0.45); ctx.setLineDash([5, 5]); ctx.beginPath(); ctx.ellipse(px, py, meta.interact_radius * kx, meta.interact_radius * kz, 0, 0, TAU); ctx.stroke(); ctx.setLineDash([]); }
    ctx.fillStyle = "rgba(0,0,0,.32)"; ctx.beginPath(); ctx.ellipse(px + 3, py + 6, 0.6 * s, 0.45 * s, 0, 0, TAU); ctx.fill();
    const bounce = qWalk.moving ? Math.abs(Math.sin(qWalk.phase)) * 1.5 : 0;
    personTop(px, py - bounce, 0.62 * s, { ang: qWalk.ang, walk: qWalk.moving ? qWalk.phase : 0, shirt: "#ff8a3d" });
    if (snap.hand) {                               // bưng mâm món ở phía trước mặt
      const hd = typeof snap.hand === "string" ? snap.hand : snap.hand.dish_id;
      const fx = px + Math.cos(qWalk.ang) * 0.75 * s, fy = py - bounce + Math.sin(qWalk.ang) * 0.75 * s;
      bowl(fx, fy, 0.34 * s, hd, true, t);
    }
  }

  // đom đóm bay quanh mép nhà bè
  for (let i = 0; i < 10; i++) {
    const fx = dx + wmod(hash(i) * dw + Math.sin(t * 0.4 + i) * 40, dw), fy = (i % 2 ? dy - 4 : dy + dh + 4) + Math.sin(t * 1.3 + i * 2) * 8;
    ctx.fillStyle = `rgba(230,255,140,${0.35 + 0.35 * Math.sin(t * 3 + i)})`; ctx.beginPath(); ctx.arc(fx, fy, 1.8, 0, TAU); ctx.fill();
  }

  // ---- HUD trên trái: giờ · tiền · uy tín · ca · trên tay ----
  const nT = Math.max(1, tables.length), gapC = 6;
  const cardW = Math.max(84, Math.min(110, (w - 24 - 390) / nT - gapC)), ordersW = nT * (cardW + gapC) - gapC;
  const pw = Math.max(300, w - 24 - ordersW - 10);
  panel(12, 8, pw, 66);
  text("CÒN LẠI", 26, 27, { size: 10, weight: 700, color: C.dim });
  const lowT = (snap.time_left_ticks || 0) < 1800;
  text(fmtTime(snap.time_left_ticks), 24, 62, { size: 30, kind: "d", weight: 800, color: lowT ? C.warn : C.cream });
  ctx.fillStyle = "rgba(255,255,255,.12)"; ctx.fillRect(112, 18, 1, 48);
  coin(134, 31, 10);
  text((snap.money ?? 0) + "k", 151, 39, { size: 22, kind: "d", weight: 800, color: C.gold });
  const rep = snap.reputation ?? 0, repMax = meta.reputation_max || 5;
  const stX = 151 + measure((snap.money ?? 0) + "k", 22, "d", 800) + 18;
  for (let i = 0; i < repMax; i++) star(stX + i * 18, 31, 7.5, rep - i);
  text(rep1(rep), stX + repMax * 18 - 2, 36, { size: 12, weight: 700, color: C.muted });
  const line2 = "Ca +" + ((dayStats && dayStats.income) || 0) + "k · Điểm " + (snap.score ?? 0);
  text(line2, 126, 64, { size: 12, weight: 600, color: C.muted });
  if (snap.hand !== undefined) {
    const hd = snap.hand ? (typeof snap.hand === "string" ? snap.hand : snap.hand.dish_id) : null;
    pill(hd ? "Tay: " + (DISH_SHORT[hd] || dn(hd)) : "Tay trống", 126 + measure(line2, 12, "b", 600) + 10, 60, hd ? C.gold : C.dim, { size: 12 });
  }

  // ---- thẻ đơn theo từng bàn (trên phải) ----
  const ox0 = w - 12 - ordersW;
  tables.slice().sort((a, b2) => idNum(a.id) - idNum(b2.id)).forEach((tb, i) => {
    const x = ox0 + i * (cardW + gapC), y = 8, c = byTable[tb.id];
    const col = !c ? C.dim : c.state === "eating" ? C.ok : (ORDER_STATUS[c.order_status] || [0, C.muted])[1];
    const st = !c ? "Trống" : c.state === "eating" ? "Đang ăn" : (CARD_STATUS[c.order_status] || c.order_status || "");
    panel(x, y, cardW, 66, { r: 10, edge: hexA(col, c ? 0.7 : 0.25), fill: c ? C.panel : "rgba(30,21,14,.55)" });
    rr(x + 1, y + 1, 5, 64, 3); ctx.fillStyle = col; ctx.fill();
    text(tb.id, x + 13, y + 19, { size: 12, kind: "d", weight: 800, color: C.cream });
    if (!c) { text("bàn trống", x + 13, y + 40, { size: 12, color: C.dim }); return; }
    itemIcon(DISH_MAIN[c.dish_id], x + cardW - 16, y + 15, 18);
    text(DISH_SHORT[c.dish_id] || dn(c.dish_id), x + 13, y + 36, { size: 12, weight: 700, color: c.order_status === "unfulfillable" ? "#ff9a8f" : C.cream });
    let sub = st, subCol = col;                     // v1.2: độ tươi phần giữ + giá tạm tính
    if (Array.isArray(c.reserved) && c.reserved.length && c.state !== "eating") {
      const byId = {}; toItems(snap.stock).forEach((it) => (byId[it.id] = it));
      const fr = c.reserved.map((id) => byId[id] && byId[id].fresh).filter((f) => f != null);
      if (fr.length) {
        const avg = fr.reduce((a, b2) => a + b2, 0) / fr.length, price = (menuCfg[c.dish_id] || {}).price;
        sub = fmtFresh(avg) + (price ? " · ≈" + Math.floor((price * avg) / 100) + "k" : ""); subCol = freshColor(avg);
      }
    }
    text(sub, x + 13, y + 52, { size: 12, weight: 600, color: subCol });
    const fr = c.state === "eating" ? 1 - (c.eat_ticks_left || 0) / eatMax : (c.patience_ticks_left ?? patMax) / patMax;
    bar(x + 10, y + 58, cardW - 18, 4, fr, c.state === "eating" ? C.ok : fr < 0.25 ? C.danger : fr < 0.5 ? C.warn : C.ok);
  });

  // ---- dải kho ở cuối trang: khả dụng (chưa ươn, chưa giữ) · số ươn · độ tươi thấp nhất ----
  panel(12, stripY, w - 24, stripH, { r: 12 });
  text("KHO", 26, stripY + 19, { size: 11, kind: "d", weight: 800, color: C.gold });
  const hasFresh = kinds.some((k) => groups[k].min != null);
  text(hasFresh ? "−0.25%/s" : "", 26, stripY + 35, { size: 10, color: C.dim });
  if (!kinds.length) text("(trống)", 90, stripY + 27, { size: 13, color: C.muted });
  const colW = Math.min(128, (w - 24 - 90) / Math.max(1, kinds.length));
  kinds.forEach((k, i) => {
    const g = groups[k], x = 88 + i * colW, cy = stripY + stripH / 2;
    itemIcon(k, x + 12, cy, 22);
    const cnt = g.avail === g.total ? "×" + g.total : g.avail + "/" + g.total;
    text(cnt, x + 28, cy - 2, { size: 15, kind: "d", weight: 800, color: g.avail === 0 ? C.danger : C.cream });
    if (g.spoiled) text(g.spoiled + " ươn", x + 32 + measure(cnt, 15, "d", 800), cy - 2, { size: 12, weight: 700, color: C.danger });
    if (g.min != null) { freshBar(x + 28, cy + 6, colW - 66, g.min); text(fmtFresh(g.min), x + colW - 34, cy + 12, { size: 11, weight: 700, color: freshColor(g.min) }); }
    else text(KIND_NAME[k] || k, x + 28, cy + 14, { size: 11, color: C.muted });
  });
  drawToasts(w, topH + 14);
  keycaps(w, h, [["WASD", "đi"], ["E", "bếp · bàn"], ["Esc", "dừng"], ["R", "chơi lại"]]);
}

// =====================================================================================
// ----- các màn Phase 2: Menu, DayIntro, EveningIntro, DayResult, Shop, Summary, Pause -----
function button(label, x, y, bw, bh, on, o = {}) {
  buttons.push({ x, y, w: bw, h: bh, on });
  const col = o.disabled ? C.dim : o.color || C.gold;
  rr(x, y, bw, bh, bh / 2);
  ctx.fillStyle = o.active ? hexA(col, 0.32) : "rgba(255,255,255,.06)"; ctx.fill();
  ctx.lineWidth = o.active ? 2.5 : 1.5; ctx.strokeStyle = hexA(col, o.active ? 0.95 : 0.5); ctx.stroke(); ctx.lineWidth = 1;
  text(label, x + bw / 2, y + bh / 2 + 1, { size: o.size || 18, kind: "d", weight: 800, align: "center", base: "middle", color: o.disabled ? C.dim : C.cream });
}
function dim(a = 0.66) { ctx.fillStyle = `rgba(5,10,16,${a})`; ctx.fillRect(0, 0, 1e5, 1e5); }
function card(w, h, cw, ch, edge) {
  const x = w / 2 - cw / 2, y = Math.max(12, h / 2 - ch / 2);
  panel(x, y, cw, ch, { r: 22, lw: 2, edge: hexA(edge || C.gold, 0.65), fill: "rgba(32,22,14,.95)" });
  return [x, y];
}
function chips(items, x, y, maxW) {          // [{kind, label, color}] -> xếp dòng, trả y cuối
  let cx = x, cy = y;
  items.forEach((it) => {
    const tw = measure(it.label, 14, "b", 700) + 40;
    if (cx + tw > x + maxW) { cx = x; cy += 34; }
    rr(cx, cy - 14, tw, 28, 14); ctx.fillStyle = "rgba(255,255,255,.07)"; ctx.fill();
    itemIcon(it.kind, cx + 15, cy, 18);
    text(it.label, cx + 29, cy + 5, { size: 14, weight: 700, color: it.color || C.cream });
    cx += tw + 8;
  });
  return cy + 20;
}
function riverBackdrop(w, h, t) {
  const g = ctx.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, "#1b2a44"); g.addColorStop(0.55, "#2a3550"); g.addColorStop(0.56, "#13324a"); g.addColorStop(1, "#061320");
  ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
  const hz = h * 0.55;
  for (let i = 0; i < 9; i++) {                       // đèn lồng trên ghe + bóng nước
    const lx = (w * (i + 0.5)) / 9, ly = hz - 26 - (i % 3) * 8 + Math.sin(t + i) * 2, col = i % 2 ? "#f0b43a" : "#d8392b";
    const gl = ctx.createRadialGradient(lx, ly, 2, lx, ly, 40); gl.addColorStop(0, hexA(col, 0.5)); gl.addColorStop(1, hexA(col, 0));
    ctx.fillStyle = gl; ctx.fillRect(lx - 40, ly - 40, 80, 80);
    ctx.fillStyle = col; ctx.beginPath(); ctx.ellipse(lx, ly, 6, 8, 0, 0, TAU); ctx.fill();
    for (let k = 1; k < 6; k++) { ctx.fillStyle = hexA(col, 0.18 / k); ctx.fillRect(lx - 8 + Math.sin(t * 2 + k + i) * 3, hz + k * 12, 16, 3); }
  }
  ctx.fillStyle = "#24160c"; ctx.fillRect(0, hz - 8, w, 10);
}

function drawMenu(w, h, t) {
  riverBackdrop(w, h, t);
  text("Quán Ăn Chợ Nổi", w / 2, h * 0.27, { size: 54, kind: "d", weight: 800, align: "center", color: C.gold, shadow: true });
  text("Út Sen lặn sông Chín Khúc buổi sáng · mở quán nhà bè buổi tối", w / 2, h * 0.27 + 34, { size: 16, align: "center", color: C.muted });
  const bw = 220, bh = 50, x = w / 2 - bw / 2, y = h * 0.62;
  button("Chơi", x, y, bw, bh, startPlay, { active: menuSel === 0 });
  button("Thoát", x, y + bh + 14, bw, bh, quitGame, { active: menuSel === 1, color: C.muted });
  text("↑ ↓ chọn · Enter xác nhận · hoặc bấm chuột", w / 2, h - 22, { size: 13, align: "center", color: C.dim });
}
function drawBye(w, h, t) {
  riverBackdrop(w, h, t);
  text("Hẹn gặp lại ở chợ nổi!", w / 2, h * 0.42, { size: 40, kind: "d", weight: 800, align: "center", color: C.gold });
  text("Đóng tab trình duyệt để thoát · Enter để về menu", w / 2, h * 0.42 + 36, { size: 16, align: "center", color: C.muted });
}

function drawIntro(w, h, now) {
  dim(0.72);
  const left = Math.max(0, Math.ceil((intro.until - now) / 1000));
  const cp = currentPlan(), menu = (snap.cfg && snap.cfg.menu) || {};
  const cw = Math.min(600, w - 32);
  if (intro.kind === "day") {
    const [x, y] = card(w, h, cw, 300);
    text("Ngày " + (snap.day ?? 1), w / 2, y + 56, { size: 44, kind: "d", weight: 800, align: "center", color: C.gold });
    text("Buổi sáng · lặn sông Chín Khúc", w / 2, y + 84, { size: 15, align: "center", color: C.muted });
    if (cp) {
      text("Má Tư định nấu" + (cp.sample ? " (mẫu Ngày 1)" : "") + ":", x + 28, y + 122, { size: 15, weight: 700 });
      let yy = chips(Object.entries(cp.plan.dishes || {}).map(([d, n]) => ({ kind: DISH_MAIN[d], label: dn(d) + " ×" + n })), x + 28, y + 146, cw - 56);
      text("Cần lấy:", x + 28, yy + 14, { size: 15, weight: 700 });
      chips(Object.entries(cp.plan.ingredients || {}).map(([k, n]) => ({ kind: k, label: (KIND_NAME[k] || k) + " ×" + n, color: C.gold })), x + 28, yy + 40, cw - 56);
    }
    text(isFinite(left) ? "Tự vào sau " + left + " s · nhấn phím bất kỳ để bắt đầu" : "Nhấn phím bất kỳ để bắt đầu", w / 2, y + 286, { size: 13, align: "center", color: C.dim });
    return;
  }
  // EveningIntro: kho nhập + món nấu được (lọc theo kế hoạch ở mode day)
  const groups = groupStock(snap.stock, []);
  const stock = {}; Object.values(groups).forEach((g) => (stock[g.kind] = g.total - g.spoiled));   // chỉ hàng chưa ươn
  const allowed = snap.day_plan ? Object.keys(snap.day_plan.dishes || {}) : Object.keys(menu);
  const cook = allowed.map((d) => {
    const rc = (menu[d] || {}).recipe || {};
    const n = Object.keys(rc).length ? Math.min(...Object.entries(rc).map(([k, q]) => Math.floor((stock[k] || 0) / q))) : 0;
    return { d, n };
  });
  const [x, y] = card(w, h, cw, 320, C.warn);
  text("Mở quán" + (snap.day ? " · tối Ngày " + snap.day : ""), w / 2, y + 52, { size: 38, kind: "d", weight: 800, align: "center", color: C.warn });
  text("Nhập kho từ buổi sáng:", x + 28, y + 92, { size: 15, weight: 700 });
  const ks = Object.keys(groups).sort();
  const chipOf = (g) => ({ kind: g.kind, color: g.spoiled ? C.warn : C.cream,
    label: (KIND_NAME[g.kind] || g.kind) + " ×" + g.total + (g.avg != null ? " · " + fmtFresh(g.avg) : "") + (g.spoiled ? " · " + g.spoiled + " ươn" : "") });
  let yy = ks.length ? chips(ks.map((k) => chipOf(groups[k])), x + 28, y + 116, cw - 56)
    : (text("Kho trống — khách tới sẽ không có món", x + 28, y + 122, { size: 14, color: C.danger }), y + 136);
  text("Món nấu được:", x + 28, yy + 14, { size: 15, weight: 700 });
  cook.forEach((c, i) => {
    const cy = yy + 40 + Math.floor(i / 2) * 28, cx = x + 28 + (i % 2) * (cw - 56) / 2;
    itemIcon(DISH_MAIN[c.d], cx + 10, cy - 5, 18);
    text(dn(c.d) + (c.n > 0 ? " · đủ " + c.n + " suất" : " · thiếu"), cx + 26, cy, { size: 14, weight: 600, color: c.n > 0 ? C.ok : C.dim });
  });
  text(isFinite(left) ? "Tự mở sau " + left + " s · nhấn phím bất kỳ" : "Nhấn phím bất kỳ", w / 2, y + 306, { size: 13, align: "center", color: C.dim });
}

function drawResult(w, h) {
  dim(0.72);
  const st = result.stats || newDayStats(null), cw = Math.min(520, w - 32);
  const [x, y] = card(w, h, cw, 340);
  text("Kết quả Ngày " + (result.day ?? 1), w / 2, y + 50, { size: 36, kind: "d", weight: 800, align: "center", color: C.gold });
  const dRep = st.repEnd != null && st.repStart != null ? st.repEnd - st.repStart : null;
  const rows = [
    ["Khách đã phục vụ", st.served, C.ok],
    ["Khách bỏ đi", st.left, st.left ? C.danger : C.cream],
    ["Rời bàn lúc đóng ca", st.closing, C.muted],
    ["Tiền thu (gồm boa)", st.income + "k", C.gold],
    ["Tiền boa", st.tips + "k", C.gold],
    ["Uy tín", st.repStart != null ? rep1(st.repStart) + " → " + rep1(st.repEnd) + (dRep != null ? (dRep >= 0 ? "  (+" : "  (") + dRep.toFixed(1) + ")" : "") : rep1(snap.reputation), dRep < 0 ? C.danger : C.ok],
  ];
  rows.forEach(([k, v, col], i) => {
    const ry = y + 92 + i * 34;
    if (i % 2 === 0) { rr(x + 20, ry - 20, cw - 40, 32, 8); ctx.fillStyle = "rgba(255,255,255,.04)"; ctx.fill(); }
    text(k, x + 36, ry, { size: 16, weight: 600, color: C.muted });
    text(String(v), x + cw - 36, ry, { size: 18, kind: "d", weight: 800, align: "right", color: col });
  });
  const next = snap.mode === "day" ? "Sang Shop" : "Xem quán";
  button("Enter · " + next, w / 2 - 110, y + 290, 220, 40, () => (result = null), { active: true, size: 16 });
}

function drawShop(w, h, t) {
  riverBackdrop(w, h, t);
  dim(0.35);
  const shop = (snap.cfg && snap.cfg.shop) || {}, ups = shop.upgrades || {};
  const bought = snap.upgrades || {}, active = snap.active_upgrades || {}, money = snap.money ?? 0;
  text("Shop cuối ngày · Ngày " + (snap.day ?? 1), 24, 46, { size: 30, kind: "d", weight: 800, color: C.gold });
  coin(w - 190, 34, 12);
  text(money + "k", w - 172, 44, { size: 26, kind: "d", weight: 800, color: C.gold });
  const lowT = (snap.time_left_ticks || 0) <= 180;
  text("Tự đóng sau " + Math.ceil((snap.time_left_ticks || 0) / 60) + " s", w - 24, 68, { size: 13, align: "right", color: lowT ? C.danger : C.muted });
  const ids = Object.keys(ups), cw = Math.min(300, (w - 48 - (ids.length - 1) * 16) / Math.max(1, ids.length)), ch = 230;
  const x0 = w / 2 - (ids.length * cw + (ids.length - 1) * 16) / 2, y0 = 92;
  ids.forEach((id, i) => {
    const info = UPGRADE_INFO[id] || { name: id, key: String(i + 1), field: null, unit: (v) => v, color: C.gold };
    const lv = bought[id] || 0, levels = ups[id] || [], next = levels.find((l) => l.level === lv + 1);
    const x = x0 + i * (cw + 16);
    panel(x, y0, cw, ch, { r: 18, edge: hexA(info.color, 0.6), lw: 2 });
    text(info.name, x + 18, y0 + 34, { size: 22, kind: "d", weight: 800, color: info.color });
    for (let k = 0; k < levels.length; k++) {                 // chấm cấp: đặc = đã mua, viền = chưa
      ctx.beginPath(); ctx.arc(x + cw - 24 - (levels.length - 1 - k) * 18, y0 + 28, 6, 0, TAU);
      if (k < lv) { ctx.fillStyle = info.color; ctx.fill(); } else { ctx.strokeStyle = hexA(info.color, 0.6); ctx.lineWidth = 1.5; ctx.stroke(); ctx.lineWidth = 1; }
    }
    text("Đã mua cấp " + lv + " · đang dùng cấp " + (active[id] || 0), x + 18, y0 + 62, { size: 13, color: C.muted });
    if (next) {
      text("Cấp " + next.level + ": " + (info.field ? info.unit(next[info.field]) : ""), x + 18, y0 + 100, { size: 18, weight: 700 });
      text("Giá " + next.price + "k", x + 18, y0 + 128, { size: 16, weight: 600, color: money >= next.price ? C.gold : C.danger });
      const can = money >= next.price;
      button("[" + info.key + "] Mua", x + 18, y0 + ch - 62, cw - 36, 42, () => buy(id), { active: can, disabled: !can, color: info.color, size: 16 });
    } else {
      text("Đã đạt cấp tối đa", x + 18, y0 + 110, { size: 16, weight: 700, color: C.ok });
    }
  });
  text("Cấp vừa mua hiện ngay ở đây, nhưng chỉ có hiệu lực từ Ngày kế tiếp.", w / 2, y0 + ch + 30, { size: 13, align: "center", color: C.muted });
  const sg = groupStock(snap.stock, []), ks = Object.keys(sg).sort();
  if (ks.length) {
    text("Kho dư (sẽ bỏ sau Shop · không hao ở Shop):", 24, y0 + ch + 66, { size: 13, weight: 700, color: C.dim });
    chips(ks.map((k) => ({ kind: k, color: C.muted,
      label: (KIND_NAME[k] || k) + " ×" + sg[k].total + (sg[k].avg != null ? " · " + fmtFresh(sg[k].avg) : "") + (sg[k].spoiled ? " · " + sg[k].spoiled + " ươn" : "") })), 24, y0 + ch + 92, w - 48);
  }
  button("Enter · Đóng Shop", w / 2 - 120, h - 70, 240, 44, () => tapButton("shop_done"), { active: true, size: 16 });
  drawToasts(w, 76);
}

function drawSummary(w, h, t) {
  riverBackdrop(w, h, t);
  dim(0.45);
  const cw = Math.min(540, w - 32), [x, y] = card(w, h, cw, 360);
  text("Tổng kết " + (snap.days_completed ?? snap.day ?? "") + " ngày", w / 2, y + 54, { size: 38, kind: "d", weight: 800, align: "center", color: C.gold });
  const best = Object.entries(runStats.dishes).sort((a, b) => b[1] - a[1])[0];
  const rows = [
    ["Tổng tiền còn", (snap.money ?? 0) + "k"],
    ["Tổng thu (earned)", (snap.earned ?? 0) + "k"],
    ["Tổng điểm", snap.score ?? 0],
    ["Uy tín cuối", rep1(snap.reputation ?? 0)],
    ["Món bán chạy nhất", best ? dn(best[0]) + " ×" + best[1] : "—"],
  ];
  rows.forEach(([k, v], i) => {
    const ry = y + 104 + i * 38;
    text(k, x + 36, ry, { size: 16, weight: 600, color: C.muted });
    text(String(v), x + cw - 36, ry, { size: 20, kind: "d", weight: 800, align: "right" });
  });
  for (let i = 0; i < 5; i++) star(w / 2 - 48 + i * 24, y + 300, 10, (snap.reputation ?? 0) - i);
  button("Enter · Về menu", w / 2 - 110, y + 318, 220, 34, goMenu, { active: true, size: 15 });
}

function drawPause(w, h) {
  dim(0.6);
  const [x, y] = card(w, h, 340, 230, C.oxy);
  text("Tạm dừng", w / 2, y + 56, { size: 36, kind: "d", weight: 800, align: "center", color: C.cream });
  text("Mọi đồng hồ và bộ đếm đang đứng yên", w / 2, y + 84, { size: 13, align: "center", color: C.muted });
  button("Tiếp tục  (Esc)", x + 40, y + 108, 260, 44, togglePause, { active: true });
  button("Về menu  (M)", x + 40, y + 164, 260, 44, goMenu, { color: C.muted });
}

let lastFrame = performance.now();
function frame() {
  requestAnimationFrame(frame);  // đặt trước để lỗi vẽ không làm dừng vòng lặp
  const now = performance.now(), dt = Math.min(0.1, (now - lastFrame) / 1000), t = now / 1000;
  lastFrame = now;
  const [w, h] = fit();
  buttons = [];
  ctx.fillStyle = "#0b1622"; ctx.fillRect(0, 0, w, h);
  if (screen === "menu") drawMenu(w, h, t);
  else if (screen === "bye") drawBye(w, h, t);
  else if (snap) {
    try { drawGame(w, h, t, dt, now); }
    catch (e) {                            // lỗi vẽ: báo trên màn hình thay vì im lặng
      ctx.setTransform(uiK * (window.devicePixelRatio || 1), 0, 0, uiK * (window.devicePixelRatio || 1), 0, 0);
      pill("Lỗi vẽ UI: " + String(e && e.message || e).slice(0, 90), 12, h - 60, C.danger, { size: 13, fill: "rgba(30,0,0,.9)" });
      if (!frame.logged) { frame.logged = true; console.error(e); }
    }
  } else {
    text("Quán Ăn Chợ Nổi", w / 2, h / 2 - 8, { kind: "d", size: 36, weight: 800, align: "center", color: C.gold });
    text(offline ? "Không kết nối được máy chủ — đã chạy python -m chonoi.live chưa?" : "Đang tải…", w / 2, h / 2 + 26, { align: "center", size: 15, color: C.muted });
  }
  syncHold();
}
function drawGame(w, h, t, dt, now) {
  {
    collectToasts();
    detectStage();
    if (intro && now > intro.until) intro = null;
    const phase = snap.phase || snap.mode;
    const summary = snap.finished && (snap.mode === "day" || snap.reason === "days_complete");
    if (summary) drawSummary(w, h, t);
    else if (phase === "shop") drawShop(w, h, t);
    else if (phase === "quan") drawQuan(w, h, t);
    else drawGather(w, h, t, dt);
    eventLog(w, h);
    if (!summary) overlay(w, h);
    if (result) drawResult(w, h);
    else if (intro) drawIntro(w, h, now);
    else if (isPaused() && !snap.finished) drawPause(w, h);
  }
}
poll();
if (screen === "game" && !MOCK) restartGame();   // ?play=1: vào thẳng, vẫn có DayIntro từ tick 0
requestAnimationFrame(frame);
</script>
