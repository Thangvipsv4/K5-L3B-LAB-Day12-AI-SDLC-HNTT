<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quán Ăn Chợ Nổi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>
  html, body { margin: 0; height: 100%; background: #0b1622; color: #f7ecd6; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";
/*
 * Client chơi trực tiếp — nhóm HNTT (client/ui). CHỈ ĐỌC snapshot từ GET /state và gửi phím qua POST /input.
 * Trường nào snapshot chưa có thì bỏ qua (nhóm viết luật tới đâu, hình hiện tới đó).
 * Mọi hiệu ứng (bọt nước, sóng, đèn lồng, toast) chỉ ở client: không ảnh hưởng mô phỏng/headless.
 * Phím: WASD / mũi tên = di chuyển · E = interact · Space = catch · R = chơi lại · L = nhật ký sự kiện + id.
 */
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
let snap = null, offline = false, showLog = false;

// ---------- vào: phím ----------
const down = new Set();
const MOVE_KEYS = { w: "u", arrowup: "u", s: "d", arrowdown: "d", a: "l", arrowleft: "l", d: "r", arrowright: "r" };
let queue = [], inflight = false, lastSent = "";

function currentInput() {
  const mode = snap ? snap.mode : "gather";
  const dx = (down.has("r") ? 1 : 0) - (down.has("l") ? 1 : 0);
  let dy = (down.has("d") ? 1 : 0) - (down.has("u") ? 1 : 0);   // gather: xuống = d dương
  if (mode === "quan") dy = -dy;                                // quan: lên (bắc) = z dương
  return { move: [dx, dy], interact: down.has("interact"), catch: down.has("catch") };
}
function pushInput() {
  const s = JSON.stringify(currentInput());
  if (s === lastSent) return;
  lastSent = s;
  queue.push(s);
  flush();
}
async function flush() {
  if (inflight) return;
  inflight = true;
  while (queue.length) {
    const body = queue.shift();
    try { await fetch("/input", { method: "POST", body, headers: { "Content-Type": "application/json" } }); }
    catch (e) { /* mất kết nối: poll sẽ báo */ }
  }
  inflight = false;
}
function keyName(e) { return e.key.toLowerCase(); }
addEventListener("keydown", (e) => {
  const k = keyName(e);
  if (e.repeat) { if (k === " " || k.startsWith("arrow")) e.preventDefault(); return; }
  if (MOVE_KEYS[k]) { down.add(MOVE_KEYS[k]); e.preventDefault(); }
  else if (k === "e") down.add("interact");
  else if (k === " ") { down.add("catch"); e.preventDefault(); }
  else if (k === "r") { fetch("/restart", { method: "POST" }); lastSent = ""; down.clear(); }
  else if (k === "l") showLog = !showLog;
  pushInput();
});
addEventListener("keyup", (e) => {
  const k = keyName(e);
  if (MOVE_KEYS[k]) down.delete(MOVE_KEYS[k]);
  else if (k === "e") down.delete("interact");
  else if (k === " ") down.delete("catch");
  pushInput();
});
addEventListener("blur", () => { down.clear(); pushInput(); });

// ---------- ra: poll snapshot ----------
async function poll() {
  try {
    const r = await fetch("/state", { cache: "no-store" });
    snap = await r.json();
    offline = false;
  } catch (e) { offline = true; }
  setTimeout(poll, 16);
}
poll();

// =====================================================================================
// ---------- bảng màu, chữ, dữ liệu hiển thị ----------
// Hướng thiết kế: chợ nổi miền Tây — sáng bình minh trên sông phù sa, tối đèn lồng trên ghe.
// Khung HUD: gỗ tếch sẫm, viền vàng bông điên điển.
const C = {
  panel: "rgba(30,21,14,.84)", panelHi: "rgba(255,236,200,.06)", edge: "rgba(242,194,48,.32)",
  cream: "#f7ecd6", muted: "#c9b796", dim: "#8d7d69",
  gold: "#f2c230", lotus: "#ec7fa3", oxy: "#5fd0f2", heart: "#ff5d73",
  danger: "#ff5a4f", warn: "#ffae3d", ok: "#8bd67f",
};
const FD = '"Baloo 2", "Segoe UI", system-ui, sans-serif';         // tiêu đề, số lớn
const FB = '"Be Vietnam Pro", "Segoe UI", system-ui, sans-serif';  // chữ thường
const FM = 'ui-monospace, Consolas, "Cascadia Mono", monospace';    // nhật ký

const KIND_COLOR = { ca_loc: "#6f8f4e", ca_linh: "#cfdde8", ca_keo: "#d39a5e", bong_dien_dien: "#f2c230", bong_sung: "#ec7fa3", keo_neo: "#8fcf6b" };
const KIND_NAME = { ca_loc: "cá lóc", ca_linh: "cá linh", ca_keo: "cá kèo", bong_dien_dien: "điên điển", bong_sung: "bông súng", keo_neo: "kèo nèo" };
const kc = (k) => KIND_COLOR[k] || "#bbbbbb";
const DISH_NAME = { ca_loc_nuong_trui: "Cá lóc nướng trui", goi_bong_sung: "Gỏi bông súng", lau_ca_linh_dien_dien: "Lẩu cá linh điên điển" };
const DISH_MAIN = { ca_loc_nuong_trui: "ca_loc", goi_bong_sung: "bong_sung", lau_ca_linh_dien_dien: "ca_linh" };
const dn = (d) => DISH_NAME[d] || d || "?";
const STOVE_STATE = { idle: "Bếp rảnh", cooking: "Đang nấu", ready: "Chín · E lấy", burnt: "Cháy" };
const ORDER_STATUS = { reserved: ["Đã giữ nguyên liệu", C.gold], assigned: ["Đang nấu", C.warn], unfulfillable: ["Không nấu được", C.danger], served: ["Đã phục vụ", C.ok] };
const REASON = { docked: "Cập bến an toàn", time: "Hết giờ", fainted: "Ngất xỉu dưới nước" };

// ---------- tiện ích vẽ ----------
const TAU = Math.PI * 2;
const clamp01 = (v) => Math.max(0, Math.min(1, v || 0));
function fit() {
  const dpr = window.devicePixelRatio || 1;
  const w = cv.clientWidth || innerWidth, h = cv.clientHeight || innerHeight;
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return [w, h];
}
function font(size, kind, weight) {
  const f = kind === "d" ? FD : kind === "m" ? FM : FB;
  ctx.font = `${weight || (kind === "d" ? 700 : 500)} ${size}px ${f}`;
}
function text(s, x, y, o = {}) {
  font(o.size || 14, o.kind, o.weight);
  ctx.fillStyle = o.color || C.cream;
  ctx.textAlign = o.align || "left";
  ctx.textBaseline = o.base || "alphabetic";
  if (o.shadow) { ctx.shadowColor = "rgba(0,0,0,.6)"; ctx.shadowBlur = 4; ctx.shadowOffsetY = 1; }
  ctx.fillText(s, x, y);
  ctx.shadowColor = "transparent"; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
}
function measure(s, size, kind, weight) { font(size, kind, weight); return ctx.measureText(s).width; }
function rr(x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  ctx.beginPath(); ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function panel(x, y, w, h, o = {}) {
  ctx.shadowColor = "rgba(0,0,0,.35)"; ctx.shadowBlur = 14; ctx.shadowOffsetY = 4;
  rr(x, y, w, h, o.r ?? 14); ctx.fillStyle = o.fill || C.panel; ctx.fill();
  ctx.shadowColor = "transparent"; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
  rr(x + 1, y + 1, w - 2, Math.min(18, h / 2), (o.r ?? 14) - 1); ctx.fillStyle = C.panelHi; ctx.fill();
  rr(x, y, w, h, o.r ?? 14); ctx.lineWidth = o.lw || 1.5; ctx.strokeStyle = o.edge || C.edge; ctx.stroke(); ctx.lineWidth = 1;
}
function pill(s, x, y, color, o = {}) {           // x,y = góc trái-giữa; trả bề rộng
  const size = o.size || 11, pad = o.pad || 8, tw = measure(s, size, "b", 600), h = size + 9;
  rr(x, y - h / 2, tw + pad * 2, h, h / 2);
  ctx.fillStyle = o.fill || hexA(color, 0.18); ctx.fill();
  ctx.strokeStyle = hexA(color, 0.55); ctx.stroke();
  text(s, x + pad, y + 0.5, { size, weight: 600, base: "middle", color: o.textColor || color });
  return tw + pad * 2;
}
function bar(x, y, w, h, frac, color, o = {}) {
  frac = clamp01(frac);
  rr(x, y, w, h, h / 2); ctx.fillStyle = "rgba(0,0,0,.5)"; ctx.fill();
  if (frac > 0) {
    const fw = Math.max(h, w * frac);
    rr(x, y, fw, h, h / 2); ctx.fillStyle = color; ctx.fill();
    rr(x + 2, y + 1.5, fw - 4, Math.max(1, h * 0.35), h / 4); ctx.fillStyle = "rgba(255,255,255,.28)"; ctx.fill();
  }
  if (o.label) text(o.label, x + w / 2, y + h / 2 + 1, { size: o.labelSize || 11, align: "center", base: "middle", weight: 700, shadow: true });
}
function hexA(hex, a) {
  if (!hex || hex[0] !== "#") return hex;
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`;
}
function shade(hex, a) {
  if (!hex || hex[0] !== "#") return hex;
  const n = parseInt(hex.slice(1), 16), f = (c) => Math.round(a >= 0 ? c + (255 - c) * a : c * (1 + a));
  return `rgb(${f(n >> 16)},${f((n >> 8) & 255)},${f(n & 255)})`;
}
function fmtTime(ticks) {
  const s = Math.ceil((ticks || 0) / 60);
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function ring(x, y, r, frac, color, lw = 3) {
  ctx.lineWidth = lw; ctx.strokeStyle = "rgba(0,0,0,.35)"; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.stroke();
  ctx.strokeStyle = color; ctx.beginPath(); ctx.arc(x, y, r, -Math.PI / 2, -Math.PI / 2 + TAU * clamp01(frac)); ctx.stroke();
  ctx.lineWidth = 1;
}

// ---------- hình vẽ nhỏ: tim, sao, xu, cá, hoa ----------
function heart(cx, cy, r, full) {
  ctx.beginPath();
  ctx.moveTo(cx, cy + r * 0.95);
  ctx.bezierCurveTo(cx - r * 1.35, cy + r * 0.1, cx - r * 0.95, cy - r * 1.05, cx, cy - r * 0.35);
  ctx.bezierCurveTo(cx + r * 0.95, cy - r * 1.05, cx + r * 1.35, cy + r * 0.1, cx, cy + r * 0.95);
  ctx.closePath();
  if (full) { ctx.fillStyle = C.heart; ctx.fill(); ctx.fillStyle = "rgba(255,255,255,.35)"; ctx.beginPath(); ctx.arc(cx - r * 0.45, cy - r * 0.35, r * 0.22, 0, TAU); ctx.fill(); }
  else { ctx.fillStyle = "rgba(255,255,255,.06)"; ctx.fill(); ctx.strokeStyle = hexA(C.heart, 0.55); ctx.lineWidth = 1.5; ctx.stroke(); ctx.lineWidth = 1; }
}
function starPath(cx, cy, r) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + (i * Math.PI) / 5, q = i % 2 ? r * 0.45 : r; ctx.lineTo(cx + Math.cos(a) * q, cy + Math.sin(a) * q); }
  ctx.closePath();
}
function star(cx, cy, r, frac) {
  starPath(cx, cy, r); ctx.fillStyle = "rgba(255,255,255,.12)"; ctx.fill();
  if (frac > 0) { ctx.save(); ctx.beginPath(); ctx.rect(cx - r, cy - r, 2 * r * clamp01(frac), 2 * r); ctx.clip(); starPath(cx, cy, r); ctx.fillStyle = C.gold; ctx.fill(); ctx.restore(); }
}
function coin(cx, cy, r) {
  const g = ctx.createRadialGradient(cx - r * 0.3, cy - r * 0.3, 1, cx, cy, r);
  g.addColorStop(0, "#fff1a8"); g.addColorStop(1, "#d39a1c");
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, r, 0, TAU); ctx.fill();
  ctx.strokeStyle = "#8a5d0c"; ctx.stroke();
  text("đ", cx, cy + 1, { size: r * 1.25, align: "center", base: "middle", weight: 800, kind: "d", color: "#7a4f06" });
}
function bubbleIcon(cx, cy, r) {
  ctx.strokeStyle = C.oxy; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, TAU); ctx.stroke();
  ctx.beginPath(); ctx.arc(cx + r * 0.9, cy - r * 0.9, r * 0.45, 0, TAU); ctx.stroke();
  ctx.lineWidth = 1; ctx.fillStyle = "rgba(255,255,255,.7)"; ctx.beginPath(); ctx.arc(cx - r * 0.35, cy - r * 0.35, r * 0.22, 0, TAU); ctx.fill();
}
function fishShape(x, y, len, color, ang, t) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(ang);
  if (Math.cos(ang) < 0) ctx.scale(1, -1);        // không lật ngửa khi bơi sang trái
  const wig = Math.sin(t * 9) * 0.16 * len;
  ctx.fillStyle = shade(color, -0.2);
  ctx.beginPath(); ctx.moveTo(-len * 0.34, 0); ctx.lineTo(-len * 0.62, -len * 0.22 + wig); ctx.lineTo(-len * 0.55, wig * 0.6); ctx.lineTo(-len * 0.62, len * 0.22 + wig); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-len * 0.1, -len * 0.15); ctx.quadraticCurveTo(len * 0.05, -len * 0.33, len * 0.18, -len * 0.14); ctx.fill();
  const g = ctx.createLinearGradient(0, -len * 0.2, 0, len * 0.2);
  g.addColorStop(0, shade(color, 0.3)); g.addColorStop(0.55, color); g.addColorStop(1, shade(color, -0.3));
  ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(0, 0, len * 0.45, len * 0.18, 0, 0, TAU); ctx.fill();
  ctx.strokeStyle = "rgba(0,0,0,.18)"; ctx.beginPath(); ctx.moveTo(len * 0.18, -len * 0.13); ctx.quadraticCurveTo(len * 0.25, 0, len * 0.18, len * 0.13); ctx.stroke();
  ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(len * 0.3, -len * 0.04, len * 0.05, 0, TAU); ctx.fill();
  ctx.fillStyle = "#14202a"; ctx.beginPath(); ctx.arc(len * 0.31, -len * 0.04, len * 0.027, 0, TAU); ctx.fill();
  ctx.restore();
}
function lotusFlower(x, y, r) {      // bông súng: cánh hồng xòe, nhụy vàng
  for (let layer = 0; layer < 2; layer++) {
    const rr2 = r * (layer ? 0.7 : 1);
    ctx.fillStyle = layer ? shade(KIND_COLOR.bong_sung, 0.25) : KIND_COLOR.bong_sung;
    for (let i = 0; i < 5; i++) {
      const a = -Math.PI / 2 + (i - 2) * 0.5;
      ctx.beginPath(); ctx.ellipse(x + Math.cos(a) * rr2 * 0.5, y + Math.sin(a) * rr2 * 0.5, rr2 * 0.52, rr2 * 0.2, a, 0, TAU); ctx.fill();
    }
  }
  ctx.fillStyle = "#ffe07a"; ctx.beginPath(); ctx.arc(x, y - r * 0.1, r * 0.17, 0, TAU); ctx.fill();
}
function dienDien(x, y, r) {          // bông điên điển: chùm hoa vàng trên cành
  ctx.strokeStyle = "#5e8a3a"; ctx.lineWidth = Math.max(1.2, r * 0.13);
  ctx.beginPath(); ctx.moveTo(x, y + r * 0.9); ctx.quadraticCurveTo(x - r * 0.25, y + r * 0.2, x + r * 0.05, y - r * 0.3); ctx.stroke(); ctx.lineWidth = 1;
  ctx.fillStyle = "#7fae4f";
  ctx.beginPath(); ctx.ellipse(x + r * 0.35, y + r * 0.35, r * 0.3, r * 0.1, -0.5, 0, TAU); ctx.fill();
  ctx.fillStyle = KIND_COLOR.bong_dien_dien;
  [[-0.45, -0.25], [0.42, -0.35], [-0.12, -0.72], [0.2, -0.05], [-0.48, 0.22], [0.3, -0.75]].forEach(([a, b], i) => {
    ctx.beginPath(); ctx.ellipse(x + a * r, y + b * r, r * 0.27, r * 0.18, a + i, 0, TAU); ctx.fill();
  });
}
function itemIcon(kind, x, y, size) {
  if (kind && kind.startsWith("ca_")) fishShape(x + size * 0.04, y, size * 1.05, kc(kind), 0, 0);
  else if (kind === "bong_sung") lotusFlower(x, y + size * 0.12, size * 0.5);
  else if (kind === "bong_dien_dien") dienDien(x, y + size * 0.05, size * 0.45);
  else { ctx.fillStyle = kc(kind); ctx.beginPath(); ctx.arc(x, y, size * 0.3, 0, TAU); ctx.fill(); }
}
function nonLa(x, y, r) {            // nón lá nhìn từ trên xuống
  const g = ctx.createRadialGradient(x - r * 0.2, y - r * 0.25, r * 0.1, x, y, r);
  g.addColorStop(0, "#fbefc8"); g.addColorStop(1, "#cdb06f");
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
  ctx.strokeStyle = "rgba(110,80,30,.35)";
  for (let k = 1; k <= 3; k++) { ctx.beginPath(); ctx.arc(x, y, (r * k) / 3.4, 0, TAU); ctx.stroke(); }
  ctx.fillStyle = "#8a6a32"; ctx.beginPath(); ctx.arc(x, y, r * 0.09, 0, TAU); ctx.fill();
}

// ---------- thông báo sự kiện (toast) ----------
const nz = (v) => (v === undefined || v === null ? "" : v);
const rep1 = (v) => (v === undefined || v === null ? "" : Number(v).toFixed(1));
const EVENT_MSG = {
  dive: () => ["Lặn xuống — oxy bắt đầu giảm", C.oxy],
  surface: () => ["Lên mặt nước — oxy đang hồi", "#9be3f7"],
  oxygen_empty: () => ["Hết oxy! Nổi lên ngay", C.danger],
  choke: (d) => ["Ngạt nước! Máu còn " + nz(d.hp), C.danger],
  faint: (d) => ["Ngất xỉu — rơi mất " + (d.lost || []).length + " món trong giỏ", C.danger],
  gather: (d) => ["Hái được " + (KIND_NAME[d.kind] || d.kind || "") + " ×" + nz(d.amount || 1), C.ok],
  hold_full: (d) => ["Giỏ đầy! Cần " + nz(d.required) + " chỗ, còn " + nz(d.free), C.warn],
  node_regrown: (d) => ["Bụi " + nz(d.node_id) + " đã mọc lại", "#b6df8a"],
  fish_caught: (d) => ["Bắt được " + (KIND_NAME[d.kind] || d.kind || "cá") + " ×" + nz(d.yield || 1), "#7fe0cf"],
  gather_end: (d) => ["Hết buổi sáng: " + (REASON[d.reason] || nz(d.reason)), C.gold],
  customer_arrived: (d) => ["Bàn " + nz(d.table_id) + " gọi " + dn(d.dish_id), "#f8bbd0"],
  no_dish: () => ["Khách tới nhưng kho không đủ nấu món nào", "#ffab91"],
  cook_started: (d) => ["Bếp " + nz(d.stove_id) + " bắt đầu nấu " + dn(d.dish_id), C.warn],
  dish_ready: (d) => [dn(d.dish_id) + " đã chín ở bếp " + nz(d.stove_id), C.ok],
  dish_picked: (d) => ["Đã bưng " + dn(d.dish_id), C.gold],
  served: (d) => ["Đã dọn món cho bàn " + nz(d.table_id), C.ok],
  paid: (d) => ["Bàn " + nz(d.table_id) + " trả " + nz(d.amount) + "k" + (d.tip ? " · boa " + d.tip + "k" : ""), C.gold],
  customer_left: (d) => ["Khách bàn " + nz(d.table_id) + " bỏ đi · uy tín " + rep1(d.reputation), "#ef9a9a"],
  quan_end: (d) => ["Đóng quán · " + nz(d.money) + "k · uy tín " + rep1(d.reputation), C.gold],
};
const TOAST_MS = 2800;
let toasts = [], seenTick = 0, lastMode = null;
function collectToasts() {
  const ev = snap.events || [], now = performance.now();
  if ((snap.tick ?? 0) < seenTick || snap.mode !== lastMode) { seenTick = 0; toasts = []; bubbles = []; lastMode = snap.mode; }
  let maxT = seenTick;
  ev.forEach((e) => {
    if (e.tick > seenTick) {
      const f = EVENT_MSG[e.name];
      if (f) { try { const [msg, color] = f(e.data || {}); toasts.push({ msg, color, at: now }); } catch (_) {} }
      if (e.tick > maxT) maxT = e.tick;
    }
  });
  seenTick = maxT;
  toasts = toasts.filter((t) => now - t.at < TOAST_MS).slice(-4);
}
function drawToasts(w, y0) {
  const now = performance.now();
  toasts.forEach((t, i) => {
    const age = now - t.at;
    const a = age > TOAST_MS - 450 ? (TOAST_MS - age) / 450 : Math.min(1, age / 140);
    const slide = age < 140 ? (1 - age / 140) * -8 : 0;
    ctx.globalAlpha = Math.max(0, a);
    const y = y0 + i * 38 + slide, tw = measure(t.msg, 15, "b", 600) + 46;
    panel(w / 2 - tw / 2, y, tw, 30, { r: 15, edge: hexA(t.color, 0.5) });
    ctx.fillStyle = t.color; ctx.beginPath(); ctx.arc(w / 2 - tw / 2 + 17, y + 15, 5, 0, TAU); ctx.fill();
    text(t.msg, w / 2 - tw / 2 + 30, y + 15.5, { size: 15, weight: 600, base: "middle" });
    ctx.globalAlpha = 1;
  });
}
function eventLog(w, h) {
  if (!showLog) return;
  const ev = (snap.events || []).slice(-8), pw = Math.min(460, w - 32), ph = 26 + ev.length * 16;
  panel(w - pw - 16, h - 64 - ph, pw, ph, { r: 10 });
  text("Nhật ký sự kiện (L để ẩn)", w - pw - 4, h - 64 - ph + 17, { size: 11, color: C.muted, weight: 600 });
  ev.forEach((e, i) => {
    let s = ""; try { s = JSON.stringify(e.data); } catch (_) {}
    if (s.length > 52) s = s.slice(0, 50) + "…";
    text(`t${e.tick} ${e.name} ${s}`, w - pw - 4, h - 64 - ph + 36 + i * 16, { size: 11, kind: "m", color: "rgba(247,236,214,.8)" });
  });
}
function keycaps(w, h, items) {

    const [k, label] = items[i];
    const lw = measure(label, 12, "b", 500), kw = measure(k, 11, "b", 700) + 12;

    x -= kw + 6; rr(x, h - 31, kw, 22, 6); ctx.fillStyle = "rgba(255,255,255,.1)"; ctx.fill(); ctx.strokeStyle = "rgba(255,255,255,.28)"; ctx.stroke();
    text(k, x + kw / 2, h - 19.5, { size: 11, weight: 700, align: "center", base: "middle" });

}
function banner(w, y, msg, sub, color) {

// ---------- lớp phủ chung ----------
function overlay(w, h) {
  if (offline) pill("Mất kết nối tới máy chủ — server còn chạy không?", w / 2 - 170, h - 60, C.danger, { size: 13 });
  if (snap.error) pill("Luật của nhóm báo lỗi — xem terminal. R để chơi lại.", w / 2 - 175, h - 90, C.danger, { size: 13 });
  if (snap.finished) {
    ctx.fillStyle = "rgba(5,10,16,.6)"; ctx.fillRect(0, 0, w, h);
    const pw = Math.min(440, w - 32), ph = 200, x = w / 2 - pw / 2, y = h / 2 - ph / 2;

    text(gather ? "Hết buổi sáng" : "Đóng quán", w / 2, y + 52, { size: 34, kind: "d", weight: 800, align: "center", color: C.gold });
    text(REASON[snap.reason] || snap.reason || "", w / 2, y + 80, { size: 15, align: "center", color: C.muted });
    let line = "";
    if (gather) line = "Giỏ mang về: " + (snap.reason === "fainted" ? 0 : (snap.hold_count ?? (snap.hold || []).length)) + " món";
    else line = `Tiền ${snap.money ?? 0}k · Uy tín ${rep1(snap.reputation ?? 0)} · Điểm ${snap.score ?? 0}`;
    text(line, w / 2, y + 120, { size: 18, weight: 600, align: "center" });
    text("Nhấn R để chơi lại", w / 2, y + 166, { size: 13, align: "center", color: C.dim });
  }

// ---------- bọt nước (chỉ hiệu ứng client) ----------
let bubbles = [], lastBubble = 0;
function updateBubbles(p, underwater, dt, now) {
  if (p && p.pos && underwater && !snap.finished && now - lastBubble > 240) {
    lastBubble = now;
    bubbles.push({ x: p.pos[0] + (Math.random() - 0.5) * 0.5, d: p.pos[1] - 0.4, r: 0.1 + Math.random() * 0.13, v: 1.4 + Math.random() * 1.2, ph: Math.random() * TAU });
  }
  bubbles.forEach((b) => { b.d -= b.v * dt; b.x += Math.sin(now / 280 + b.ph) * dt * 0.35; });
  bubbles = bubbles.filter((b) => b.d > 0).slice(-70);
}

// =====================================================================================
// ----- cảnh GATHER: nhìn ngang, x sang phải, d xuống -----
function drawGather(w, h, t, dt) {
  const meta = snap.meta || {};
  const b = meta.bounds || { x: [0, 100], d: [0, 30] };
  const X = b.x[1], D = b.d[1], SKY = 5;
  const top = 100, bottom = 92;
  const s = Math.max(1, Math.min((w - 32) / (X + 2), (h - top - bottom) / (D + SKY)));
  const ox = (w - s * X) / 2, oy = top + SKY * s;
  const sx = (x) => ox + x * s, sy = (d) => oy + d * s;
  const bed = sy(D);
  const u = Math.max(s, 16);   // cỡ hình tối thiểu khi bản đồ rộng (chỉ đổi hình, không đổi vị trí)
  const p = snap.player;
  const underwater = p ? (p.at_surface === undefined ? p.pos[1] > 0.5 : !p.at_surface) : false;

  // trời bình minh + mặt trời
  const sky = ctx.createLinearGradient(0, 0, 0, oy);
  sky.addColorStop(0, "#f3b98a"); sky.addColorStop(0.55, "#f9dcb4"); sky.addColorStop(1, "#cdeeee");
  ctx.fillStyle = sky; ctx.fillRect(0, 0, w, oy);
  const sunX = w * 0.8, sunY = oy - SKY * s * 0.45;
  const sg = ctx.createRadialGradient(sunX, sunY, 4, sunX, sunY, 90);
  sg.addColorStop(0, "rgba(255,246,214,.95)"); sg.addColorStop(0.25, "rgba(255,226,170,.55)"); sg.addColorStop(1, "rgba(255,210,150,0)");
  ctx.fillStyle = sg; ctx.fillRect(sunX - 90, sunY - 90, 180, 180);
  // rặng dừa nước bờ xa
  ctx.fillStyle = "#4f7a55";
  ctx.beginPath(); ctx.moveTo(0, oy);
  for (let x = 0; x <= w + 20; x += 16) ctx.lineTo(x, oy - s * (0.9 + 0.55 * (Math.sin(x * 0.045) * 0.5 + 0.5) + 0.35 * Math.sin(x * 0.13)));
  ctx.lineTo(w, oy); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = "#3c6344"; ctx.lineWidth = 2;
  for (let x = 10; x < w; x += 46) {
    const hh = s * (1.6 + 0.6 * Math.sin(x)), bx = x, by = oy - s * 0.8;
    for (let k = -2; k <= 2; k++) { ctx.beginPath(); ctx.moveTo(bx, by); ctx.quadraticCurveTo(bx + k * s * 0.35, by - hh, bx + k * s * 0.75, by - hh * 0.65); ctx.stroke(); }
  }
  ctx.lineWidth = 1;

  // nước phù sa xanh ngọc
  const water = ctx.createLinearGradient(0, oy, 0, bed);
  water.addColorStop(0, "#5aa7a0"); water.addColorStop(0.3, "#2f7576"); water.addColorStop(0.7, "#164556"); water.addColorStop(1, "#0b2633");
  ctx.fillStyle = water; ctx.fillRect(0, oy, w, bed - oy);
  // tia nắng xuyên nước
  for (let i = 0; i < 6; i++) {
    const x0 = (w * (i + 0.5)) / 6 + Math.sin(t * 0.25 + i * 1.7) * 30;
    const lg = ctx.createLinearGradient(0, oy, 0, bed);
    lg.addColorStop(0, "rgba(255,250,220,.13)"); lg.addColorStop(1, "rgba(255,250,220,0)");
    ctx.fillStyle = lg; ctx.beginPath(); ctx.moveTo(x0 - 14, oy); ctx.lineTo(x0 + 16, oy); ctx.lineTo(x0 + 110, bed); ctx.lineTo(x0 + 40, bed); ctx.closePath(); ctx.fill();
  }
  // vạch độ sâu
  for (let d = 5; d <= D; d += 5) {
    ctx.strokeStyle = "rgba(255,255,255,.06)"; ctx.setLineDash([2, 8]); ctx.beginPath(); ctx.moveTo(sx(0), sy(d)); ctx.lineTo(sx(X), sy(d)); ctx.stroke(); ctx.setLineDash([]);
    text(d + " m", sx(0) + 6, sy(d) - 4, { size: 10, color: "rgba(230,250,255,.4)", weight: 600 });
  }
  // đáy sông + rong
  const mud = ctx.createLinearGradient(0, bed, 0, h);
  mud.addColorStop(0, "#4a3a28"); mud.addColorStop(1, "#211910");
  ctx.fillStyle = mud; ctx.beginPath(); ctx.moveTo(0, bed);
  for (let x = 0; x <= w; x += 20) ctx.lineTo(x, bed + Math.sin(x * 0.03) * 3);
  ctx.lineTo(w, h); ctx.lineTo(0, h); ctx.closePath(); ctx.fill();
  ctx.lineWidth = 2.2; ctx.lineCap = "round";
  for (let x = sx(0) + 8; x < sx(X); x += 19) {
    const hh = s * (1 + 0.9 * (Math.sin(x * 0.7) * 0.5 + 0.5)), sw = Math.sin(t * 1.3 + x * 0.05) * s * 0.35;
    ctx.strokeStyle = x % 3 < 1.5 ? "rgba(96,150,80,.85)" : "rgba(70,122,66,.85)";
    ctx.beginPath(); ctx.moveTo(x, bed + 2); ctx.quadraticCurveTo(x + sw * 0.4, bed - hh * 0.5, x + sw, bed - hh); ctx.stroke();
  }
  ctx.lineWidth = 1; ctx.lineCap = "butt";
  // ngoài biên: tối đi
  ctx.fillStyle = "rgba(4,12,18,.35)";
  ctx.fillRect(0, oy, Math.max(0, sx(0)), bed - oy); ctx.fillRect(sx(X), oy, Math.max(0, w - sx(X)), bed - oy);

  // mặt nước gợn sóng
  ctx.fillStyle = "rgba(255,255,255,.18)";
  ctx.beginPath(); ctx.moveTo(0, oy);
  for (let x = 0; x <= w; x += 8) ctx.lineTo(x, oy + Math.sin(x * 0.045 + t * 2) * 2.2);
  for (let x = w; x >= 0; x -= 8) ctx.lineTo(x, oy + 6 + Math.sin(x * 0.03 + t * 1.4) * 2);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,.85)"; ctx.lineWidth = 2; ctx.beginPath();
  for (let x = 0; x <= w; x += 8) ctx.lineTo(x, oy + Math.sin(x * 0.045 + t * 2) * 2.2);
  ctx.stroke(); ctx.lineWidth = 1;

  // bến + ghe
  const dp = meta.dock_pos || [2, 0], dr = meta.dock_radius || 3;
  const bob = Math.sin(t * 1.6) * 0.08;
  ctx.fillStyle = "#5c3b22";
  [-1.6, 1.6].forEach((o) => ctx.fillRect(sx(dp[0] + o) - 3, sy(-0.7), 6, sy(2.2) - sy(-0.7)));
  ctx.fillStyle = "#8d6440"; rr(sx(dp[0] - 2.2), sy(-0.85), 4.4 * s, 0.32 * s, 3); ctx.fill();
  const bx0 = sx(dp[0] + 0.2), by0 = sy(-0.05 + bob);
  ctx.fillStyle = "#6e3f22"; ctx.beginPath();
  ctx.moveTo(bx0 - 2.4 * s, by0 - 0.55 * s); ctx.quadraticCurveTo(bx0 - 1.8 * s, by0 + 0.45 * s, bx0, by0 + 0.45 * s);
  ctx.quadraticCurveTo(bx0 + 1.8 * s, by0 + 0.45 * s, bx0 + 2.4 * s, by0 - 0.55 * s); ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#b8442f"; ctx.fillRect(bx0 - 2.1 * s, by0 - 0.45 * s, 4.2 * s, 0.13 * s);
  ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.ellipse(bx0 + 1.75 * s, by0 - 0.15 * s, 0.17 * s, 0.1 * s, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = "#111"; ctx.beginPath(); ctx.arc(bx0 + 1.78 * s, by0 - 0.15 * s, 0.06 * s, 0, TAU); ctx.fill();
  ctx.fillStyle = "#c59a5c"; ctx.beginPath(); ctx.ellipse(bx0 - 0.4 * s, by0 - 0.55 * s, 1.1 * s, 0.6 * s, 0, Math.PI, TAU); ctx.fill();
  ctx.strokeStyle = hexA(C.gold, 0.55); ctx.setLineDash([6, 5]); ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(sx(dp[0]), sy(dp[1]), dr * s, 0, TAU); ctx.stroke(); ctx.setLineDash([]); ctx.lineWidth = 1;
  pill("Bến · E cập bến", sx(dp[0]) - 50, sy(-2.1), "#6b3f1d", { size: 11, fill: "rgba(255,240,215,.9)", textColor: "#5a3418" });

  // nút hái
  const regrowMax = (meta.regrow_s || 20) * 60;
  (snap.nodes || []).forEach((nd) => {
    const ready = nd.ready !== false, x = sx(nd.pos[0]), y = sy(nd.pos[1]);
    const sway = Math.sin(t * 1.5 + nd.pos[0]) * 0.05 * s;
    ctx.fillStyle = ready ? "#4f9a4a" : "rgba(79,154,74,.55)";
    ctx.beginPath(); ctx.ellipse(x, y + 0.05 * u, 0.95 * u, 0.24 * u, 0, 0.25, TAU - 0.05); ctx.lineTo(x, y + 0.05 * u); ctx.closePath(); ctx.fill();
    ctx.globalAlpha = ready ? 1 : 0.35;
    if (nd.kind === "bong_sung") lotusFlower(x + sway, y - 0.25 * u, 0.6 * u);
    else if (nd.kind === "bong_dien_dien") dienDien(x + sway, y - 0.55 * u, 0.75 * u);
    else itemIcon(nd.kind, x, y - 0.4 * u, 1.1 * u);
    ctx.globalAlpha = 1;
    if (!ready && nd.regrow_ticks) {
      ring(x, y - 1.6 * u, 0.45 * u + 4, 1 - nd.regrow_ticks / regrowMax, "#b6df8a", 3);
      text(Math.ceil(nd.regrow_ticks / 60) + "s", x, y - 1.6 * u + 1, { size: 10, weight: 700, align: "center", base: "middle", color: "#1f3a1a" });
    }
    if (showLog) text(nd.id, x, y + 0.75 * s, { size: 10, align: "center", color: "rgba(255,255,255,.75)" });
  });

  // đàn cá
  (snap.fish || []).forEach((f, i) => {
    const ang = ((f.heading_deg || 0) * Math.PI) / 180;
    fishShape(sx(f.pos[0]), sy(f.pos[1]), 1.9 * u, kc(f.kind), ang, t + i * 0.7);
    if (showLog) text(f.id, sx(f.pos[0]), sy(f.pos[1]) - 0.7 * s, { size: 10, align: "center", color: "rgba(255,255,255,.8)" });
  });

  // bọt nước
  updateBubbles(p, underwater, dt, performance.now());
  ctx.strokeStyle = "rgba(220,250,255,.65)";
  bubbles.forEach((bb) => { ctx.beginPath(); ctx.arc(sx(bb.x), sy(bb.d), bb.r * u, 0, TAU); ctx.stroke(); });

  // người chơi (Út Sen)
  if (p && p.pos) {
    const px = sx(p.pos[0]), py = sy(p.pos[1]);
    if (meta.catch_radius && underwater) { ctx.strokeStyle = "rgba(255,255,255,.22)"; ctx.setLineDash([4, 6]); ctx.beginPath(); ctx.arc(px, py, meta.catch_radius * s, 0, TAU); ctx.stroke(); ctx.setLineDash([]); }
    if (meta.interact_radius && !underwater) { ctx.strokeStyle = hexA(C.gold, 0.45); ctx.setLineDash([4, 6]); ctx.beginPath(); ctx.arc(px, py, meta.interact_radius * s, 0, TAU); ctx.stroke(); ctx.setLineDash([]); }
    if (!(p.invuln_ticks > 0 && Math.floor((snap.tick || 0) / 5) % 2)) {
      const ang = ((p.heading_deg || 0) * Math.PI) / 180, L = Math.max(34, 2.4 * s);
      ctx.save(); ctx.translate(px, py); ctx.rotate(underwater ? ang : 0);
      if (underwater && Math.cos(ang) < 0) ctx.scale(1, -1);
      if (!underwater && Math.cos(ang) < 0) ctx.scale(-1, 1);
      const kick = Math.sin(t * 10) * 0.12 * L;
      ctx.strokeStyle = "#e0a878"; ctx.lineWidth = Math.max(2, 0.14 * s); ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(-0.25 * L, 0.05 * L); ctx.lineTo(-0.62 * L, 0.05 * L + kick); ctx.moveTo(-0.25 * L, 0.05 * L); ctx.lineTo(-0.6 * L, 0.12 * L - kick); ctx.stroke();
      ctx.lineCap = "butt"; ctx.lineWidth = 1;
      ctx.fillStyle = "#2f4f8f"; ctx.beginPath(); ctx.ellipse(-0.18 * L, 0.04 * L, 0.18 * L, 0.11 * L, 0, 0, TAU); ctx.fill();   // quần
      ctx.fillStyle = "#ff8a3d"; ctx.beginPath(); ctx.ellipse(0.06 * L, 0, 0.24 * L, 0.13 * L, 0, 0, TAU); ctx.fill();       // áo bà ba
      ctx.fillStyle = "#f2c79a"; ctx.beginPath(); ctx.arc(0.38 * L, -0.04 * L, 0.12 * L, 0, TAU); ctx.fill();               // mặt
      ctx.fillStyle = "#2a1a12"; ctx.beginPath(); ctx.arc(0.36 * L, -0.08 * L, 0.12 * L, Math.PI * 0.9, Math.PI * 2.05); ctx.fill(); // tóc
      if (!underwater) { ctx.fillStyle = "#ecd59a"; ctx.beginPath(); ctx.moveTo(0.14 * L, -0.12 * L); ctx.lineTo(0.37 * L, -0.42 * L); ctx.lineTo(0.62 * L, -0.12 * L); ctx.closePath(); ctx.fill(); }
      ctx.restore();
    }
    if (p.catch_cd_ticks > 0) ring(px, py, 1.05 * s, p.catch_cd_ticks / ((meta.catch_cooldown_s || 0.5) * 60), "rgba(255,255,255,.75)", 2.5);
  }

  // ---- HUD trên trái: giờ · oxy · máu ----
  const pw = 400;
  panel(16, 14, pw, 76);
  text("CÒN LẠI", 32, 36, { size: 10, weight: 700, color: C.dim });
  text(fmtTime(snap.time_left_ticks), 30, 72, { size: 32, kind: "d", weight: 800, color: (snap.time_left_ticks || 0) < 1800 ? C.warn : C.cream });
  ctx.fillStyle = "rgba(255,255,255,.12)"; ctx.fillRect(122, 26, 1, 52);
  if (p && p.oxygen_ticks !== undefined && p.oxygen_max_ticks) {
    const fr = p.oxygen_ticks / p.oxygen_max_ticks, low = fr < 0.25;
    const pulse = low ? 0.65 + 0.35 * Math.sin(t * 10) : 1;
    bubbleIcon(146, 38, 7);
    ctx.globalAlpha = pulse;
    bar(164, 30, pw - 164, 16, fr, low ? C.danger : C.oxy, { label: "Oxy " + Math.ceil(p.oxygen_ticks / 60) + "s" });
    ctx.globalAlpha = 1;
  }
  let hx = 146;
  if (p && p.hp !== undefined && p.hp_max) {
    for (let i = 0; i < p.hp_max; i++) heart(146 + i * 22, 66, 8, i < p.hp);
    hx = 146 + p.hp_max * 22;
  }
  if (p && p.at_surface !== undefined) {
    const depth = p.pos ? p.pos[1].toFixed(1) + " m" : "";
    pill(p.at_surface ? "Mặt nước · hồi oxy" : "Dưới nước · sâu " + depth, hx + 4, 66, p.at_surface ? "#9be3f7" : C.oxy);
  }

  // ---- cảnh báo ngạt / oxy thấp ----
  let toastY = 104;
  if (p && p.oxygen_ticks === 0 && p.at_surface !== true && !snap.finished) {
    const pulse = 0.28 + 0.18 * Math.sin(t * 9);
    const vg = ctx.createRadialGradient(w / 2, h / 2, Math.min(w, h) * 0.3, w / 2, h / 2, Math.max(w, h) * 0.75);
    vg.addColorStop(0, "rgba(255,30,30,0)"); vg.addColorStop(1, `rgba(255,30,30,${pulse})`);
    ctx.fillStyle = vg; ctx.fillRect(0, 0, w, h);
    const iv = meta.choke_interval_ticks;
    const sub = iv && p.zero_oxy_ticks !== undefined ? "Mất 1 ♥ sau " + ((iv - (p.zero_oxy_ticks % iv)) / 60).toFixed(1) + " giây — bơi lên ngay (W)" : "Bơi lên mặt nước ngay (W)";
    banner(w, 104, "HẾT OXY!", sub, C.danger);
    toastY = 172;
  } else if (p && p.oxygen_max_ticks && p.oxygen_ticks < p.oxygen_max_ticks * 0.25 && p.at_surface === false && !snap.finished) {
    banner(w, 104, "Oxy sắp hết — quay lên!", null, C.warn);
    toastY = 154;
  }
  drawToasts(w, toastY);

  // ---- giỏ (dưới trái) ----
  if (snap.hold && snap.hold_capacity) {
    const cap = snap.hold_capacity, full = snap.hold.length >= cap;
    const sz = Math.max(18, Math.min(32, (w - 200) / cap - 5)), gap = 5;
    const bw = 104 + cap * (sz + gap), bh = sz + 30, by = h - bh - 46;
    panel(16, by, bw, bh, { edge: full ? hexA(C.warn, 0.8) : C.edge, lw: full ? 2 : 1.5 });
    text("GIỎ", 30, by + 22, { size: 10, weight: 700, color: C.dim });
    text(snap.hold.length + "/" + cap, 30, by + bh - 12, { size: 22, kind: "d", weight: 800, color: full ? C.warn : C.cream });
    for (let i = 0; i < cap; i++) {
      const x0 = 96 + i * (sz + gap), y0 = by + 15;
      rr(x0, y0, sz, sz, 7); ctx.fillStyle = "rgba(255,255,255,.07)"; ctx.fill();
      ctx.strokeStyle = i === snap.hold.length - 1 ? hexA(C.gold, 0.8) : "rgba(255,255,255,.14)"; ctx.stroke();
      if (snap.hold[i]) itemIcon(snap.hold[i], x0 + sz / 2, y0 + sz / 2, sz * 0.8);
    }
    if (full) pill("ĐẦY · về bến giao hàng", 16 + bw + 10, by + bh / 2, C.warn);
  }
  keycaps(w, h, [["WASD", "bơi"], ["E", "hái · cập bến"], ["Space", "bắt cá"], ["R", "chơi lại"], ["L", "nhật ký"]]);
}

// =====================================================================================
// ----- cảnh QUÁN: nhìn từ trên xuống, x sang phải, z lên (bắc) -----
function drawQuan(w, h, t) {
  const meta = snap.meta || {};
  const b = meta.bounds || { x: [0, 16], z: [0, 10] };
  const X = b.x[1], Z = b.z[1];
  const cs = snap.customers || [];
  const side = w >= 820 ? 300 : 0;                                  // chỗ cho bảng đơn gọi
  const top = 108, bottom = 128;
  const s = Math.max(1, Math.min((w - 48 - side) / X, (h - top - bottom) / Z));
  const ox = (w - side - s * X) / 2, oy = top;
  const sx = (x) => ox + x * s, sy = (z) => oy + (Z - z) * s;

  // sông đêm + ánh đèn phản chiếu
  const night = ctx.createLinearGradient(0, 0, 0, h);
  night.addColorStop(0, "#0e1d30"); night.addColorStop(1, "#060d16");
  ctx.fillStyle = night; ctx.fillRect(0, 0, w, h);
  for (let i = 0; i < 26; i++) {
    const y = (i / 26) * h + Math.sin(t * 0.8 + i) * 3, x = ((i * 137) % w), len = 30 + (i * 53) % 70;
    ctx.strokeStyle = i % 3 ? "rgba(255,190,110,.07)" : "rgba(160,200,255,.06)"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + len, y); ctx.stroke();
  }
  ctx.lineWidth = 1;

  // sàn ghe: ván gỗ
  const dx = sx(0), dy = sy(Z), dw = X * s, dh = Z * s;
  ctx.shadowColor = "rgba(0,0,0,.55)"; ctx.shadowBlur = 30; ctx.shadowOffsetY = 10;
  rr(dx - 10, dy - 10, dw + 20, dh + 20, 26); ctx.fillStyle = "#4a2c17"; ctx.fill();
  ctx.shadowColor = "transparent"; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
  ctx.save(); rr(dx, dy, dw, dh, 18); ctx.clip();
  const plank = 0.8 * s;
  for (let i = 0; i * plank < dh; i++) {
    ctx.fillStyle = i % 2 ? "#a06c3e" : "#94633a"; ctx.fillRect(dx, dy + i * plank, dw, plank);
    ctx.fillStyle = "rgba(0,0,0,.22)"; ctx.fillRect(dx, dy + i * plank, dw, 1.5);
    const seam = ((i * 3.7) % 6 + 2) * s; ctx.fillRect(dx + seam, dy + i * plank, 1.5, plank); ctx.fillRect(dx + seam + 7 * s, dy + i * plank, 1.5, plank);
  }
  const warm = ctx.createRadialGradient(dx + dw / 2, dy + dh / 2, 10, dx + dw / 2, dy + dh / 2, Math.max(dw, dh) * 0.7);
  warm.addColorStop(0, "rgba(255,200,120,.12)"); warm.addColorStop(1, "rgba(0,0,0,.28)");
  ctx.fillStyle = warm; ctx.fillRect(dx, dy, dw, dh);
  ctx.restore();
  // dây đèn lồng
  ctx.strokeStyle = "rgba(40,25,15,.9)"; ctx.lineWidth = 1.5;
  const lanterns = Math.max(3, Math.round(X / 2.2));
  ctx.beginPath(); ctx.moveTo(dx, dy - 4);
  for (let i = 1; i <= lanterns; i++) ctx.quadraticCurveTo(dx + (dw * (i - 0.5)) / lanterns, dy + 12, dx + (dw * i) / lanterns, dy - 4);
  ctx.stroke(); ctx.lineWidth = 1;
  for (let i = 0; i < lanterns; i++) {
    const lx = dx + (dw * (i + 0.5)) / lanterns, ly = dy + 10 + Math.sin(t * 1.5 + i) * 1.5, col = i % 2 ? "#f0b43a" : "#d8392b";
    const glow = ctx.createRadialGradient(lx, ly, 2, lx, ly, 46);
    glow.addColorStop(0, hexA(col, 0.4)); glow.addColorStop(1, hexA(col, 0));
    ctx.fillStyle = glow; ctx.fillRect(lx - 46, ly - 46, 92, 92);
    ctx.fillStyle = col; ctx.beginPath(); ctx.ellipse(lx, ly, 7, 9, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = "#3a2410"; ctx.fillRect(lx - 4, ly - 11, 8, 3); ctx.fillRect(lx - 4, ly + 8, 8, 3);
  }

  // bếp cà ràng
  (snap.stoves || []).forEach((st) => {
    const x = sx(st.pos[0]), y = sy(st.pos[1]), r = 0.8 * s;
    if (st.state === "cooking") {
      const fg = ctx.createRadialGradient(x, y, 2, x, y, r * 2.2);
      fg.addColorStop(0, `rgba(255,140,40,${0.55 + 0.15 * Math.sin(t * 12)})`); fg.addColorStop(1, "rgba(255,120,30,0)");
      ctx.fillStyle = fg; ctx.fillRect(x - r * 2.2, y - r * 2.2, r * 4.4, r * 4.4);
    } else if (st.state === "ready") {
      const gg = ctx.createRadialGradient(x, y, 2, x, y, r * 2);
      gg.addColorStop(0, `rgba(140,230,120,${0.45 + 0.2 * Math.sin(t * 5)})`); gg.addColorStop(1, "rgba(140,230,120,0)");
      ctx.fillStyle = gg; ctx.fillRect(x - r * 2, y - r * 2, r * 4, r * 4);
    }
    rr(x - r, y - r, 2 * r, 2 * r, r * 0.45); ctx.fillStyle = "#7a3a22"; ctx.fill(); ctx.strokeStyle = "#4b2213"; ctx.lineWidth = 2; ctx.stroke(); ctx.lineWidth = 1;
    ctx.fillStyle = st.state === "cooking" ? "#ff9a3c" : "#2a1a12"; ctx.beginPath(); ctx.arc(x, y + r * 0.55, r * 0.28, Math.PI, TAU); ctx.fill();
    ctx.fillStyle = "#2e2e33"; ctx.beginPath(); ctx.arc(x, y - r * 0.05, r * 0.62, 0, TAU); ctx.fill();
    ctx.fillStyle = "#4a4a52"; ctx.beginPath(); ctx.arc(x - r * 0.15, y - r * 0.2, r * 0.42, 0, TAU); ctx.fill();
    if (st.state === "ready" || st.state === "cooking") {
      ctx.strokeStyle = "rgba(255,255,255,.45)"; ctx.lineWidth = 2;
      for (let k = -1; k <= 1; k++) {
        const ph = (t * 0.8 + k * 0.33) % 1, yy = y - r * 0.6 - ph * r * 1.6;
        ctx.globalAlpha = 1 - ph; ctx.beginPath(); ctx.moveTo(x + k * r * 0.35, yy); ctx.quadraticCurveTo(x + k * r * 0.35 + 5 * Math.sin(t * 3 + k), yy - 8, x + k * r * 0.35, yy - 16); ctx.stroke();
      }
      ctx.globalAlpha = 1; ctx.lineWidth = 1;
    }
    const label = (STOVE_STATE[st.state] || st.state || "") + (st.state === "cooking" && st.cook_ticks_left ? " · " + Math.ceil(st.cook_ticks_left / 60) + "s" : "");
    const col = st.state === "ready" ? C.ok : st.state === "cooking" ? C.warn : C.muted;
    if (label) { const lw = measure(label, 11, "b", 600) + 16; pill(label, x - lw / 2, y + r + 14, col, { fill: "rgba(30,20,12,.85)" }); }
    if (st.dish) { const lw = measure(dn(st.dish), 11, "b", 600) + 16; pill(dn(st.dish), x - lw / 2, y - r - 14, C.cream, { fill: "rgba(30,20,12,.85)" }); }
    if (showLog) text(st.id, x, y + 4, { size: 10, align: "center", color: "#fff" });
  });

  // bàn + khách
  const patMax = (meta.patience_s || 60) * 60, eatMax = (meta.eat_s || 10) * 60;
  const byTable = {};
  cs.forEach((c) => (byTable[c.table_id] = c));
  (snap.tables || []).forEach((tb) => {
    const x = sx(tb.pos[0]), y = sy(tb.pos[1]), r = 0.85 * s;
    ctx.fillStyle = "#4a2c17";
    [[-1.25, 0], [1.25, 0]].forEach(([a]) => { ctx.beginPath(); ctx.arc(x + a * r, y + r * 0.2, r * 0.32, 0, TAU); ctx.fill(); });
    ctx.fillStyle = "#6b4426"; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
    ctx.strokeStyle = "#8c5c34"; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(x, y, r * 0.75, 0, TAU); ctx.stroke(); ctx.lineWidth = 1;
    text(tb.id, x, y + 1, { size: 11, weight: 700, align: "center", base: "middle", color: "rgba(255,236,200,.7)" });
    const c = byTable[tb.id];
    if (c) {
      const hx = x, hy = y - r * 1.55;
      nonLa(hx, hy, 0.5 * s);
      if (c.state === "eating") { if (c.eat_ticks_left !== undefined) ring(hx, hy, 0.5 * s + 5, 1 - c.eat_ticks_left / eatMax, C.ok, 3); }
      else if (c.patience_ticks_left !== undefined) {
        const fr = c.patience_ticks_left / patMax;
        ring(hx, hy, 0.5 * s + 5, fr, fr < 0.25 ? C.danger : fr < 0.5 ? C.warn : C.ok, 3);
      }
      // bong bóng gọi món
      const label = c.state === "eating" ? "đang ăn" : dn(c.dish_id), lw = measure(label, 11, "b", 600) + 34, bx = hx - lw / 2, by = hy - 0.5 * s - 34;
      rr(bx, by, lw, 24, 10); ctx.fillStyle = "rgba(255,248,232,.95)"; ctx.fill();
      ctx.beginPath(); ctx.moveTo(hx - 5, by + 24); ctx.lineTo(hx, by + 30); ctx.lineTo(hx + 5, by + 24); ctx.fill();
      if (c.state !== "eating") itemIcon(DISH_MAIN[c.dish_id], bx + 14, by + 12, 16);
      text(label, bx + (c.state === "eating" ? 10 : 25), by + 12.5, { size: 11, weight: 600, base: "middle", color: c.order_status === "unfulfillable" ? "#b3261e" : "#3a2410" });
    }
  });

  // người chơi
  const p = snap.player;
  if (p && p.pos) {
    const px = sx(p.pos[0]), py = sy(p.pos[1]);
    if (meta.interact_radius) { ctx.strokeStyle = hexA(C.gold, 0.5); ctx.setLineDash([5, 5]); ctx.beginPath(); ctx.arc(px, py, meta.interact_radius * s, 0, TAU); ctx.stroke(); ctx.setLineDash([]); }
    ctx.fillStyle = "rgba(0,0,0,.3)"; ctx.beginPath(); ctx.ellipse(px + 3, py + 5, 0.62 * s, 0.5 * s, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = "#ff8a3d"; ctx.beginPath(); ctx.arc(px, py, 0.55 * s, 0, TAU); ctx.fill();
    nonLa(px, py, 0.62 * s);
    if (snap.hand) {
      const hd = typeof snap.hand === "string" ? snap.hand : snap.hand.dish_id;
      const bx = px + 0.75 * s, by = py - 0.35 * s;
      ctx.fillStyle = "#f6f1e6"; ctx.beginPath(); ctx.arc(bx, by, 0.32 * s, 0, Math.PI); ctx.fill();
      ctx.fillRect(bx - 0.36 * s, by - 2, 0.72 * s, 3);
      if (DISH_MAIN[hd]) itemIcon(DISH_MAIN[hd], bx, by - 0.08 * s, 0.4 * s);
    }
  }

  // ---- HUD trên trái: giờ · tiền · uy tín · điểm · trên tay ----
  const pw = Math.min(470, w - 32 - (side ? side + 8 : 0));
  panel(16, 14, pw, 80);
  text("CÒN LẠI", 32, 36, { size: 10, weight: 700, color: C.dim });
  text(fmtTime(snap.time_left_ticks), 30, 74, { size: 32, kind: "d", weight: 800, color: (snap.time_left_ticks || 0) < 1800 ? C.warn : C.cream });
  ctx.fillStyle = "rgba(255,255,255,.12)"; ctx.fillRect(122, 26, 1, 56);
  coin(148, 42, 10);
  text((snap.money ?? 0) + "k", 166, 51, { size: 24, kind: "d", weight: 800, color: C.gold });
  const rep = snap.reputation ?? 0, repMax = meta.reputation_max || 5;
  const stX = 166 + measure((snap.money ?? 0) + "k", 24, "d", 800) + 22;
  for (let i = 0; i < repMax; i++) star(stX + i * 19, 42, 8, rep - i);
  text(rep1(rep), stX + repMax * 19 - 2, 47, { size: 13, weight: 700, color: C.muted });
  text("Điểm " + (snap.score ?? 0), 140, 78, { size: 12, weight: 600, color: C.muted });
  if (snap.hand !== undefined) {
    const hd = snap.hand ? dn(typeof snap.hand === "string" ? snap.hand : snap.hand.dish_id) : "tay trống";
    pill("Trên tay: " + hd, 214, 74, snap.hand ? C.gold : C.dim);
  }

  // ---- bảng đơn gọi (phải) ----
  if (side) {
    const x0 = w - side - 4, cw = side - 12, ch = 58;
    const shown = cs.slice(0, Math.max(1, Math.floor((h - 160) / (ch + 8))));
    const ph = 44 + Math.max(1, shown.length) * (ch + 8);
    panel(x0, 14, cw, ph);
    text("Đơn gọi", x0 + 16, 42, { size: 18, kind: "d", weight: 800 });
    text(cs.length ? cs.length + " bàn" : "", x0 + cw - 16, 41, { size: 12, align: "right", color: C.muted, weight: 600 });
    if (!cs.length) text("Chưa có khách — khách tới theo lịch", x0 + 16, 80, { size: 12, color: C.dim });
    shown.forEach((c, i) => {
      const y = 54 + i * (ch + 8);
      rr(x0 + 10, y, cw - 20, ch, 10); ctx.fillStyle = "rgba(255,255,255,.05)"; ctx.fill();
      itemIcon(DISH_MAIN[c.dish_id], x0 + 32, y + 22, 24);
      text(dn(c.dish_id), x0 + 52, y + 21, { size: 13, weight: 700, color: c.order_status === "unfulfillable" ? "#ff9a8f" : C.cream });
      text("Bàn " + (c.table_id || "?"), x0 + 52, y + 38, { size: 11, color: C.muted });
      const [st, col] = c.state === "eating" ? ["Đang ăn", C.ok] : (ORDER_STATUS[c.order_status] || [c.order_status || c.state || "", C.muted]);
      if (st) { const lw = measure(st, 10, "b", 600) + 14; pill(st, x0 + cw - 20 - lw, y + 33, col, { size: 10, pad: 7 }); }
      if (c.state === "eating" && c.eat_ticks_left !== undefined) bar(x0 + 20, y + ch - 10, cw - 40, 5, 1 - c.eat_ticks_left / eatMax, C.ok);
      else if (c.patience_ticks_left !== undefined) { const fr = c.patience_ticks_left / patMax; bar(x0 + 20, y + ch - 10, cw - 40, 5, fr, fr < 0.25 ? C.danger : fr < 0.5 ? C.warn : C.ok); }
    });
  }

  // ---- kho khả dụng (dưới trái) = stock − Σ reserved ----
  const held = {};
  cs.forEach((c) => { if (c.reserved) Object.keys(c.reserved).forEach((k) => (held[k] = (held[k] || 0) + c.reserved[k])); });
  const kinds = snap.stock ? Object.keys(snap.stock) : [];
  const kw = Math.max(150, 30 + kinds.length * 96), ky = h - 46 - 70;
  panel(16, ky, Math.min(kw, w - 32), 70);
  text("KHO KHẢ DỤNG", 30, ky + 20, { size: 10, weight: 700, color: C.dim });
  if (!kinds.length) text("(trống)", 30, ky + 48, { size: 13, color: C.muted });
  kinds.forEach((k, i) => {
    const tot = snap.stock[k], av = Math.max(0, tot - (held[k] || 0)), x = 30 + i * 96;
    itemIcon(k, x + 12, ky + 43, 22);
    text(av === tot ? "×" + tot : av + "/" + tot, x + 30, ky + 45, { size: 16, kind: "d", weight: 800, color: av === 0 ? C.danger : C.cream });
    text(KIND_NAME[k] || k, x + 30, ky + 60, { size: 10, color: C.muted, weight: 500 });
  });
  drawToasts(w - side, 108);
  keycaps(w, h, [["WASD", "đi"], ["E", "bếp · bàn"], ["R", "chơi lại"], ["L", "nhật ký"]]);
}

// =====================================================================================
let lastFrame = performance.now();
function frame() {
  requestAnimationFrame(frame);  // đặt trước để lỗi vẽ không làm dừng vòng lặp
  const now = performance.now(), dt = Math.min(0.1, (now - lastFrame) / 1000), t = now / 1000;
  lastFrame = now;
  const [w, h] = fit();
  ctx.fillStyle = "#0b1622"; ctx.fillRect(0, 0, w, h);
  if (snap) {
    collectToasts();
    if (snap.mode === "quan") drawQuan(w, h, t); else drawGather(w, h, t, dt);
    eventLog(w, h);
    overlay(w, h);
  } else {
    text("Quán Ăn Chợ Nổi", w / 2, h / 2 - 8, { kind: "d", size: 36, weight: 800, align: "center", color: C.gold });
    text(offline ? "Không kết nối được máy chủ — đã chạy python -m chonoi.live chưa?" : "Đang tải…", w / 2, h / 2 + 26, { align: "center", size: 15, color: C.muted });
  }
}
requestAnimationFrame(frame);
</script>
